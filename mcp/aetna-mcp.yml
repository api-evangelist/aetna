search_note: 'NO MCP server exists. Searched npm (registry search for aetna, and for @modelcontextprotocol
  servers naming Aetna), the Aetna Developer Portal, the aetnahealth GitHub organization (which has zero public
  repositories), and probed every Aetna host for an agent surface: /.well-known/ai-plugin.json, /.well-known/agent-card.json
  and /.well-known/agent.json all return 404 on apif1.aetna.com, vteapif1.aetna.com and www.aetna.com (developerportal.aetna.com
  returned 403 to this run''s IP and so is not evidence either way). The tools below are a DERIVED CANDIDATE
  surface computed from Aetna''s own OpenAPI operations - a proposal for what an MCP server over these FHIR
  APIs would expose, not something anyone ships today. No endpoint URL is guessed.'
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
  note: 'mode is none because Aetna publishes neither a remote MCP endpoint nor a local stdio package. If Aetna
    ever ships one, every tool below would carry SMART on FHIR OAuth 2.0 with a member patient context - including
    the provider directory, which unlike several peer payers Aetna does NOT expose anonymously. That makes
    an Aetna MCP server harder to stand up than a directory-only one: there is no unauthenticated tool in the
    set.'
