name: Aetna
description: 'Aetna, a CVS Health company, is one of the largest U.S. health insurers, offering medical,
  dental, vision, pharmacy and Medicare/Medicaid plans to individuals, families, employers, health care
  providers and brokers. Its public API surface is entirely regulatory: Aetna operates an Interoperability
  API Developer Portal at developerportal.aetna.com that publishes HL7 FHIR R4 interfaces mandated by
  the CMS Interoperability and Patient Access Final Rule (CMS-9115-F) and the Advancing Interoperability
  and Improving Prior Authorization Final Rule (CMS-0057-F) - Patient Access, Payer to Payer, Provider
  Directory, Provider Access, Prior Authorization (Da Vinci CRD, PAS and CDex) and Realtime Pharmacy Benefit
  Check. Aetna publishes a machine-readable catalog of 139 operations and serves a Swagger 2.0 document
  for each one, plus live FHIR CapabilityStatements and SMART App Launch discovery documents on its production
  and sandbox FHIR gateways. Everything is read-only, everything requires OAuth 2.0 under SMART App Launch,
  and everything is free - there is no pricing, no plan and no metered product. Provider EDI connectivity
  is handled separately through the Availity portal.'
