- aid: aetna-provider-edi-api
  name: Aetna Provider EDI Connectivity
  description: HIPAA X12 electronic data interchange for health care professionals - EDI 837 claims, 270/271
    eligibility and benefits, 276/277 claim status and 835 remittance advice. This is not an Aetna-hosted
    REST API and Aetna publishes no machine-readable contract for it; connectivity runs through the Availity
    provider portal and through clearinghouses, against the ASC X12 5010 and NCPDP D.0 transaction standards
    Aetna documents on aetna.com.
