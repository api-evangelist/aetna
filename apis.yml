- aid: aetna-provider-access-fhir-api
  name: Aetna Provider Access FHIR API
  description: Launched in Production on 2026-03-27 under the public-provider-group-fhir product, the
    Provider Access API lets provider organizations and EHR vendors identify their attributed member groups
    and request a bulk data export for treatment purposes. Operations cover /provideraccess/v1/Group,
    /Group/{id}, /Group/$exportstatus/{id}, /Group/{id}/$davinci-data-export and /Group/ExportFile/{fileId},
    implementing Da Vinci PDex STU 2.1.0 with Bulk Data Access IG STU 3.0.0. A dedicated ECS Provider
    role was added 2026-08-19.
