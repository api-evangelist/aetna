- aid: aetna-realtime-pharmacy-benefit-check-api
  name: Aetna Realtime Pharmacy Benefit Check API
  description: Consumer Real-Time Pharmacy Benefit Check 1.0.0, launched 2024-12-05, letting members and
    EHR systems retrieve prescription drug cost and coverage information at the point of prescribing.
    Built to satisfy California AB 2352 and Texas HB 0662H. Exposed as a FHIR messaging operation at /v1/realtimepharmacybenefitcheck/$process-message
    (member-facing) and /realtimepharmacybenefitcheck/v1/$process-message (provider-facing). Production
    traffic moved to the apix.cvshealth.com host on 2026-03-04. Spec documents returned HTTP 403 to this
    harvest.
  humanURL: https://developerportal.aetna.com/
