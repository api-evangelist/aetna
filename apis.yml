- aid: aetna-provider-directory-fhir-api
  name: Aetna Provider Directory FHIR API
  description: HL7 FHIR R4 Provider Directory API implementing the Da Vinci PDex Plan Net Implementation
    Guide (upgraded to version 1.2.0 on 2026-06-23), covering both Medicare and Commercial networks. Exposes
    Practitioner, PractitionerRole, Organization, OrganizationAffiliation, InsurancePlan, Location and
    HealthcareService across two surfaces - an interactive directory at /v1/providerdirectory and a data
    surface at /v1/providerdirectorydata that additionally offers Bulk FHIR $export and $exportstatus.
    Unlike several peer payers, Aetna requires OAuth on the directory; it is not anonymously callable.
