apis:
- aid: aetna-patient-access-fhir-api
  name: Aetna Patient Access FHIR API
  description: HL7 FHIR R4 Patient Access API giving Aetna members, through an app they authorize, access
    to their adjudicated claims, encounter data, coverage, clinical records and formulary information.
    Implements the CARIN for Blue Button framework (v1.0.0 and v2.0.0) and US Core (3.1.1, 5.0.1 and 6.1.0
    depending on the resource), required under CMS-9115-F. Secured with SMART App Launch 1.0.0 OAuth 2.0
    authorization code with PKCE and a member-bound patient context. Exposes Patient, Coverage, ExplanationOfBenefit,
    Condition, Encounter, Observation, Procedure, MedicationRequest, MedicationKnowledge, DocumentReference,
    CarePlan, CareTeam, Goal, AllergyIntolerance, Immunization, DiagnosticReport, Device, Binary and Endpoint.
    The same operations back the Payer to Payer API used by another payer for member-directed data exchange.
  humanURL: https://developerportal.aetna.com/
  baseURL: https://apif1.aetna.com/fhir
  tags:
