  pass: local-v1
  headline: Aetna was previously recorded with no machine-readable contract. It publishes 139 of them.
    The developer portal is an Angular SPA that serves an HTML shell on every route, which is why earlier
    rounds missed it; its own JavaScript loads a machine-readable API catalog at https://developerportal.aetna.com/assets/Data/Fhir.json,
    and each entry names a Swagger 2.0 file served from https://developerportal.aetna.com/managedcontent/yaml/.
    95 of the 138 named files were retrieved (43 returned Akamai 403). Two live FHIR CapabilityStatements
    and two SMART App Launch discovery documents were also captured. A fabricated 'conceptual' GraphQL
    schema from an earlier round was demoted and its apis.yml pointer removed; Aetna ships no GraphQL
    API.
