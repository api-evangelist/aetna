summary: 'Aetna''s data model is not Aetna''s - it is HL7 FHIR R4 as profiled by CARIN for Blue Button, US
  Core and Da Vinci PDex Plan Net. The entities below are the FHIR resource types Aetna actually exposes, and
  the relationships are derived only from FHIR reference-typed search parameters Aetna itself declares in its
  specs, not from the FHIR specification at large. The consequence for an integrator is that the entity graph
  is portable: the same client model works against any conformant payer, and the payer-specific part is which
  resources are exposed, at which IG version, and on which base path.'
