relationship_note: Derived conservatively. FHIR defines far more references between these resources than Aetna
  makes searchable; only the traversals Aetna actually exposes as a declared search parameter are recorded,
  because those are the only ones an agent can follow through this API. Everything else requires reading the
  returned resource body and dereferencing Reference.reference by hand.
clusters:
- name: Member and coverage
  entities:
  - Patient
  - Coverage
  - InsurancePlan
  - ExplanationOfBenefit
  note: The CARIN Blue Button claims spine. ExplanationOfBenefit is the richest resource Aetna publishes and
    carries five selectable C4BB profiles.
- name: Clinical record
  entities:
  - AllergyIntolerance
  - CarePlan
  - CareTeam
  - Condition
  - Device
  - DiagnosticReport
  - DocumentReference
  - Encounter
  - Goal
  - Immunization
  - Observation
  - Procedure
  - MedicationRequest
  note: US Core clinical data, versions 3.1.1 / 5.0.1 / 6.1.0 depending on the operation.
- name: Pharmacy and formulary
  entities:
  - Medication
  - MedicationKnowledge
  note: Da Vinci PDex US Drug Formulary 2.0.0 STU 2. The Formulary List API was decommissioned on 2024-04-19
    and replaced by InsurancePlan/Basic/Location formulary resources, which this run could not retrieve (HTTP
    403).
- name: Provider network
  entities:
  - Practitioner
  - PractitionerRole
  - Organization
  - OrganizationAffiliation
  - Location
  - HealthcareService
  - InsurancePlan
  note: Da Vinci PDex Plan Net 1.2.0. PractitionerRole is the join that makes the directory usable - it binds
    a clinician to an organization, a location, a network and a service.
- name: Infrastructure
  entities:
  - Binary
  - Endpoint
  note: Binary serves attachments referenced from DocumentReference; Endpoint is FHIR service metadata.
