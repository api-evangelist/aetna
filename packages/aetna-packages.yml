distribution_note: >-
  What Aetna distributes instead of an SDK is the contract itself: 139 per-operation Swagger 2.0
  documents listed at https://developerportal.aetna.com/assets/Data/Fhir.json and served from
  https://developerportal.aetna.com/managedcontent/yaml/. Any FHIR client library (HAPI, fhirclient,
  fhir.resources) works against it because the surface is standard FHIR R4 - which is a reasonable
  reason for a payer not to ship its own SDK, and is recorded here as the finding rather than as a gap.
