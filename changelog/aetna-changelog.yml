    type: addition
    breaking: false
    highlights:
      - >-
        Provider Access API launched in Production under product public-provider-group-fhir, letting
        provider organizations and EHR vendors identify attributed member groups and request bulk data
        export for treatment purposes.
      - 'Operations: /provideraccess/v1/Group, /Group/{id}, /Group/$exportstatus/{id}, /Group/{id}/$davinci-data-export, /Group/ExportFile/{fileId}.'
  - date: '2026-03-04'
    environment: Production
    type: breaking
    breaking: true
    highlights:
      - >-
        HOSTNAME configuration change required for subscribers to
        public-realtimepharmacybenefitcheckatapi-fhir, public-clinicaldataexchange-fhir,
        public-coveragerequirementsdiscoveryapi-fhir and public-priorauthorizationsupportapi-fhir -
        production host moved to https://apix.cvshealth.com.
    note: >-
      This is the only breaking change in the recent window and it moved a subset of Aetna's
      production APIs onto a CVS Health host. apix.cvshealth.com resolves (23.206.172.75) and answers
      404 at the root and at /.well-known/smart-configuration, i.e. it is a live gateway that exposes
      nothing anonymously. The four affected products are not among the specs this pipeline could
      retrieve (all returned HTTP 403), so no contract in this repo declares that host.
