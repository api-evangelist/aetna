        IAL2 (NIST SP 800-63A Identity Assurance Level 2) authentication added as an optional
        alternative to the existing well-known username/password member authentication, using CLEAR
        and ID.me as Credential Service Providers.
      - Existing applications are unaffected; IAL2 applications cannot use the Sandbox environment.
      - Developer Portal UI refreshed around application registration and management.
