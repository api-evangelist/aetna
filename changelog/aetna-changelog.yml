        Provider Directory APIs (Medicare and Commercial) under /v1/providerdirectorydata upgraded to
        Da Vinci Implementation Guide 1.2.0 - explicitly non-breaking.
      - New search parameters for PractitionerRole, InsurancePlan and HealthcareService.
  - date: '2026-05-05'
