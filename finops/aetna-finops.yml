provenance_note: >-
  REPLACES a 2026-05-04 bulk-sweep scaffold that modelled Aetna as a usage-based, monthly-invoiced,
  USD-billed API vendor with api_requests, data_egress and compute_seconds meters and cost-per-1K-
  request unit economics. None of that exists. Aetna bills nothing for these APIs. The scaffold was
  also feeding derive-access-model.py, which was consequently labelling Aetna "Paid".
