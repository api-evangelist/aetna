consumer_cost_drivers:
  - name: Uncapped retry cost
    description: >-
      Aetna publishes no numeric rate limit and no Retry-After. A consumer must budget for its own
      backoff and for wasted calls absorbed by a 429 it cannot anticipate.
  - name: No conditional requests
    description: >-
      No ETag, Last-Modified or Cache-Control is documented, so a consumer re-fetches full payloads.
      This matters most on the provider directory, which is large, largely static reference data.
  - name: Bulk export as the cheap path
    description: >-
      $export on /v1/providerdirectorydata and Provider Access $davinci-data-export exist precisely to
      avoid "hundreds of requests" (Aetna's own wording, 2023-09-29). For any whole-network workload,
      bulk is the cost-correct choice.
  - name: Per-member authorization
    description: >-
      Patient Access data can only be retrieved with a token bound to one consenting member, so
      consumer cost scales with enrolled members, not with API price.
