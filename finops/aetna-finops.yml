description: >-
  Aetna does not monetise its API surface, so there is no FinOps posture to model on the supply side.
  The Interoperability APIs are published because CMS-9115-F and CMS-0057-F require a payer to make
  member, directory and prior-authorization data available; there is no price, no meter, no invoice
  and no chargeback. The only cost signals that exist are on the CONSUMER side - the cost of building
  and operating against a read-only FHIR surface with no numeric rate limit and no cache headers.
