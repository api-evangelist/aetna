docs: https://apif1.aetna.com/fhir/.well-known/smart-configuration
profile: SMART App Launch 1.0.0 scope syntax
authorization_server:
  production:
    authorization_endpoint: https://apif1.aetna.com/fhir/prod/v1/fhirserver_auth/oauth2/authorize
    token_endpoint: https://apif1.aetna.com/fhir/prod/v1/fhirserver_auth/oauth2/token
  sandbox:
    authorization_endpoint: https://vteapif1.aetna.com/fhirdemo/v1/fhirserver_auth/oauth2/authorize
    token_endpoint: https://vteapif1.aetna.com/fhirdemo/v1/fhirserver_auth/oauth2/token
  note: The tokenUrl in every published Swagger is the un-substituted IBM API Connect template https://$(catalog.url)/v1/internal/fhirserver_auth/oauth2/token
    - not a usable URL. The real endpoints are the ones above, read live from the smart-configuration documents.
    Aetna's own token-generation PDF and both CapabilityStatements name /fhir/v1/fhirserver_auth/... without
    the "prod" segment; both forms are recorded because Aetna publishes both.
advertised_scopes:
  source: https://apif1.aetna.com/fhir/.well-known/smart-configuration scopes_supported
  scopes:
  - openid
  - fhirUser
  - profile
  - launch/patient
  - patient/*.read
capabilities:
  source: smart-configuration capabilities + Patient Access CapabilityStatement security extensions
  values:
  - client-public
  - client-confidential-symmetric
  - sso-openid-connect
  - launch-standalone
  - context-standalone-patient
  - permission-patient
  code_challenge_methods_supported:
  - S256
  token_endpoint_auth_methods_supported:
  - client_secret_basic
scope_families:
- family: patient/{Resource}.read
  count: 27
  description: Per-resource read on the patient in context. Declared per operation in the Swagger securityDefinitions.
- family: patient/{Resource}.*
  count: 27
  description: Per-resource wildcard. Aetna declares these alongside .read even though the surface is read-only.
- family: patient/*.read
  description: Read every resource in the patient compartment. The scope Aetna's own token guide tells developers
    to request, as "launch/patient patient/*.read".
- family: patient/*.*
  description: Wildcard on everything in the patient compartment.
- family: Public / NonPII
  description: Client-credentials scopes on the FHIR_Application_Oauth scheme used by the provider-directory
    surface, which carries no member data.
grant_note: Aetna does not publish a scopes reference page. There is no page to link; the machine-readable
  smart-configuration document is the closest thing and is used as `docs`. Scope descriptions in the schemes[]
  below are Aetna's own securityDefinitions text, which in many cases repeats the scope string verbatim rather
  than describing it.
