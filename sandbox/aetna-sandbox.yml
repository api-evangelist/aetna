    data: real member data, released only with that member's authorization
  - name: Sandbox
    fhir_base: https://vteapif1.aetna.com/fhirdemo
    authorization_endpoint: https://vteapif1.aetna.com/fhirdemo/v1/fhirserver_auth/oauth2/authorize
