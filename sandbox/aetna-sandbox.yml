    capability_statement: https://vteapif1.aetna.com/fhirdemo/v2/patientaccess/metadata
    data: synthetic / demo member data ("fhirdemo")
separation:
  mechanism: separate hostname and separate OAuth authorization server
  key_prefixes: none
  note: >-
    There is no test-vs-live key prefix. A sandbox application gets its own Client ID and Secret from
    the Developer Portal, bound to sandbox products (product names carry a `sandbox-` prefix, e.g.
    sandbox-payertopayerapi-fhir, sandbox-provideraccessapi-fhir, sandbox-cdshooksapi-fhir). A
    production credential will not authenticate against vteapif1 and vice versa.
onboarding:
  steps:
    - Register or log in at https://developerportal.aetna.com/
    - Click My Application, then Create New
    - Enter an application name and a callback URL
    - >-
      Choose "An application to utilize patient access and/or provider directory API" (third-party
      developer) or "Health Plan to utilize payer to payer data exchange" (payer)
    - Choose the application environment (Sandbox or Production)
    - Submit, then record the Client ID and Client Secret
    - Subscribe the application to the products that contain the APIs to be called
  source: https://developerportal.aetna.com/assets/Data/createapp.json
  note: >-
    Aetna is explicit that a developer must be subscribed to the product containing an API before that
    API can be invoked - an unsubscribed call returns 401, per Aetna's own error reference.
test_values:
  documented: false
  note: >-
    Aetna publishes no magic test identifiers, no synthetic member IDs, and no fixture list. The
    sandbox authorization flow requires signing in as a demo member whose credentials are issued
    through the portal, so there is nothing to record verbatim here and nothing has been invented.
constraints:
