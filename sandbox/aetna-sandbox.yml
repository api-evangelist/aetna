summary: >-
  Aetna runs a genuine, separately-hosted sandbox with its own FHIR base, its own OAuth server and its
  own contracts - 41 of the 139 operations in Aetna's API catalog are sandbox operations, and 39 of
  their Swagger documents were retrieved and are archived in openapi/_original/. It is NOT a
  key-prefix mode on the production host; it is a different hostname. Access still requires portal
  registration and an application, so it is a gated sandbox rather than an open playground.
environments:
