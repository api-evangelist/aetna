versioning:
  scheme: uri-path
  current:
    patient_access: v2 (operations at 2.0.0 / 2.0.1); v3 exists in the catalog but every v3 spec file returned HTTP 403 to this run
    provider_directory: v1 (/v1/providerdirectory and /v1/providerdirectorydata, both 1.0.0)
    prior_authorization: v1 (/priorauthorizationsupport/v1, /clinicaldataexchange/v1, /coveragerequirementsdiscovery/v1)
    provider_access: v1 (/provideraccess/v1)
    realtime_pharmacy_benefit_check: v1
  note: >-
    Aetna versions in two places at once: the URI path (/v2, /v3) and a per-operation semantic version
    it publishes in its own API catalog (2.0.0, 2.0.1, 3.0.0). It also versions by implementation
    guide - the same resource can be US Core 3.1.1 on one path and 5.0.1 or 6.0.1 on another. An
    integrator needs all three coordinates to know what they are calling.
  docs: https://developerportal.aetna.com/
deprecation:
  policy_url: https://developerportal.aetna.com/managedcontent/pdfs/Previous_Releases.pdf
  sunset_header: false
  deprecation_header: false
  mechanism: dated notices in the Previous Releases PDF, plus email to registered developers
  observed_deprecations:
    - date: '2023-09-29'
      change: Version 1 APIs in the Sandbox environment decommissioned.
    - date: '2022-05-07'
      change: >-
        Search parameter patient.identifier removed from Patient Access; _id and service-date
        introduced in its place.
    - date: '2024-02-02'
      change: >-
        "-apigw" suffix removed from API and Product display names (cosmetic; Aetna states no
        functional impact).
  note: >-
    There is a real, dated, human-readable deprecation record going back to 2021 - which is more than
    most payers publish - but it is a PDF, and it is the only channel. No RFC 8594 Sunset or
    Deprecation response header appears in any of the 95 harvested specs, and no operation in any spec
    carries `deprecated: true`. A machine cannot learn from the API that something is going away.
deprecated_operations: []
