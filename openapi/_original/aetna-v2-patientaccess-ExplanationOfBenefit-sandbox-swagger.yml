        informationSequence:
          description: Exceptions, special conditions and supporting information applicable
            for this service or product.
          type: array
          items:
            format: int32
            type: integer
        revenue:
          description: The type of revenue or cost center providing the product and/or
            service.
          "$ref": "#/definitions/CodeableConcept"
        locationCodeableConcept:
          description: Where the product or service was provided.
          "$ref": "#/definitions/CodeableConcept"
        diagnosisSequence:
          description: Diagnoses applicable for this service or product.
          type: array
          items:
            format: int32
            type: integer
        locationReference:
          description: Where the product or service was provided.
          "$ref": "#/definitions/Reference"
        factor:
          description: A real number that represents a multiplier used in determining
            the overall value of services delivered and/or goods received. The concept
            of a Factor allows for a discount or surcharge multiplier to be applied
            to a monetary amount.
          type: number
        net:
          description: The quantity times the unit price for an additional service
            or product or charge.
          "$ref": "#/definitions/Money"
        unitPrice:
          description: If the item is not a group then this is the fee for the product
            or service, otherwise this is the total of the fees for the details of
            the group.
          "$ref": "#/definitions/Money"
        quantity:
          description: The number of repetitions of a service or product.
          "$ref": "#/definitions/SimpleQuantity"
        programCode:
          description: Identifies the program under which this may be recovered.
          type: array
          items:
            "$ref": "#/definitions/CodeableConcept"
        careTeamSequence:
          description: Care team members related to this service or product.
          type: array
          items:
            format: int32
            type: integer
        encounter:
          description: A billed item may include goods or services provided in multiple
            encounters.
          type: array
          items:
            "$ref": "#/definitions/Reference"
        sequence:
          format: int32
          description: A number to uniquely identify item entries.
          type: integer
        bodySite:
          description: Physical service site on the patient (limb, tooth, etc.).
          "$ref": "#/definitions/CodeableConcept"
        subSite:
          description: A region or surface of the bodySite, e.g. limb region or tooth
            surface(s).
          type: array
          items:
            "$ref": "#/definitions/CodeableConcept"
        servicedDate:
          pattern: "([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1]))?)?"
          description: The date or dates when the service or product was supplied,
            performed or completed.
          type: string
        udi:
          description: Unique Device Identifiers associated with this line item.
          type: array
          items:
            "$ref": "#/definitions/Reference"
        detail:
          description: Second-tier of goods and services.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_Item_Detail"
        procedureSequence:
          description: Procedures applicable for this service or product.
          type: array
          items:
            format: int32
            type: integer
        category:
          description: Code to identify the general type of benefits under which products
            and services are provided.
          "$ref": "#/definitions/CodeableConcept"
