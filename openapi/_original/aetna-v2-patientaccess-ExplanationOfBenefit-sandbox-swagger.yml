          type: string
        url:
          pattern: "\\S*"
          description: The URL for this entry, relative to the root (the address to
            which the request is posted).
          type: string
        ifNoneMatch:
          pattern: "[ \\r\\n\\t\\S]+"
          description: If the ETag values match, return a 304 Not Modified status.
            See the API documentation for ["Conditional Read"](http.html#cread).
          type: string
        ifMatch:
