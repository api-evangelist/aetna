basePath: "/v2"
paths:
  "/patientaccess/ExplanationOfBenefit":
    get:
      summary: Retrieves a patient's Explanation Of Benefit details using the Member
        Id and formats the response to the available CARIN profiles.
      description: Return an EOB with potential additional resources based on patient
        ids, potential date range and resource selections.
      operationId: GET
      responses:
        '200':
          schema:
            "$ref": "#/definitions/Bundle"
          description: This response returns a representation of a list of explanation
            of benefits. See the explanation of benefits for the full description
            the resource.
        '400':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          examples:
            application/json:
              issue:
              - severity: error
                code: required
                details:
                  coding:
                  - system: http://hl7.org/fhir/ValueSet/operation-outcome
                    code: MSG_RESOURCE_ID_MISSING
                    display: Resource Id Missing
              id: 14c27ea91f91d8f01234
              resourceType: OperationOutcome
          description: A required parameter isn’t provided, or an unknown parameter
            is provided.
        '404':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          examples:
            application/json:
              issue:
              - severity: error
                code: not-found
                details:
                  coding:
                  - system: http://hl7.org/fhir/ValueSet/operation-outcome
                    code: MSG_NO_MATCH
                    display: No Resource found
              id: 687401f85fd3fefb43182c22
              resourceType: OperationOutcome
          description: The specified id doesn’t identify an existing Resource.
        '500':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          examples:
            application/json:
              issue:
              - severity: fatal
                diagnostics: Backend service failure
                code: exception
                details:
                  coding:
                  - system: http://hl7.org/fhir/ValueSet/operation-outcome
                    code: MSG_SVC_FAILURE
                    display: Error occurred while processing response
              id: 53c27ea45fd8f0ff0af91f91
              resourceType: OperationOutcome
          description: Internal Server Error. Failures on the server side.
      parameters:
      - in: query
        name: _profile
        description: |-
          This is used to return the explanation of benefit for a specific profile type.
          Potential values:
          For C4BB EOB base STU1 v1.0.0: http://hl7.org/fhir/us/carin-bb/StructureDefinition/C4BB-ExplanationOfBenefit
          For C4BB EOB Pharmacy STU1 v1.0.0: http://hl7.org/fhir/us/carin-bb/StructureDefinition/C4BB-ExplanationOfBenefit-Pharmacy
          For C4BB EOB Pharmacy STU2 v2.0.0: http://hl7.org/fhir/us/carin-bb/StructureDefinition/C4BB-ExplanationOfBenefit-Pharmacy|2.0.0
          For C4BB EOB Inpatient Institutional STU1 v1.0.0: http://hl7.org/fhir/us/carin-bb/StructureDefinition/C4BB-ExplanationOfBenefit-Inpatient-Institutional
          For C4BB EOB Inpatient Institutional STU2 v2.0.0: http://hl7.org/fhir/us/carin-bb/StructureDefinition/C4BB-ExplanationOfBenefit-Inpatient-Institutional|2.0.0
          For C4BB EOB Outpatient Institutional STU1 v1.0.0: http://hl7.org/fhir/us/carin-bb/StructureDefinition/C4BB-ExplanationOfBenefit-Outpatient-Institutional
          For C4BB EOB Outpatient Institutional STU2 v2.0.0: http://hl7.org/fhir/us/carin-bb/StructureDefinition/C4BB-ExplanationOfBenefit-Outpatient-Institutional|2.0.0
          For C4BB EOB Professional NonClinician STU1 v1.0.0: http://hl7.org/fhir/us/carin-bb/StructureDefinition/C4BB-ExplanationOfBenefit-Professional-NonClinician
          For C4BB EOB Professional NonClinician STU2 v2.0.0: http://hl7.org/fhir/us/carin-bb/StructureDefinition/C4BB-ExplanationOfBenefit-Professional-NonClinician|2.0.0
          For C4BB EOB Oral STU2 v2.0.0: http://hl7.org/fhir/us/carin-bb/StructureDefinition/C4BB-ExplanationOfBenefit-Oral|2.0.0

          Multiple profiles may be searched in a single request by using AND and/or OR conditions.
        type: string
        required: false
      - in: query
        name: page
        description: 'Used for pagination: potential values to navigate to a specific
          page. “self”–page=10 “first”–page=1 “last”–page=65 “previous”–page=9 “next”–page=11'
        type: number
        required: false
      - in: query
        name: patient
        description: This is the identifier for a patient
        type: string
        required: false
      - in: query
        name: _id
        description: This is the logical identifier for an explanation of benefit
        type: string
        required: false
      - in: query
        name: service-date
        description: "The service date parameter allows applications to search for
          EOB by their service date using a prefix followed by a single date in the
          format of yyyy-mm-dd.\nThe following search prefixes are supported:\nGE:
          Response set includes EOBs where service date is greater than or equal to
          the input value \nexample: service-date=ge2019-01-01 will return EOBs with
          service date after and inclusive of 2019-Jan-01\nLE: Response set includes
          EOBs where service date is less than or equal to the input value \nexample:
          service-date=le2019-12-31 will return EOBs with service date before and
          inclusive of 2019-Dec-31\nPeriod: Defining a upper and lower bound for a
          search of EOBs over a period can be performed with the ampersand operator
          using the GE and LE prefixes. Response set includes EOBs where service date
          fall\nNote: Other search prefixes not listed here are unsupported at this
          time\nSupplying a date without a prefix or a prefix without a date will
          result in an error"
        type: array
        items:
          type: string
        collectionFormat: multi
        required: false
