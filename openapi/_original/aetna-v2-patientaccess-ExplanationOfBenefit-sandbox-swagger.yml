          type: array
          items:
            "$ref": "#/definitions/CodeableConcept"
        subDetail:
          description: Third-tier of goods and services.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_Item_Detail_SubDetail"
