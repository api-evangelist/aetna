info:
  contact:
    name: Interoperability Developer Support
    email: InteroperabilityDeveloperSupport@aetna.com
    url: http://
  x-ibm-name: v2patientaccessexplanationofbenefit-apigw
  description: 'The Aetna Patient Access API is an enterprise API that implements
    HL7 FHIR standards to meet the CMS requirements for Interoperability. The API
    enables Aetna members to access their claims and encounter information using Third-party
    client applications. The Patient Access API supports the C4BB ExplanationOfBenefit
    Resource that conforms to the HL7 FHIR CARINBB Implementation Guide STU2 v2.0.0
    and supports C4BB ExplanationOfBenefit Profiles: Pharmacy, InpatientInstitutional,
    OutpatientInstitutional, ProfessionalNonClinician and Oral profiles. A request
    for the ExplanationOfBenefit resource will initiate a fetch that returns claims
    for a patient from Aetna Claims Data sources. This API currently follows user
    token security.'
  title: "/v2/patientaccess/ExplanationOfBenefit"
  version: 2.0.0
