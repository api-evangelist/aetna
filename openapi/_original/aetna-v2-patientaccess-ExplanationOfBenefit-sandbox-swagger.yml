  Attachment:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        data:
          pattern: "(\\s*([0-9a-zA-Z\\+\\=]){4}\\s*)+"
          description: The actual data of the attachment - a sequence of bytes, base64
            encoded.
          type: string
        size:
          format: int32
          description: The number of bytes of data that make up this attachment (before
            base64 encoding, if that is done).
          type: integer
        language:
          pattern: "[^\\s]+(\\s[^\\s]+)*"
          description: The human language of the content. The value can be any valid
            value according to BCP 47.
          type: string
        title:
          pattern: "[ \\r\\n\\t\\S]+"
          description: A label or set of text to display in place of the data.
          type: string
        contentType:
          pattern: "[^\\s]+(\\s[^\\s]+)*"
          description: Identifies the type of the data in the attachment and allows
            a method to be chosen to interpret or render the data. Includes mime type
            parameters such as charset where appropriate.
          type: string
        url:
          pattern: "\\S*"
          description: A location where the data can be accessed.
          type: string
        hash:
          pattern: "(\\s*([0-9a-zA-Z\\+\\=]){4}\\s*)+"
          description: The calculated hash of the data using SHA-1. Represented using
            base64.
          type: string
        creation:
          pattern: "([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\\.[0-9]+)?(Z|(\\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?"
          description: The date that the attachment was first created.
          type: string
  ExplanationOfBenefit:
    allOf:
    - "$ref": "#/definitions/DomainResource"
    - type: object
      required:
      - created
      - insurance
      - insurer
      - outcome
      - patient
      - provider
      - status
      - type
      - use
      properties:
        insurance:
          minItems: 1
          description: Financial instruments for reimbursement for the health care
            products and services specified on the claim.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_Insurance"
        benefitPeriod:
          description: The term of the benefits documented in this response.
          "$ref": "#/definitions/Period"
        benefitBalance:
          description: Balance by Benefit Category.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_BenefitBalance"
        claimResponse:
          description: 'The business identifier for the instance of the adjudication
            response: claim, predetermination or preauthorization response.'
          "$ref": "#/definitions/Reference"
        use:
          description: 'A code to indicate whether the nature of the request is: to
            request adjudication of products and services previously rendered; or
            requesting authorization and adjudication for provision in the future;
            or requesting the non-binding adjudication of the listed products and
            services which could be provided in the future.'
          type: string
          enum:
          - claim
          - preauthorization
          - predetermination
        preAuthRef:
          description: Reference from the Insurer which is used in later communications
            which refers to this adjudication.
          type: array
          items:
            pattern: "[ \\r\\n\\t\\S]+"
            type: string
        type:
          description: The category of claim, e.g. oral, pharmacy, vision, institutional,
            professional.
          "$ref": "#/definitions/CodeableConcept"
        precedence:
          format: int32
          description: This indicates the relative order of a series of EOBs related
            to different coverages for the same suite of services.
          type: integer
        accident:
          description: Details of a accident which resulted in injuries which required
            the products and services listed in the claim.
          "$ref": "#/definitions/ExplanationOfBenefit_Accident"
        processNote:
          description: A note that describes or explains adjudication results in a
            human readable form.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_ProcessNote"
        payee:
          description: The party to be reimbursed for cost of the products and services
            according to the terms of the policy.
          "$ref": "#/definitions/ExplanationOfBenefit_Payee"
        adjudication:
          description: If this item is a group then the values here are a summary
            of the adjudication of the detail items. If this item is a simple product
            or service then this is the result of the adjudication of this item.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_Item_Adjudication"
        addItem:
          description: The first-tier service adjudications for payor added product
            or service lines.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_AddItem"
        total:
          description: Categorized monetary totals for the adjudication.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_Total"
        related:
          description: Other claims which are related to this claim such as prior
            submissions or claims for related services or for the same event.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_Related"
        supportingInfo:
          description: Additional information codes regarding exceptions, special
            considerations, the condition, situation, prior or concurrent issues.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_SupportingInfo"
        provider:
          description: The provider which is responsible for the claim, predetermination
            or preauthorization.
          "$ref": "#/definitions/Reference"
        fundsReserveRequested:
          description: A code to indicate whether and for whom funds are to be reserved
            for future claims.
          "$ref": "#/definitions/CodeableConcept"
        fundsReserve:
          description: A code, used only on a response to a preauthorization, to indicate
            whether the benefits payable have been reserved and for whom.
          "$ref": "#/definitions/CodeableConcept"
        patient:
          description: The party to whom the professional services and/or products
            have been supplied or are being considered and for whom actual for forecast
            reimbursement is sought.
          "$ref": "#/definitions/Reference"
        insurer:
          description: The party responsible for authorization, adjudication and reimbursement.
          "$ref": "#/definitions/Reference"
        enterer:
          description: Individual who created the claim, predetermination or preauthorization.
          "$ref": "#/definitions/Reference"
        claim:
          description: Reference to a related claim.
          "$ref": "#/definitions/Reference"
        payment:
          description: Payment details for the adjudication of the claim.
          "$ref": "#/definitions/ExplanationOfBenefit_Payment"
        outcome:
          description: The outcome of the claim, predetermination, or preauthorization
            processing.
          type: string
          enum:
          - queued
          - complete
          - error
          - partial
        careTeam:
          description: The members of the team who provided the products and services.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_CareTeam"
        identifier:
          description: A unique identifier assigned to this explanation of benefit.
          type: array
          items:
            "$ref": "#/definitions/Identifier"
        item:
          description: A claim line. Either a simple (a product or service) or a 'group'
            of details which can also be a simple items or groups of sub-details.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_Item"
        formCode:
          description: A code for the form to be used for printing the content.
          "$ref": "#/definitions/CodeableConcept"
        created:
          pattern: "([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\\.[0-9]+)?(Z|(\\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?"
          description: The date this resource was created.
          type: string
        diagnosis:
          description: Information about diagnoses relevant to the claim items.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_Diagnosis"
        originalPrescription:
          description: Original prescription which has been superseded by this prescription
            to support the dispensing of pharmacy services, medications or products.
          "$ref": "#/definitions/Reference"
        procedure:
          description: Procedures performed on the patient relevant to the billing
            items with the claim.
          type: array
          items:
            "$ref": "#/definitions/ExplanationOfBenefit_Procedure"
        priority:
          description: 'The provider-required urgency of processing the request. Typical
            values include: stat, routine deferred.'
          "$ref": "#/definitions/CodeableConcept"
        preAuthRefPeriod:
          description: The timeframe during which the supplied preauthorization reference
            may be quoted on claims to obtain the adjudication as provided.
          type: array
          items:
            "$ref": "#/definitions/Period"
        disposition:
          pattern: "[ \\r\\n\\t\\S]+"
          description: A human readable description of the status of the adjudication.
          type: string
        referral:
          description: A reference to a referral resource.
          "$ref": "#/definitions/Reference"
        form:
          description: The actual form, by reference or inclusion, for printing the
            content or an EOB.
          "$ref": "#/definitions/Attachment"
        prescription:
          description: Prescription to support the dispensing of pharmacy, device
            or vision products.
          "$ref": "#/definitions/Reference"
        billablePeriod:
          description: The period for which charges are being submitted.
          "$ref": "#/definitions/Period"
        subType:
          description: A finer grained suite of claim type codes which may convey
            additional information such as Inpatient vs Outpatient and/or a specialty
            service.
          "$ref": "#/definitions/CodeableConcept"
        facility:
          description: Facility where the services were provided.
          "$ref": "#/definitions/Reference"
        status:
          description: The status of the resource instance.
          type: string
          enum:
          - active
          - cancelled
          - draft
          - entered-in-error
  ExplanationOfBenefit_BenefitBalance_Financial:
