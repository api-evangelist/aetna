          items:
            "$ref": "#/definitions/ExplanationOfBenefit_Item_Adjudication"
        itemSequence:
          description: Claim items which this service line is intended to replace.
          type: array
          items:
            format: int32
            type: integer
        bodySite:
          description: Physical service site on the patient (limb, tooth, etc.).
          "$ref": "#/definitions/CodeableConcept"
        locationCodeableConcept:
          description: Where the product or service was provided.
          "$ref": "#/definitions/CodeableConcept"
        provider:
          description: The providers who are authorized for the services rendered
            to the patient.
          type: array
          items:
            "$ref": "#/definitions/Reference"
        detailSequence:
          description: The sequence number of the details within the claim item which
            this line is intended to replace.
          type: array
          items:
            format: int32
            type: integer
        subSite:
          description: A region or surface of the bodySite, e.g. limb region or tooth
            surface(s).
          type: array
          items:
            "$ref": "#/definitions/CodeableConcept"
        servicedDate:
