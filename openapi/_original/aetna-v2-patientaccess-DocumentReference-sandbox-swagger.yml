          type: string
        masterIdentifier:
          description: Document identifier as assigned by the source of the document.
            This identifier is specific to this version of the document. This unique
            identifier may be used elsewhere to identify this version of the document.
          "$ref": "#/definitions/Identifier"
        type:
          description: Specifies the particular kind of document referenced (e.g.
            History and Physical, Discharge Summary, Progress Note). This usually
            equates to the purpose of making the document referenced.
          "$ref": "#/definitions/CodeableConcept"
        content:
