      parameters:
      - in: query
        name: patient
        description: |-
          This is the FHIR Logical Id of a Patient (Patient.id)

          Ex. GET [base]/DocumentReference?patient=1847fcd3-8687-31bb-b39d-a8458c8f76ca
        type: string
        required: false
      - in: query
        name: category
        description: Represents a classification of the clinical discipline, department
          or diagnostic service that created the report (e.g. cardiology, biochemistry,
          hematology, MRI). This is used for searching, sorting and display purposes.
        type: string
        required: false
      - in: query
        name: type
        description: Specifies the particular kind of Document Referenced (e.g. History
          and Physical, Discharge Summary, Progress Note). This usually equates to
          the purpose of making the Document Referenced.
        type: string
        required: false
      - in: query
        name: date
        description: |-
          The date parameter allows applications to search for DocumentReferences by specimen collection date using a prefix followed by a single date in the format of yyyy-mm-dd. The following search prefixes are supported:
          • GE: Response set includes DocumentReferences where specimen collection date is greater than or equal to the input value
          o (example: date=ge2019-01-01 will return DocumentReferences with created after and inclusive of 2019-Jan-01)
          • LE: Response set includes DocumentReferences where specimen collection date is less than or equal to the input value
          o (example: date=le2019-12-31 will return DocumentReferences with specimen collection date before and inclusive of 2019-Dec-31)
          Period: Defining a upper and lower bound for a search of DocumentReferences over a period can be performed with the ampersand operator ( using the GE and LE prefixes. Response set includes DocumentReferences where specimen collection date falls in the period specified by the date boundaries (example: date=ge2019-01-01&date=le2019-12-31 will return DocumentReferences with a specimen collection date between and inclusive of 2019-Jan-01 and 2019-Dec-31)

          Note:
          • Other search prefixes not listed here are unsupported at this time.
          • Supplying a date without a prefix or a prefix without a date will result in an error
        type: string
        required: false
      - in: query
        name: _page_token
        description: |-
          This value will be provided by the Server. Used to retrieve the next page of results.

          If a search returns more resources than fit on one page, the response includes a pagination URL in the Bundle.link field. The value with Bundle.link.relation = next indicates that you can use the corresponding Bundle.link.url to retrieve the next page. ex. [base]/DocumentReference?_count=10&_page_token=Cjj3YQP%2Bdf%2F%2F%2F%2F%2BABchXMXghfgD%2FAf%2F%2BZTA5NWM4YmI0YWNlYWQ4Yjc5NDhjYTk2M2RhMDA5N2QAARAKIeRmIPX4MlS1OQAAAACKAfyeSAFQAFoLCfRXKWB76f3NEANgg8Tc2gc%3D
        type: string
        required: false
      - in: query
        name: _count
        description: Used to specify the number of records returned per page
        type: number
        required: false
      - in: query
        name: _revinclude
        description: |-
          Adds support for searching the US Core Profile resource types for all the Provenance records for those resources using the _revinclude search parameter:

          GET [base]/[DocumentReference]?_revinclude=Provenance:target
        type: string
        required: false
      - in: query
        name: _id
        description: |-
          Adds support for searching by the Logical id of a DocumentReference.

          GET [base]/[DocumentReference]?_id=3347fcd3-8687-31bb-b39d-f8458c8f76ea
        type: string
        required: false
