            a person, (patient or healthcare practitioner), a device (e.g. a machine)
            or even a group of subjects (such as a document about a herd of farm animals,
            or a set of patients that share a common exposure).
          "$ref": "#/definitions/Reference"
        author:
          description: Identifies who is responsible for adding the information to
            the document.
          type: array
          items:
            "$ref": "#/definitions/Reference"
        securityLabel:
          description: A set of Security-Tag codes specifying the level of privacy/security
            of the Document. Note that DocumentReference.meta.security contains the
            security labels of the "reference" to the document, while DocumentReference.securityLabel
            contains a snapshot of the security labels on the document the reference
            refers to.
          type: array
          items:
            "$ref": "#/definitions/CodeableConcept"
        description:
          pattern: "[ \\r\\n\\t\\S]+"
