  BackboneElement:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        modifierExtension:
          description: |-
            May be used to represent additional information that is not part of the basic definition of the element and that modifies the understanding of the element in which it is contained and/or the understanding of the containing element's descendants. Usually modifier elements provide negation or qualification. To make the use of extensions safe and manageable, there is a strict set of governance applied to the definition and use of extensions. Though any implementer can define an extension, there is a set of requirements that SHALL be met as part of the definition of the extension. Applications processing a resource are required to check for modifier extensions.

            Modifier extensions SHALL NOT change the meaning of any elements on Resource or DomainResource (including cannot change the meaning of modifierExtension itself).
          type: array
          items:
            "$ref": "#/definitions/Extension"
  Signature:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      required:
      - type
      - when
      - who
      properties:
        data:
          pattern: "(\\s*([0-9a-zA-Z\\+\\=]){4}\\s*)+"
          description: The base64 encoding of the Signature content. When signature
            is not recorded electronically this element would be empty.
          type: string
        onBehalfOf:
          description: A reference to an application-usable description of the identity
            that is represented by the signature.
          "$ref": "#/definitions/Reference"
        sigFormat:
          pattern: "[^\\s]+(\\s[^\\s]+)*"
          description: A mime type that indicates the technical format of the signature.
            Important mime types are application/signature+xml for X ML DigSig, application/jose
            for JWS, and image/* for a graphical image of a signature, etc.
          type: string
        targetFormat:
          pattern: "[^\\s]+(\\s[^\\s]+)*"
          description: A mime type that indicates the technical format of the target
            resources signed by the signature.
          type: string
        type:
          minItems: 1
          description: An indication of the reason that the entity signed this document.
            This may be explicitly included as part of the signature information and
            can be used when determining accountability for various actions concerning
            the document.
          type: array
          items:
            "$ref": "#/definitions/Coding"
        when:
          pattern: "([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\\.[0-9]+)?(Z|(\\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))"
          description: When the digital signature was signed.
          type: string
        who:
          description: A reference to an application-usable description of the identity
            that signed (e.g. the signature used their private key).
          "$ref": "#/definitions/Reference"
  USCoreIdentifier:
    allOf:
    - "$ref": "#/definitions/Identifier"
    - type: object
  Bundle_Entry:
    allOf:
    - "$ref": "#/definitions/BackboneElement"
    - type: object
      properties:
        request:
          description: Additional information about how this entry should be processed
            as part of a transaction or batch. For history, it shows how the entry
            was processed to create the version contained in the entry.
          "$ref": "#/definitions/Bundle_Entry_Request"
        search:
          description: Information about the search process that lead to the creation
            of this entry.
          "$ref": "#/definitions/Bundle_Entry_Search"
        resource:
          description: The Resource for the entry. The purpose/meaning of the resource
            is determined by the Bundle.type.
          "$ref": "#/definitions/Resource"
        fullUrl:
          pattern: "\\S*"
          description: |-
            The Absolute URL for the resource. The fullUrl SHALL NOT disagree with the id in the resource - i.e. if the fullUrl is not a urn:uuid, the URL shall be version-independent URL consistent with the Resource.id. The fullUrl is a version independent reference to the resource. The fullUrl element SHALL have a value except that:
            * fullUrl can be empty on a POST (although it does not need to when specifying a temporary id for reference in the bundle)
            * Results from operations might involve resources that are not identified.
          type: string
        response:
          description: Indicates the results of processing the corresponding 'request'
            entry in the batch or transaction being responded to or what the results
            of an operation where when returning history.
          "$ref": "#/definitions/Bundle_Entry_Response"
        link:
          description: A series of links that provide context to this entry.
          type: array
          items:
            "$ref": "#/definitions/Bundle_Link"
  USCoreIdentifierCLIA:
    allOf:
    - "$ref": "#/definitions/USCoreIdentifier"
    - type: object
    description: |-
      Clinical Laboratory Improvement Amendments (CLIA) Number for laboratories

      This class is associated with the identifier property in the USCoreOrganization

      Required Pattern: At least the following:

      Elements are under identifierCLIA and their Cardinality and Type:

       system1..1 uriThe namespace for the identifier value, Fixed Value: urn:oid:2.16.840.1.113883.4.7
  USCoreIdentifierNPI:
    allOf:
    - "$ref": "#/definitions/USCoreIdentifier"
    - type: object
    description: |-
      National Provider Identifier (NPI)

      This class is associated with the identifier property in the USCorePractitioner and USCoreOrganization

      Required Pattern: At least the following:

      Elements are under identifierNPI and their Cardinality and Type:

       system1..1 uri The namespace for the identifier value, Fixed Value: http://hl7.org/fhir/sid/us-npi
  GeolocationExt:
    allOf:
    - "$ref": "#/definitions/Extension"
    - type: object
      required:
      - url
      properties:
        url:
          default: http://hl7.org/fhir/StructureDefinition/geolocation
          type: string
  DocumentReference_Content:
    allOf:
    - "$ref": "#/definitions/BackboneElement"
    - type: object
      required:
      - attachment
      properties:
        attachment:
          description: The document or URL of the document along with critical metadata
            to prove content has integrity.
          "$ref": "#/definitions/Attachment"
        format:
          description: An identifier of the document encoding, structure, and template
            that the document conforms to beyond the base format indicated in the
            mimeType.
          "$ref": "#/definitions/Coding"
info:
  contact:
    name: Interoperability Developer Support
    email: interoperabilitydevelopersupport@aetna.com
  description: |-
    The Aetna Patient Access API is an enterprise API that implements the HL7 FHIR standard to meet the CMS requirements for Interoperability. The API provides the ability for Aetna members to access their Clinical data using Third-party client applications supporting those standards. The Patient Access API supports the FHIR DocumentReference resource that conforms to the HL7 FHIR USCore Implementation Guide STU5 Release v5.0.1 and supports USCore DocumentReference profile. The API follows the User token security model.

    The DocumentReference SEARCH API supports the following operations:

    1. Launch DocumentReference with no parameters by calling GET [base]/DocumentReference which will request all DocumentReferences associated with an Authenticated user. For example, GET [base]/DocumentReference

    2. Launch DocumentReference with patient by calling GET [base]/DocumentReference?patient=reference which will request all DocumentReferences associated with an Authenticated user. For example, GET [base]/DocumentReference?patient=1847fcd3-8687-31bb-b39d-a8458c8f76ca. Search with no parameters and search with patient perform the same search functionality.

    3. This API also supports SHALL support combinations in US Core 5.0.1 Implementation Guide
     - patient and category : GET [base]/DocumentReference?patient=1847fcd3-8687-31bb-b39d-a8458c8f76ca&category=http://hl7.org/fhir/us/core/CodeSystem/us-core-documentreference-category|clinical-note
     - patient and category and date : GET [base]/DocumentReference?patient=1847fcd3-8687-31bb-b39d-a8458c8f76ca&category=http://hl7.org/fhir/us/core/CodeSystem/us-core-documentreference-category|clinical-note&date=ge2019-01-01&date=le2019-12-31
     - patient and type : GET [base]/DocumentReference?patient=1847fcd3-8687-31bb-b39d-a8458c8f76ca&type=http://loinc.org|18842-5&_count=20

    If a search returns more resources than fit on one page, the response includes a pagination URL in the Bundle.link field. The value with Bundle.link.relation = next indicates that you can use the corresponding Bundle.link.url to retrieve the next page. ex. [base]/DocumentReference?_count=10&_page_token=Cjj3YQP%2Bdf%2F%2F%2F%2F%2BABchXMXghfgD%2FAf%2F%2BZTA5NWM4YmI0YWNlYWQ4Yjc5NDhjYTk2M2RhMDA5N2QAARAKIeRmIPX4MlS1OQAAAACKAfyeSAFQAFoLCfRXKWB76f3NEANgg8Tc2gc%3D

    _revinclude=Provenance:target is supported
     - GET [base]/DocumentReference?_revinclude=Provenance:target
  x-ibm-name: v2patientaccessdocumentreference
  title: "/v2/patientaccess/DocumentReference"
  version: 2.0.0
