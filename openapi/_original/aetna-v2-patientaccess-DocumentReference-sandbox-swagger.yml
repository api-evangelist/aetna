            for indexing and searching. This may be implied by or derived from the
            code specified in the DocumentReference.type.
          type: array
          items:
            "$ref": "#/definitions/CodeableConcept"
        relatesTo:
          description: Relationships that this document has with other document references
            that already exist.
          type: array
          items:
            "$ref": "#/definitions/DocumentReference_RelatesTo"
        authenticator:
          description: Which person or organization authenticates that this document
            is valid.
          "$ref": "#/definitions/Reference"
        status:
          description: The status of this document reference.
          type: string
          enum:
          - current
          - superseded
          - entered-in-error
