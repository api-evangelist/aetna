info:
  contact:
    name: Interoperability Developer Support
    email: interoperabilitydevelopersupport@aetna.com
  description: >-
    This API provides details about Plannet PractitionerRole. PractitionerRole
    describes details about a provider, which can be a practitioner or an
    organization. When the provider is a practitioner, there may be a
    relationship to an organization. A provider renders services to patients at
    a location. When the provider is a practitioner, there may also be a
    relationship to an organization. Practitioner participation in healthcare
    provider insurance networks may be direct or through their role at an
    organization.
  x-ibm-name: v1providerdirectorydatapractitionerrole
  title: /v1/providerdirectorydata/PractitionerRole
  version: 1.0.0
