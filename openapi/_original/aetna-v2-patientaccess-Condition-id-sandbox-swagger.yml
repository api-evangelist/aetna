---
x-ibm-configuration:
  phase: realized
  enforced: true
  testable: true
x-ibm-endpoints:
- endpointUrl: https://qaehapi.aetna.com/fhirdemo/qapath3
  type:
  - production
  - development
- endpointUrl: https://qahapi.aetna.com/fhirdemo/qapath3
  type:
  - production
  - development
schemes:
- https
swagger: '2.0'
security:
- FHIR_Patient_Condition_Read_AccessCode_Oauth:
  - patient/Condition.read
- FHIR_Patient_Condition_Read_AccessCode_Oauth:
  - patient/Condition.*
- FHIR_Patient_Condition_Read_AccessCode_Oauth:
  - patient/*.read
- FHIR_Patient_Condition_Read_AccessCode_Oauth:
  - patient/*.*
basePath: "/v2"
paths:
  "/patientaccess/Condition/{id}":
    get:
      summary: Retrieves conditon details using the Id and formats the response to
        the USCoreCondition profile.
      description: This operation will retrieve condition details using the Id and
        formats the response to the USCoreCondition profile. Id is mandatory. These
        parameters are described in detail on the HL7 sites for FHIR and USCore.
      operationId: GET
      responses:
        '200':
          schema:
            "$ref": "#/definitions/USCoreCondition"
          examples:
            application/json:
              identifier:
              - system: https://sources.aetna.com/encounter/identifier/memberenctid/50063
              code:
                coding:
                - system: http://snomed.info/sct
                  code: '88805009'
                  display: Chronic congestive heart failure (disorder)
                text: Chronic congestive heart failure (disorder)
              verificationStatus:
                coding:
                - system: http://terminology.hl7.org/CodeSystem/condition-ver-status
                  code: confirmed
              subject:
                reference: Patient/b6935157-bc88-4a41-8c57-1238ca2d709a
              recordedDate: '1989-11-19T22:39:06-06:00'
              encounter:
                reference: Encounter/b38bfd4b-dbe1-4bdb-9de5-95841ed73aad
              clinicalStatus:
                coding:
                - system: http://terminology.hl7.org/CodeSystem/condition-clinical
                  code: active
              onsetDateTime: '1989-11-19T22:39:06-06:00'
              meta:
                lastUpdated: '2020-03-24T23:43:11.810+00:00'
                versionId: '1'
                profile:
                - http://hl7.org/fhir/us/core/StructureDefinition/us-core-condition
                source: "#OA3EcmpoIPqxKVEk"
                tag:
                - system: https://smarthealthit.org/tags
                  code: Covid19 synthetic population from Synthea
              id: 19382
              category:
              - coding:
                - system: http://terminology.hl7.org/CodeSystem/condition-category
                  code: encounter-diagnosis
                  display: Encounter Diagnosis
              value: 42~ME402739+unknown+unknown+99255+2016-03-29+2016-04-03
              resourceType: Condition
          description: This response returns a representation of a Condition resource.
            It will be returned in the USCoreCondition profile format.
        '400':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          description: A required parameter isn’t provided, or an unknown parameter
            is provided.
        '404':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          description: The specified System Identifier doesn’t identify an existing
            Resource.​
        '500':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          description: Internal Server Error. Failures on the server side.
      parameters:
      - in: path
        name: id
        description: This is the Condition (unique) logical ID.
        type: string
        required: true
host: vteapif1.aetna.com/fhirdemo
produces:
- application/json
externalDocs:
  description: HTTPS Common Error Codes
  url: https://eaintegrationgovernance.github.io/APIC-Common-Error-Codes.github.io/
securityDefinitions:
  FHIR_Patient_Condition_Read_AccessCode_Oauth:
    tokenUrl: ''
    authorizationUrl: ''
    description: |-
      {
      "BuildEieHeader" : "Header 3.2",
      "SecurityTemplate" : "FHIRPatientConditionRead",
      "Backend" : "IIB",
      "Errorhandlingpolicy": "Transparent"
      "Consumer":"External",
      "Mutual Auth between Consumer and APIC" : "Not Required"
      }
    scopes:
      patient/*.read: ''
      patient/Condition.read: ''
      patient/Condition.*: ''
      patient/*.*: ''
    type: oauth2
    flow: accessCode
definitions:
  Meta:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        lastUpdated:
          pattern: "([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\\.[0-9]+)?(Z|(\\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))"
          description: When the resource last changed - e.g. when the version changed.
          type: string
        versionId:
          pattern: "[A-Za-z0-9\\-\\.]{1,64}"
          description: The version specific identifier, as it appears in the version
            portion of the URL. This value changes when the resource is created, updated,
            or deleted.
          type: string
        security:
          description: Security labels applied to this resource. These tags connect
            specific resources to the overall security policy and infrastructure.
          type: array
          items:
            "$ref": "#/definitions/Coding"
        profile:
          description: A list of profiles (references to [StructureDefinition](structuredefinition.html#)
            resources) that this resource claims to conform to. The URL is a reference
            to [StructureDefinition.url](structuredefinition-definitions.html#StructureDefinition.url).
          type: array
          items:
            pattern: "\\S*"
            type: string
        source:
          pattern: "\\S*"
          description: A uri that identifies the source system of the resource. This
            provides a minimal amount of [Provenance](provenance.html#) information
            that can be used to track or differentiate the source of information in
            the resource. The source may identify another FHIR server, document, message,
            database, etc.
          type: string
        tag:
          description: Tags applied to this resource. Tags are intended to be used
            to identify and relate resources to process and workflow, and applications
            are not required to consider the tags when interpreting the meaning of
            a resource.
          type: array
          items:
            "$ref": "#/definitions/Coding"
  DomainResource:
    allOf:
    - "$ref": "#/definitions/Resource"
    - type: object
      properties:
        contained:
          description: These resources do not have an independent existence apart
            from the resource that contains them - they cannot be identified independently,
            and nor can they have their own independent transaction scope.
          type: array
          items:
            "$ref": "#/definitions/Resource"
        extension:
          description: May be used to represent additional information that is not
            part of the basic definition of the resource. To make the use of extensions
            safe and manageable, there is a strict set of governance applied to the
            definition and use of extensions. Though any implementer can define an
            extension, there is a set of requirements that SHALL be met as part of
            the definition of the extension.
          type: array
          items:
            "$ref": "#/definitions/Extension"
        modifierExtension:
          description: |-
            May be used to represent additional information that is not part of the basic definition of the resource and that modifies the understanding of the element that contains it and/or the understanding of the containing element's descendants. Usually modifier elements provide negation or qualification. To make the use of extensions safe and manageable, there is a strict set of governance applied to the definition and use of extensions. Though any implementer is allowed to define an extension, there is a set of requirements that SHALL be met as part of the definition of the extension. Applications processing a resource are required to check for modifier extensions.

            Modifier extensions SHALL NOT change the meaning of any elements on Resource or DomainResource (including cannot change the meaning of modifierExtension itself).
          type: array
          items:
            "$ref": "#/definitions/Extension"
        text:
          description: A human-readable narrative that contains a summary of the resource
            and can be used to represent the content of the resource to a human. The
            narrative need not encode all the structured data, but is required to
            contain sufficient detail to make it "clinically safe" for a human to
            just read the narrative. Resource definitions may define what content
            should be represented in the narrative to ensure clinical safety.
          "$ref": "#/definitions/Narrative"
  Address:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        country:
          pattern: "[ \\r\\n\\t\\S]+"
          description: Country - a nation as commonly understood or generally accepted.
          type: string
        period:
          description: Time period when address was/is in use.
          "$ref": "#/definitions/Period"
        city:
          pattern: "[ \\r\\n\\t\\S]+"
          description: The name of the city, town, suburb, village or other community
            or delivery center.
          type: string
        use:
          description: The purpose of this address.
          type: string
          enum:
          - home
          - work
          - temp
          - old
          - billing
        line:
          description: This component contains the house number, apartment number,
            street name, street direction, P.O. Box number, delivery hints, and similar
            address information.
          type: array
          items:
            pattern: "[ \\r\\n\\t\\S]+"
            type: string
        district:
          pattern: "[ \\r\\n\\t\\S]+"
          description: The name of the administrative area (county).
          type: string
        postalCode:
          pattern: "[ \\r\\n\\t\\S]+"
          description: A postal code designating a region defined by the postal service.
          type: string
        text:
          pattern: "[ \\r\\n\\t\\S]+"
          description: Specifies the entire address as it should be displayed e.g.
            on a postal label. This may be provided instead of or as well as the specific
            parts.
          type: string
        state:
          pattern: "[ \\r\\n\\t\\S]+"
          description: Sub-unit of a country with limited sovereignty in a federally
            organized country. A code may be used if codes are in common use (e.g.
            US 2 letter state codes).
          type: string
        type:
          description: Distinguishes between physical addresses (those you can visit)
            and mailing addresses (e.g. PO Boxes and care-of addresses). Most addresses
            are both.
          type: string
          enum:
          - postal
          - physical
          - both
  CARINBBPatientIdentifierMedicalRecordNumber:
    allOf:
    - "$ref": "#/definitions/CARINBBPatientIdentifier"
    - type: object
    description: |-
      http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport

      type.coding.code="MR"
  USDFDrugTierIDExt:
    allOf:
    - "$ref": "#/definitions/USDFFormularyDrugExt"
    - type: object
      required:
      - uri
      - valueCodeableConcept
      properties:
        valueCodeableConcept:
          description: 'Binding: http://hl7.org/fhir/us/davinci-drug-formulary/ValueSet-usdf-DrugTierVS.html'
          "$ref": "#/definitions/CodeableConcept"
        uri:
          default: http://hl7.org/fhir/us/davinci-drug-formulary/StructureDefinition/usdf-DrugTierID-extension
          type: string
    description: |-
      A code that describes the coverage status of a drug in a health plan (e.g., preferred generic, specialty, etc.)

      1..1https://hl7.org/fhir/conformance-rules.html#mustSupport
  USCoreCodeableConceptAssessPlan:
    allOf:
    - "$ref": "#/definitions/CodeableConcept"
    - type: object
    description: |-
      This class is associated with the category property in the USCoreCarePlan
      Required.
  Count:
    allOf:
    - "$ref": "#/definitions/Quantity"
    - type: object
  USDFDTDCSPharmacyTypeExt:
    allOf:
    - "$ref": "#/definitions/USDFDTDCostSharingExt"
    - type: object
      required:
      - url
      - valueCodeableConcept
      properties:
        valueCodeableConcept:
          description: 'Binding: http://hl7.org/fhir/us/davinci-drug-formulary/ValueSet-usdf-PharmacyTypeVS.html'
          "$ref": "#/definitions/CodeableConcept"
        url:
          default: pharmacyType
          description: 'Binding: http://hl7.org/fhir/us/davinci-drug-formulary/ValueSet-usdf-PharmacyTypeVS.html'
          type: string
  CARINBBPatientIdentifierPatAcctNum:
    allOf:
    - "$ref": "#/definitions/CARINBBPatientIdentifier"
    - type: object
    description: |-
      http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport

      type.coding.code="PT"
  Condition_Evidence:
    allOf:
    - "$ref": "#/definitions/BackboneElement"
    - type: object
      properties:
        code:
          description: A manifestation or symptom that led to the recording of this
