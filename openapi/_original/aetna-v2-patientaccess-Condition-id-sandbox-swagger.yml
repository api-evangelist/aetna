      http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport

      status
      whereValid
  PlannetCommunicationProficiencyExt:
    allOf:
    - "$ref": "#/definitions/PlannetQualificationIncludedExt"
    - type: object
      required:
      - url
      - valueCodeableConcept
      properties:
        valueCodeableConcept:
          description: Binding:http://hl7.org/fhir/us/davinci-pdex-plan-net/ValueSet/LanguageProficiencyVS
          "$ref": "#/definitions/CodeableConcept"
        url:
          default: http://hl7.org/fhir/us/davinci-pdex-plan-net/StructureDefinition/communication-proficiency
          type: string
  USDFDTDCSCoinsuranceOptionExt:
    allOf:
    - "$ref": "#/definitions/USDFDTDCostSharingExt"
    - type: object
      required:
      - url
      - valueCodeableConcept
      properties:
        valueCodeableConcept:
          description: 'Binding: http://hl7.org/fhir/us/davinci-drug-formulary/ValueSet-usdf-CoinsuranceOptionVS.html'
          "$ref": "#/definitions/CodeableConcept"
        url:
          default: coinsuranceOption
          description: 'Binding: http://hl7.org/fhir/us/davinci-drug-formulary/ValueSet-usdf-PharmacyTypeVS.html'
          type: string
  USDFSummaryURLExt:
    allOf:
    - "$ref": "#/definitions/USDFCoveragePlanExt"
    - type: object
      required:
      - uri
      - valueString
      properties:
        valueString:
          type: string
        uri:
          default: http://hl7.org/fhir/us/davinci-drug-formulary/StructureDefinition/usdf-SummaryURL-extension
          type: string
    description: |-
      The URL that goes directly to the formulary brochure for the specific standard plan or plan variation.

      1..1https://hl7.org/fhir/conformance-rules.html#mustSupport
  USDFMarketingURLExt:
    allOf:
    - "$ref": "#/definitions/USDFCoveragePlanExt"
    - type: object
      required:
      - uri
      - valueString
      properties:
        valueString:
          type: string
        uri:
          default: http://hl7.org/fhir/us/davinci-drug-formulary/StructureDefinition/usdf-MarketingURL-extension
          type: string
    description: |-
      The URL that goes directly to the plan brochure for the specific standard plan or plan variation.

      0..1https://hl7.org/fhir/conformance-rules.html#mustSupport
  USDFDTDCSCopayOptionExt:
    allOf:
    - "$ref": "#/definitions/USDFDTDCostSharingExt"
    - type: object
      required:
      - url
      - valueCodeableConcept
      properties:
        valueCodeableConcept:
          description: 'Binding: http://hl7.org/fhir/us/davinci-drug-formulary/ValueSet-usdf-CopayOptionVS.html'
          "$ref": "#/definitions/CodeableConcept"
        url:
          default: copayOption
          description: 'Binding: http://hl7.org/fhir/us/davinci-drug-formulary/ValueSet-usdf-PharmacyTypeVS.html'
          type: string
  Coding:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        system:
          pattern: "\\S*"
          description: The identification of the code system that defines the meaning
            of the symbol in the code.
          type: string
        code:
          pattern: "[^\\s]+(\\s[^\\s]+)*"
          description: A symbol in syntax defined by the system. The symbol may be
            a predefined code or an expression in a syntax defined by the coding system
            (e.g. post-coordination).
          type: string
        userSelected:
          description: Indicates that this coding was chosen by a user directly -
            e.g. off a pick list of available items (codes or displays).
          type: boolean
        display:
          pattern: "[ \\r\\n\\t\\S]+"
          description: A representation of the meaning of the code in the system,
            following the rules of the system.
          type: string
        version:
          pattern: "[ \\r\\n\\t\\S]+"
          description: The version of the code system which was used when choosing
            this code. Note that a well-maintained code system does not need the version
            reported, because the meaning of codes is consistent across versions.
            However this cannot consistently be assured, and when the meaning is not
            guaranteed to be consistent, the version SHOULD be exchanged.
          type: string
  SampledData:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      required:
      - dimensions
      - origin
      - period
      properties:
        period:
          description: The length of time between sampling times, measured in milliseconds.
          type: number
        data:
          pattern: "[ \\r\\n\\t\\S]+"
          description: A series of data points which are decimal values separated
            by a single space (character u20). The special values "E" (error), "L"
            (below detection limit) and "U" (above detection limit) can also be used
            in place of a decimal value.
          type: string
        origin:
          description: The base quantity that a measured value of zero represents.
            In addition, this provides the units of the entire measurement series.
          "$ref": "#/definitions/SimpleQuantity"
        upperLimit:
          description: The upper limit of detection of the measured points. This is
            needed if any of the data points have the value "U" (higher than detection
            limit).
          type: number
        lowerLimit:
          description: The lower limit of detection of the measured points. This is
            needed if any of the data points have the value "L" (lower than detection
            limit).
          type: number
        factor:
          description: A correction factor that is applied to the sampled data points
            before they are added to the origin.
          type: number
        dimensions:
          format: int32
          description: The number of sample points at each time point. If this value
            is greater than one, then the dimensions will be interlaced - all the
            sample points for a point in time will be recorded at once.
          type: integer
  PlannetBaseExt:
    allOf:
    - "$ref": "#/definitions/Extension"
    - type: object
  Distance:
    allOf:
    - "$ref": "#/definitions/Quantity"
    - type: object
  PlannetQualificationExt:
    allOf:
    - "$ref": "#/definitions/PlannetOrganizationExt"
    - "$ref": "#/definitions/PlannetPractitionerRoleExt"
