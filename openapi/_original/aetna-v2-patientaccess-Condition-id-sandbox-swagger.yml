      properties:
        lastUpdated:
          type: string
    description: |-
      https://hl7.org/fhir/conformance-rules.html#mustSupport
      http://hl7.org/fhir/R4/datatypes.html#ContactPoint

      contactS 0..*ContactPoint Contact details for source (e.g. troubleshooting)
      |-- contactpoint-availabletime S 0..*(Complex)Extension URL: http://hl7.org/fhir/us/davinci-pdex-plan-net/StructureDefinition/contactpoint-availabletime
      |-- via-intermediaryS 0..*Reference(Plan-net Organization | Plan-net PractitionerRole | Plan-net OrganizationAffiliation | Plan-net Location) Via IntermediaryURL: http://hl7.org/fhir/us/davinci-pdex-plan-net/StructureDefinition/via-intermediary
      |-- systemS 0..1 codephone | fax | email | pager | url | sms | other
      |-- valueS 0..1 stringThe actual contact point details
      |-- useS 0..1 codehome | work | temp | old | mobile - purpose of this contact point
      |-- rankS 0..1 positiveInt Specify preferred order of use (1 = highest)
      |-- periodS 0..1 PeriodTime period when the contact point was/is in use
  PlannetAddress:
    allOf:
    - "$ref": "#/definitions/Address"
    - type: object
      properties:
        extension:
          type: array
          items:
            "$ref": "#/definitions/GeolocationExt"
    description: |-
      https://hl7.org/fhir/conformance-rules.html#mustSupport
      http://hl7.org/fhir/R4/datatypes.html#Address

      adressS 0..*Address
      |-- geoLocationS 0..1 (Complex) http://hl7.org/fhir/R4/extension-geolocation.html
  USDFEmailPlanContactExt:
    allOf:
    - "$ref": "#/definitions/USDFCoveragePlanExt"
    - type: object
      required:
      - uri
      - valueString
      properties:
        valueString:
          type: string
        uri:
          default: http://hl7.org/fhir/us/davinci-drug-formulary/StructureDefinition/usdf-EmailPlanContact-extension
          type: string
    description: |-
      An email address for developers/public to report mistakes in the network and formulary data.

      0..1https://hl7.org/fhir/conformance-rules.html#mustSupport
  UsageContext:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      required:
      - code
      properties:
        valueCodeableConcept:
          description: A value that defines the context specified in this context
            of use. The interpretation of the value is defined by the code.
          "$ref": "#/definitions/CodeableConcept"
        code:
          description: A code that identifies the type of context being specified
            by this usage context.
          "$ref": "#/definitions/Coding"
        valueReference:
          description: A value that defines the context specified in this context
            of use. The interpretation of the value is defined by the code.
          "$ref": "#/definitions/Reference"
        valueRange:
          description: A value that defines the context specified in this context
            of use. The interpretation of the value is defined by the code.
          "$ref": "#/definitions/Range"
        valueQuantity:
          description: A value that defines the context specified in this context
            of use. The interpretation of the value is defined by the code.
          "$ref": "#/definitions/Quantity"
  PlannetContactPoint:
    allOf:
    - "$ref": "#/definitions/ContactPoint"
    - type: object
      required:
      - extension
      properties:
        extension:
          "$ref": "#/definitions/PlannetContactPointExt"
    description: |-
      https://hl7.org/fhir/conformance-rules.html#mustSupport
      http://hl7.org/fhir/R4/datatypes.html#ContactPoint

      contactS 0..*ContactPoint Contact details for source (e.g. troubleshooting)
      |-- contactpoint-availabletime S 0..*(Complex)Extension URL: http://hl7.org/fhir/us/davinci-pdex-plan-net/StructureDefinition/contactpoint-availabletime
      |-- via-intermediaryS 0..*Reference(Plan-net Organization | Plan-net PractitionerRole | Plan-net OrganizationAffiliation | Plan-net Location) Via IntermediaryURL: http://hl7.org/fhir/us/davinci-pdex-plan-net/StructureDefinition/via-intermediary

      The following are MustSupport for PractionerRole, NOT FOR Practitioner
      |-- systemS 0..1 codephone | fax | email | pager | url | sms | other
      |-- valueS 0..1 stringThe actual contact point details
      |-- rankS 0..1 positiveInt Specify preferred order of use (1 = highest)
  Timing:
    allOf:
    - "$ref": "#/definitions/BackboneElement"
    - type: object
      properties:
        code:
          description: A code for the timing schedule (or just text in code.text).
            Some codes such as BID are ubiquitous, but many institutions define their
            own additional codes. If a code is provided, the code is understood to
            be a complete statement of whatever is specified in the structured timing
            data, and either the code or the data may be used to interpret the Timing,
            with the exception that .repeat.bounds still applies over the code (and
            is not contained in the code).
          "$ref": "#/definitions/CodeableConcept"
        repeat:
          description: A set of rules that describe when the event is scheduled.
          "$ref": "#/definitions/Timing_Repeat"
        event:
          description: Identifies specific times when the event occurs.
          type: array
          items:
