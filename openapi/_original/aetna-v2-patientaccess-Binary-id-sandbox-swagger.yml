          "$ref": "#/definitions/CodeableConcept"
        repeat:
          description: A set of rules that describe when the event is scheduled.
          "$ref": "#/definitions/Timing_Repeat"
        event:
          description: Identifies specific times when the event occurs.
          type: array
          items:
            pattern: "([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\\.[0-9]+)?(Z|(\\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?"
            type: string
  Binary:
    allOf:
    - "$ref": "#/definitions/Resource"
    - type: object
      required:
      - code
      properties:
        code:
          pattern: "[^\\s]+(\\s[^\\s]+)*"
          description: MimeType of the binary content
          type: string
        data:
          description: The base 64 of the actual content
          type: string
        securityContext:
          description: Identifies another resource to use as proxy when enforcing
            access control
          "$ref": "#/definitions/Resource"
  GeolocationExt:
    allOf:
    - "$ref": "#/definitions/Extension"
    - type: object
      required:
      - url
      properties:
        url:
          default: http://hl7.org/fhir/StructureDefinition/geolocation
          type: string
  CodeableConcept:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        coding:
          description: A reference to a code defined by a terminology system.
          type: array
          items:
            "$ref": "#/definitions/Coding"
        text:
          pattern: "[ \\r\\n\\t\\S]+"
          description: A human language representation of the concept as seen/selected/uttered
            by the user who entered the data and/or which represents the intended
            meaning of the user.
          type: string
