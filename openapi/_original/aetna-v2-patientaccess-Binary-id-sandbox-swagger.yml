---
x-ibm-configuration:
  phase: realized
  enforced: true
  testable: true
x-ibm-endpoints:
- endpointUrl: https://qaehapi.aetna.com/fhirdemo/qapath1
  type:
  - production
  - development
- endpointUrl: https://qahapi.aetna.com/fhirdemo/qapath1
  type:
  - production
  - development
schemes:
- https
swagger: '2.0'
security:
- FHIR_Patient_Binary_Read_AccessCode_Oauth:
  - patient/Binary.read
- FHIR_Patient_Binary_Read_AccessCode_Oauth:
  - patient/Binary.*
- FHIR_Patient_Binary_Read_AccessCode_Oauth:
  - patient/*.read
- FHIR_Patient_Binary_Read_AccessCode_Oauth:
  - patient/*.*
basePath: "/v2"
paths:
  "/patientaccess/Binary/{id}":
    get:
      summary: This operation returns a Binary Resource associated with the Logical
        Id.
      operationId: GET
      responses:
        '200':
          schema:
            "$ref": "#/definitions/Binary"
          description: This response returns a representation of a Binary Resource.
        '400':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          description: A required parameter isn’t provided, or an unknown parameter
            is provided.
        '404':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          description: The specified id doesn’t identify an existing Resource.
        '500':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          description: Internal Server Error. Failures on the server side.
      description: Returns an Binary Resource associated with the Logical Id.
      schemes:
      - https
      parameters:
      - in: path
        name: id
        description: This is the logical id.
        type: string
        required: true
host: vteapif1.aetna.com/fhirdemo
produces:
- application/json
externalDocs:
  description: HTTPS Common Error Codes
  url: https://eaintegrationgovernance.github.io/APIC-Common-Error-Codes.github.io/
definitions:
  Meta:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        lastUpdated:
          pattern: "([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\\.[0-9]+)?(Z|(\\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))"
          description: When the resource last changed - e.g. when the version changed.
          type: string
        versionId:
          pattern: "[A-Za-z0-9\\-\\.]{1,64}"
          description: The version specific identifier, as it appears in the version
            portion of the URL. This value changes when the resource is created, updated,
            or deleted.
          type: string
        security:
          description: Security labels applied to this resource. These tags connect
            specific resources to the overall security policy and infrastructure.
          type: array
          items:
            "$ref": "#/definitions/Coding"
        profile:
          description: A list of profiles (references to [StructureDefinition](structuredefinition.html#)
            resources) that this resource claims to conform to. The URL is a reference
            to [StructureDefinition.url](structuredefinition-definitions.html#StructureDefinition.url).
          type: array
          items:
            pattern: "\\S*"
            type: string
        source:
          pattern: "\\S*"
          description: A uri that identifies the source system of the resource. This
            provides a minimal amount of [Provenance](provenance.html#) information
            that can be used to track or differentiate the source of information in
            the resource. The source may identify another FHIR server, document, message,
            database, etc.
          type: string
        tag:
          description: Tags applied to this resource. Tags are intended to be used
            to identify and relate resources to process and workflow, and applications
            are not required to consider the tags when interpreting the meaning of
            a resource.
          type: array
          items:
            "$ref": "#/definitions/Coding"
  DomainResource:
    allOf:
    - "$ref": "#/definitions/Resource"
    - type: object
      properties:
        contained:
          description: These resources do not have an independent existence apart
            from the resource that contains them - they cannot be identified independently,
            and nor can they have their own independent transaction scope.
          type: array
          items:
            "$ref": "#/definitions/Resource"
        extension:
          description: May be used to represent additional information that is not
            part of the basic definition of the resource. To make the use of extensions
            safe and manageable, there is a strict set of governance applied to the
            definition and use of extensions. Though any implementer can define an
            extension, there is a set of requirements that SHALL be met as part of
            the definition of the extension.
          type: array
          items:
            "$ref": "#/definitions/Extension"
        modifierExtension:
          description: |-
            May be used to represent additional information that is not part of the basic definition of the resource and that modifies the understanding of the element that contains it and/or the understanding of the containing element's descendants. Usually modifier elements provide negation or qualification. To make the use of extensions safe and manageable, there is a strict set of governance applied to the definition and use of extensions. Though any implementer is allowed to define an extension, there is a set of requirements that SHALL be met as part of the definition of the extension. Applications processing a resource are required to check for modifier extensions.

            Modifier extensions SHALL NOT change the meaning of any elements on Resource or DomainResource (including cannot change the meaning of modifierExtension itself).
          type: array
          items:
            "$ref": "#/definitions/Extension"
        text:
          description: A human-readable narrative that contains a summary of the resource
            and can be used to represent the content of the resource to a human. The
            narrative need not encode all the structured data, but is required to
            contain sufficient detail to make it "clinically safe" for a human to
            just read the narrative. Resource definitions may define what content
            should be represented in the narrative to ensure clinical safety.
          "$ref": "#/definitions/Narrative"
  Address:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        country:
          pattern: "[ \\r\\n\\t\\S]+"
          description: Country - a nation as commonly understood or generally accepted.
          type: string
        period:
          description: Time period when address was/is in use.
          "$ref": "#/definitions/Period"
        city:
          pattern: "[ \\r\\n\\t\\S]+"
          description: The name of the city, town, suburb, village or other community
            or delivery center.
          type: string
        use:
          description: The purpose of this address.
          type: string
          enum:
          - home
          - work
          - temp
          - old
          - billing
        line:
          description: This component contains the house number, apartment number,
            street name, street direction, P.O. Box number, delivery hints, and similar
            address information.
          type: array
          items:
            pattern: "[ \\r\\n\\t\\S]+"
            type: string
        district:
          pattern: "[ \\r\\n\\t\\S]+"
          description: The name of the administrative area (county).
          type: string
        postalCode:
          pattern: "[ \\r\\n\\t\\S]+"
          description: A postal code designating a region defined by the postal service.
          type: string
        text:
          pattern: "[ \\r\\n\\t\\S]+"
          description: Specifies the entire address as it should be displayed e.g.
            on a postal label. This may be provided instead of or as well as the specific
            parts.
          type: string
        state:
          pattern: "[ \\r\\n\\t\\S]+"
          description: Sub-unit of a country with limited sovereignty in a federally
            organized country. A code may be used if codes are in common use (e.g.
            US 2 letter state codes).
          type: string
        type:
          description: Distinguishes between physical addresses (those you can visit)
            and mailing addresses (e.g. PO Boxes and care-of addresses). Most addresses
            are both.
          type: string
          enum:
          - postal
          - physical
          - both
  Element:
    type: object
    properties:
      extension:
        description: May be used to represent additional information that is not part
          of the basic definition of the element. To make the use of extensions safe
          and manageable, there is a strict set of governance applied to the definition
          and use of extensions. Though any implementer can define an extension, there
          is a set of requirements that SHALL be met as part of the definition of
          the extension.
        type: array
        items:
          "$ref": "#/definitions/Extension"
      id:
        pattern: "[A-Za-z0-9\\-\\.]{1,64}"
        description: Unique id for the element within a resource (for internal references).
          This may be any string value that does not contain spaces.
        type: string
  OperationOutcome_Issue:
    allOf:
    - "$ref": "#/definitions/BackboneElement"
    - type: object
      required:
      - code
      - severity
      properties:
        severity:
          description: Indicates whether the issue indicates a variation from successful
            processing.
          type: string
          enum:
          - fatal
          - error
          - warning
          - information
        diagnostics:
          pattern: "[ \\r\\n\\t\\S]+"
          description: Additional diagnostic information about the issue.
          type: string
        code:
          description: Describes the type of the issue. The system that creates an
            OperationOutcome SHALL choose the most applicable code from the IssueType
            value set, and may additional provide its own code for the error in the
            details element.
          type: string
          enum:
          - invalid
          - structure
          - required
          - value
          - invariant
          - security
          - login
          - unknown
          - expired
          - forbidden
          - suppressed
          - processing
          - not-supported
          - duplicate
          - multiple-matches
          - not-found
          - deleted
          - too-long
          - code-invalid
          - extension
          - too-costly
          - business-rule
          - conflict
          - transient
          - lock-error
          - no-store
          - exception
          - timeout
          - incomplete
          - throttled
          - informational
        expression:
          description: A [simple subset of FHIRPath](fhirpath.html#simple) limited
            to element names, repetition indicators and the default child accessor
            that identifies one of the elements in the resource that caused this issue
            to be raised.
          type: array
          items:
            pattern: "[ \\r\\n\\t\\S]+"
            type: string
        details:
          description: Additional details about the error. This may be a text description
            of the error or a system code that identifies the error.
          "$ref": "#/definitions/CodeableConcept"
        location:
          description: |-
            This element is deprecated because it is XML specific. It is replaced by issue.expression, which is format independent, and simpler to parse.

            For resource issues, this will be a simple XPath limited to element names, repetition indicators and the default child accessor that identifies one of the elements in the resource that caused this issue to be raised. For HTTP errors, will be "http." + the parameter name.
          type: array
          items:
            pattern: "[ \\r\\n\\t\\S]+"
            type: string
  Attachment:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        data:
          pattern: "(\\s*([0-9a-zA-Z\\+\\=]){4}\\s*)+"
          description: The actual data of the attachment - a sequence of bytes, base64
            encoded.
          type: string
        size:
          format: int32
          description: The number of bytes of data that make up this attachment (before
            base64 encoding, if that is done).
          type: integer
        language:
          pattern: "[^\\s]+(\\s[^\\s]+)*"
          description: The human language of the content. The value can be any valid
            value according to BCP 47.
          type: string
        title:
          pattern: "[ \\r\\n\\t\\S]+"
          description: A label or set of text to display in place of the data.
          type: string
        contentType:
          pattern: "[^\\s]+(\\s[^\\s]+)*"
          description: Identifies the type of the data in the attachment and allows
            a method to be chosen to interpret or render the data. Includes mime type
            parameters such as charset where appropriate.
          type: string
        url:
          pattern: "\\S*"
          description: A location where the data can be accessed.
          type: string
        hash:
          pattern: "(\\s*([0-9a-zA-Z\\+\\=]){4}\\s*)+"
          description: The calculated hash of the data using SHA-1. Represented using
            base64.
          type: string
        creation:
          pattern: "([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\\.[0-9]+)?(Z|(\\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?"
          description: The date that the attachment was first created.
          type: string
  Count:
    allOf:
    - "$ref": "#/definitions/Quantity"
    - type: object
  Timing_Repeat:
    allOf:
    - "$ref": "#/definitions/BackboneElement"
    - type: object
      properties:
        boundsRange:
          description: Either a duration for the length of the timing schedule, a
            range of possible length, or outer bounds for start and/or end limits
            of the timing schedule.
          "$ref": "#/definitions/Range"
        period:
          description: Indicates the duration of time over which repetitions are to
            occur; e.g. to express "3 times per day", 3 would be the frequency and
            "1 day" would be the period. If periodMax is present, this element indicates
            the lower bound of the allowed range of the period length.
          type: number
        offset:
          format: int32
          description: The number of minutes from the event. If the event code does
            not indicate whether the minutes is before or after the event, then the
            offset is assumed to be after the event.
          type: integer
        frequencyMax:
          format: int32
          description: If present, indicates that the frequency is a range - so to
            repeat between [frequency] and [frequencyMax] times within the period
            or period range.
          type: integer
        countMax:
          format: int32
          description: If present, indicates that the count is a range - so to perform
            the action between [count] and [countMax] times.
          type: integer
        periodMax:
          description: If present, indicates that the period is a range from [period]
            to [periodMax], allowing expressing concepts such as "do this once every
            3-5 days.
          type: number
        count:
          format: int32
          description: A total count of the desired number of repetitions across the
            duration of the entire timing specification. If countMax is present, this
            element indicates the lower bound of the allowed range of count values.
          type: integer
        periodUnit:
          description: The units of time for the period in UCUM units.
          type: string
          enum:
          - s
          - min
          - h
          - d
          - wk
          - mo
          - a
        when:
          description: An approximate time period during the day, potentially linked
            to an event of daily living that indicates when the action should occur.
          type: array
          items:
            type: string
        frequency:
          format: int32
          description: The number of times to repeat the action within the specified
            period. If frequencyMax is present, this element indicates the lower bound
            of the allowed range of the frequency.
          type: integer
        boundsDuration:
          description: Either a duration for the length of the timing schedule, a
            range of possible length, or outer bounds for start and/or end limits
            of the timing schedule.
          "$ref": "#/definitions/Duration"
        duration:
          description: How long this thing happens for when it happens. If durationMax
            is present, this element indicates the lower bound of the allowed range
            of the duration.
          type: number
        durationMax:
          description: If present, indicates that the duration is a range - so to
            perform the action between [duration] and [durationMax] time length.
          type: number
        dayOfWeek:
          description: If one or more days of week is provided, then the action happens
            only on the specified day(s).
          type: array
          items:
            type: string
        boundsPeriod:
          description: Either a duration for the length of the timing schedule, a
            range of possible length, or outer bounds for start and/or end limits
            of the timing schedule.
          "$ref": "#/definitions/Period"
        durationUnit:
          description: The units of time for the duration, in UCUM units.
          type: string
          enum:
          - s
          - min
          - h
          - d
          - wk
          - mo
          - a
        timeOfDay:
          description: Specified time of day for action to take place.
          type: array
          items:
            pattern: "([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\\.[0-9]+)?"
            type: string
  ContactPoint:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        period:
          description: Time period when the contact point was/is in use.
          "$ref": "#/definitions/Period"
        system:
          description: Telecommunications form for contact point - what communications
            system is required to make use of the contact.
          type: string
          enum:
          - phone
          - fax
          - email
          - pager
          - url
          - sms
          - other
        use:
          description: Identifies the purpose for the contact point.
          type: string
          enum:
          - home
          - work
          - temp
          - old
          - mobile
        rank:
          format: int32
          description: Specifies a preferred order in which to use a set of contacts.
            ContactPoints with lower rank values are more preferred than those with
            higher rank values.
          type: integer
        value:
          pattern: "[ \\r\\n\\t\\S]+"
          description: The actual contact point details, in a form that is meaningful
            to the designated communication system (i.e. phone number or email address).
          type: string
  HumanName:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        given:
          description: Given name.
          type: array
          items:
            pattern: "[ \\r\\n\\t\\S]+"
            type: string
        period:
          description: Indicates the period of time when this name was valid for the
            named person.
          "$ref": "#/definitions/Period"
        use:
          description: Identifies the purpose for this name.
          type: string
          enum:
          - usual
          - official
          - temp
          - nickname
          - anonymous
          - old
          - maiden
        prefix:
          description: Part of the name that is acquired as a title due to academic,
            legal, employment or nobility status, etc. and that appears at the start
            of the name.
          type: array
          items:
            pattern: "[ \\r\\n\\t\\S]+"
            type: string
        text:
          pattern: "[ \\r\\n\\t\\S]+"
          description: Specifies the entire name as it should be displayed e.g. on
            an application UI. This may be provided instead of or as well as the specific
            parts.
          type: string
        family:
          pattern: "[ \\r\\n\\t\\S]+"
          description: The part of a name that links to the genealogy. In some cultures
            (e.g. Eritrea) the family name of a son is the first name of his father.
          type: string
        suffix:
          description: Part of the name that is acquired as a title due to academic,
            legal, employment or nobility status, etc. and that appears at the end
            of the name.
          type: array
          items:
            pattern: "[ \\r\\n\\t\\S]+"
            type: string
  Money:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        currency:
          pattern: "[^\\s]+(\\s[^\\s]+)*"
          description: ISO 4217 Currency Code.
          type: string
        value:
          description: Numerical value (with implicit precision).
          type: number
  Identifier:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        period:
          description: Time period during which identifier is/was valid for use.
          "$ref": "#/definitions/Period"
        system:
          pattern: "\\S*"
          description: Establishes the namespace for the value - that is, a URL that
            describes a set values that are unique.
          type: string
        use:
          description: The purpose of this identifier.
          type: string
          enum:
          - usual
          - official
          - temp
          - secondary
          - old
        assigner:
          description: Organization that issued/manages the identifier.
          "$ref": "#/definitions/Reference"
        type:
          description: A coded type for the identifier that can be used to determine
            which identifier to use for a specific purpose.
          "$ref": "#/definitions/CodeableConcept"
        value:
          pattern: "[ \\r\\n\\t\\S]+"
          description: The portion of the identifier typically relevant to the user
            and which is unique within the context of the system.
          type: string
  Coding:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        system:
          pattern: "\\S*"
          description: The identification of the code system that defines the meaning
            of the symbol in the code.
          type: string
        code:
          pattern: "[^\\s]+(\\s[^\\s]+)*"
          description: A symbol in syntax defined by the system. The symbol may be
            a predefined code or an expression in a syntax defined by the coding system
            (e.g. post-coordination).
          type: string
        userSelected:
          description: Indicates that this coding was chosen by a user directly -
            e.g. off a pick list of available items (codes or displays).
          type: boolean
        display:
          pattern: "[ \\r\\n\\t\\S]+"
          description: A representation of the meaning of the code in the system,
            following the rules of the system.
          type: string
        version:
          pattern: "[ \\r\\n\\t\\S]+"
          description: The version of the code system which was used when choosing
            this code. Note that a well-maintained code system does not need the version
            reported, because the meaning of codes is consistent across versions.
            However this cannot consistently be assured, and when the meaning is not
            guaranteed to be consistent, the version SHOULD be exchanged.
          type: string
  Narrative:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      required:
      - div
      - status
      properties:
        div:
          description: The actual narrative content, a stripped down version of XHTML.
          type: string
        status:
          description: The status of the narrative - whether it's entirely generated
            (from just the defined data or the extensions too), or whether a human
            authored it and it may contain additional data.
          type: string
          enum:
          - generated
          - extensions
          - additional
          - empty
  OperationOutcome:
    allOf:
    - "$ref": "#/definitions/DomainResource"
    - type: object
      required:
      - issue
      properties:
        issue:
          minItems: 1
          description: An error, warning, or information message that results from
            a system action.
          type: array
          items:
            "$ref": "#/definitions/OperationOutcome_Issue"
  SampledData:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      required:
      - dimensions
      - origin
      - period
      properties:
        period:
          description: The length of time between sampling times, measured in milliseconds.
          type: number
        data:
          pattern: "[ \\r\\n\\t\\S]+"
          description: A series of data points which are decimal values separated
            by a single space (character u20). The special values "E" (error), "L"
            (below detection limit) and "U" (above detection limit) can also be used
            in place of a decimal value.
          type: string
        origin:
          description: The base quantity that a measured value of zero represents.
            In addition, this provides the units of the entire measurement series.
          "$ref": "#/definitions/SimpleQuantity"
        upperLimit:
          description: The upper limit of detection of the measured points. This is
            needed if any of the data points have the value "U" (higher than detection
            limit).
          type: number
        lowerLimit:
          description: The lower limit of detection of the measured points. This is
            needed if any of the data points have the value "L" (lower than detection
            limit).
          type: number
        factor:
          description: A correction factor that is applied to the sampled data points
            before they are added to the origin.
          type: number
        dimensions:
          format: int32
          description: The number of sample points at each time point. If this value
            is greater than one, then the dimensions will be interlaced - all the
            sample points for a point in time will be recorded at once.
          type: integer
  Ratio:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        numerator:
          description: The value of the numerator.
          "$ref": "#/definitions/Quantity"
        denominator:
          description: The value of the denominator.
          "$ref": "#/definitions/Quantity"
  Age:
    allOf:
    - "$ref": "#/definitions/Quantity"
    - type: object
  Distance:
    allOf:
    - "$ref": "#/definitions/Quantity"
    - type: object
  Reference:
    allOf:
    - "$ref": "#/definitions/Element"
    - type: object
      properties:
        reference:
          pattern: "[ \\r\\n\\t\\S]+"
          description: A reference to a location at which the other resource is found.
            The reference may be a relative reference, in which case it is relative
            to the service base URL, or an absolute URL that resolves to the location
            where the resource is found. The reference may be version specific or
            not. If the reference is not to a FHIR RESTful server, then it should
            be assumed to be version specific. Internal fragment references (start
            with '#') refer to contained resources.
          type: string
        identifier:
          description: An identifier for the target resource. This is used when there
            is no way to reference the other resource directly, either because the
            entity it represents is not available through a FHIR server, or because
            there is no way for the author of the resource to convert a known identifier
            to an actual location. There is no requirement that a Reference.identifier
            point to something that is actually exposed as a FHIR instance, but it
            SHALL point to a business concept that would be expected to be exposed
            as a FHIR instance, and that instance would need to be of a FHIR resource
            type allowed by the reference.
          "$ref": "#/definitions/Identifier"
        display:
          pattern: "[ \\r\\n\\t\\S]+"
          description: Plain text narrative that identifies the resource in addition
            to the resource reference.
          type: string
        type:
          pattern: "\\S*"
          description: |-
            The expected type of the target of the reference. If both Reference.type and Reference.reference are populated and Reference.reference is a FHIR URL, both SHALL be consistent.

