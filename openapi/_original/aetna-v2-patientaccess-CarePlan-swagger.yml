basePath: "/v2"
paths:
  "/patientaccess/CarePlan":
    get:
      summary: Retrieves all Care Plans associated to an Authenticated User based
        on the search criteria (patient fhir logical id, date, status and category)
      description: Retrieves all Care Plans associated to an Authenticated User based
        on the search criteria (patient fhir logical id, date, status and category)
      operationId: Get
      responses:
        '200':
          schema:
            "$ref": "#/definitions/Bundle"
          examples:
            application/json:
              entry:
              - search:
                  mode: match
                resource:
                  subject:
                    reference: Patient/example
                    display: Amy Shaw
                  text:
                    status: additional
                  category:
                  - coding:
                    - system: http://hl7.org/fhir/us/core/CodeSystem/careplan-category
                      code: assess-plan
                  recorded: '2021-01-07'
                  resourceType: CarePlan
                  status: completed
                fullUrl: https://healthcare.googleapis.com/v1/projects/cdr-devl/locations/us-east4/datasets/cdr-fhir-ds/fhirStores/cdr-fhir-r4-test/fhir/CarePlan/11181211064
              - search:
                  mode: match
                resource:
                  subject:
                    reference: Patient/example
                    display: Amy Shaw
                  text:
                    status: additional
                  category:
                  - coding:
                    - system: http://hl7.org/fhir/us/core/CodeSystem/careplan-category
                      code: assess-plan
                  recorded: '2021-01-07'
                  resourceType: CarePlan
                  status: completed
                fullUrl: https://healthcare.googleapis.com/v1/projects/cdr-devl/locations/us-east4/datasets/cdr-fhir-ds/fhirStores/cdr-fhir-r4-test/fhir/CarePlan/11181210653
              total: 2
              link:
              - url: https://healthcare.googleapis.com/v1/projects/cdr-devl/locations/us-east4/datasets/cdr-fhir-ds/fhirStores/cdr-fhir-r4-test/fhir/CarePlan/?_count=2
                relation: search
              - url: https://healthcare.googleapis.com/v1/projects/cdr-devl/locations/us-east4/datasets/cdr-fhir-ds/fhirStores/cdr-fhir-r4-test/fhir/CarePlan/?_count=2&_page_token=Cjj3YEef7v%2F%2F%2F%2F%2BABb0c6BuGuAD%2FAf%2F%2BOGQzY2FiYmE2OTc5N2U0NGFmNmNiM2Y1OTAwYWRhOGIAARACIRdZYDGqWfwzOQAAAAARYLifSAJQAFoLCcJRz98ugOf9EANg3JPmgwY%3D
                relation: next
              - url: https://healthcare.googleapis.com/v1/projects/cdr-devl/locations/us-east4/datasets/cdr-fhir-ds/fhirStores/cdr-fhir-r4-test/fhir/CarePlan/?_count=2
                relation: first
              - url: https://healthcare.googleapis.com/v1/projects/cdr-devl/locations/us-east4/datasets/cdr-fhir-ds/fhirStores/cdr-fhir-r4-test/fhir/CarePlan/?_count=2
                relation: self
              id: a7bca4215fbc6e68b01b0801
              type: searchset
              resourceType: Bundle
          description: This response returns a list of a Patient's CarePlans
        '400':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          examples:
            application/json:
              issue:
              - severity: error
                code: required
                details:
                  coding:
                  - system: http://hl7.org/fhir/ValueSet/operation-outcome
                    code: MSG_RESOURCE_ID_MISSING
                    display: Resource Id Missing
              id: 14c27ea91f91d8f01234
              resourceType: OperationOutcome
          description: A required parameter isn’t provided, or an unknown parameter
            is provided.
        '404':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          examples:
            application/json:
              issue:
              - severity: error
                code: not-found
                details:
                  coding:
                  - system: http://hl7.org/fhir/ValueSet/operation-outcome
                    code: MSG_NO_MATCH
                    display: No Resource found
              id: 687401f85fd3fefb43182c22
              resourceType: OperationOutcome
          description: The specified id doesn’t identify an existing Resource.
        '500':
          schema:
            "$ref": "#/definitions/OperationOutcome"
          examples:
            application/json:
              issue:
              - severity: fatal
                diagnostics: Backend service failure
                code: exception
                details:
                  coding:
                  - system: http://hl7.org/fhir/ValueSet/operation-outcome
                    code: MSG_SVC_FAILURE
                    display: Error occurred while processing response
              id: 53c27ea45fd8f0ff0af91f91
              resourceType: OperationOutcome
          description: Internal Server Error. Failures on the server side.
        x-USCoreCarePlan:
          schema:
            "$ref": "#/definitions/USCoreCarePlan"
          description: The API will never return this response. This parameter is
            here to facilitate the generation of the USCore CarePlan profile schema
            within the interface.
      parameters:
      - in: query
        name: patient
        description: |-
          This is the FHIR Logical Id of a Patient (Patient.id)
           Ex. GET [base]/CarePlan?patient=98765212349744
        type: string
        required: false
      - in: query
        name: category
        description: Example codes indicating the category a care plan falls within.
          Note that these are in no way complete and might not even be appropriate
          for some uses.
        type: string
        required: false
      - in: query
        name: _page_token
        description: This value will be provided by the Server. It is used to retrieve
          the next page of results.   If a search returns more resources than fit
          on one page, the response includes a pagination URL in the Bundle.link field.  The
          value with Bundle.link.relation = next indicates that you can use the corresponding
          Bundle.link.url to retrieve the next page.  ex. GET [base]/CarePlan?_count=10&_page_token=Cjj3YQP%2Bdf%2F%2F%2F%2F%2BABchXMXghfgD%2FAf%2F%2BZTA5NWM4YmI0YWNlYWQ4Yjc5NDhjYTk2M2RhMDA5N2QAARAKIeRmIPX4MlS1OQAAAACKAfyeSAFQAFoLCfRXKWB76f3NEANgg8Tc2gc%3D
        type: string
        required: false
      - in: query
        name: _count
        description: Used to specify the number of records returned per page
        type: number
        required: false
      - in: query
        name: _revinclude
        description: |-
          Adds support for searching the US Core Profile resource types for all the Provenance records for those resources using the _revinclude search parameter:

          GET [base]/[CarePlan]?_revinclude=Provenance:target
        type: string
        required: false
