        frequencyMax:
          format: int32
          description: If present, indicates that the frequency is a range - so to
            repeat between [frequency] and [frequencyMax] times within the period
            or period range.
          type: integer
        countMax:
          format: int32
          description: If present, indicates that the count is a range - so to perform
            the action between [count] and [countMax] times.
          type: integer
