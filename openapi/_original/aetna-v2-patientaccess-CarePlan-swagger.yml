  USCoreCarePlan:
    allOf:
    - "$ref": "#/definitions/CarePlan"
    - type: object
      required:
      - category
      - intent
      - status
      - subject
      - text
      properties:
        subject:
          description: |-
            https://www.hl7.org/fhir/conformance-rules.html#mustSupport
            References US Core Patient Profile
          "$ref": "#/definitions/Reference"
        text:
          description: |-
            http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport

            status 1..1 type = code Binding: US Core Narrative Status (required)
          "$ref": "#/definitions/Narrative"
        category:
          minItems: 1
          description: |-
            http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport
            Following elements under category and their multiplicity are:
            coding 1..* type = Coding
             |--system 1..1 type = uriIdentity of the terminology system Fixed Value: http://hl7.org/fhir/us/core/CodeSystem/careplan-category
             |--code 1..1 type = codeFixed Value: assess-plan
          type: array
          items:
            "$ref": "#/definitions/USCoreCodeableConceptAssessPlan"
        intent:
          description: |-
            http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport

            Binding: CarePlanIntent (required)
          type: string
          enum:
          - proposal
          - plan
          - order
          - option
        status:
          description: |-
            http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport
            Binding: RequestStatus (required)
          type: string
          enum:
          - draft
          - active
          - on-hold
          - revoked
          - completed
          - entered-in-error
          - unknown
    description: |-
      ##Summary of the Mandatory Requirements
      1. A Narrative in CarePlan.text
       - which must have a code value in CarePlan.text.status with a required binding to US Core Narrative Status
      2. A code in CarePlan.status with a required binding to RequestStatus
      3. A code in CarePlan.intent with a required binding to Care Plan Intent
      4. One or more CodeableConcepts in CarePlan.category with an example binding to Care Plan Category
       - which must have at least a CodeableConcept value in CarePlan.category with an example binding to Care Plan Category
      - which must have a Coding value in CarePlan.category.coding
      - which must have a fixed CarePlan.category.coding.system = http://hl7.org/fhir/us/core/CodeSystem/careplan-category
      - which must have a fixed CarePlan.category.coding.code = assess-plan
      5. A Patient Reference in CarePlan.subject
