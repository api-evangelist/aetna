info:
  contact:
    name: Interoperability Developer Support
    url: 'http://'
    email: interoperabilitydevelopersupport@aetna.com
  description: >-
    The Aetna Patient Access API is an enterprise API that implements the HL7
    FHIR standard and provides the ability for Aetna members to access their
    data using Third-party client applications supporting those standards. The
    API supports the FHIR MedicationKnowledge resource and conforms to the
    DaVinci FormularyDrug Profile specified in the DaVinci Implementation Guide.
    This API currently follows User token security. The medicationKnowledge
    resource supports:


    1) Launch MedicationKnowledge by calling the [FHIR Base]/MedicationKnowledge
    with Plan Identifier which will request the MedicationKnowledge resource for
    the Authenticated user.



    The FormularyDrug profile of the FHIR R4 MedicationKnowledge resource
    provides plan-specific information about a prescriptible drug identified by
    an RxNORM identifier. Cost sharing for the drug are described by reference
    to a drug tier defined as part of the coverage plan. Extensions to the
    MedicationKnowledge resource support important search use cases. Due to the
    immaturity of the MedicationKnowledge resource, it is expected that it will
    undergo changes, and those changes may require evolution of the
    FormularyDrug profile.
  x-ibm-name: v2patientaccessmedicationknowledge
  title: /v2/patientaccess/MedicationKnowledge
  version: 2.0.1
