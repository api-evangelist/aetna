info:
  contact:
    name: Interoperability Developer Support
    email: interoperabilitydevelopersupport@aetna.com
  description: >-
    An InsurancePlan is a discrete package of health insurance coverage benefits
    that are offered under a particular network type. A given payer’s products
    typically differ by network type and/or covered benefits. A plan pairs a
    product’s covered benefits with the particular cost sharing structure
    offered to a consumer. A given product may comprise multiple plans (i.e.
    each plan offers different cost sharing requirements for the same set of
    covered benefits).InsurancePlan describes a health insurance offering
    comprised of a list of covered benefits (i.e. the product), costs associated
    with those benefits (i.e. the plan), and additional information about the
    offering, such as who it is owned and administered by, a coverage area,
    contact information, etc.
  x-ibm-name: v1providerdirectorydatainsuranceplan
  title: /v1/providerdirectorydata/InsurancePlan
  version: 1.0.0
