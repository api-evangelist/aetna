info:
  contact:
    name: Interoperability Developer Support
    email: interoperabilitydevelopersupport@aetna.com
  description: >-
    This API supports the DaVinci Plan-Net Organization and Plan-Net Network
    Profiles that were created from the US Core Organization Profile.An
    organization is a formal or informal grouping of people or organizations
    with a common purpose, such as a company, institution, corporation,
    community group, or healthcare practice. A Network refers to a healthcare
    provider insurance network. A healthcare provider insurance network is an
    aggregation of organizations and individuals that deliver a set of services
    across a geography through health insurance products/plans.


    To specifically query for Organization profile records or Networks profile
    records, you may search using the _profile search parameter or you may
    search by organization type
  x-ibm-name: v1providerdirectorydataorganization
  title: /v1/providerdirectorydata/Organization
  version: 1.0.0
