            description: The version of the standard that is used to operate and communicate.
            type: array
            items:
              $ref: '#/components/schemas/Device_Version'
          url:
            pattern: \S*
            description: A network address on which the device may be contacted directly.
            type: string
          udiCarrier:
            description: Unique device identifier (UDI) assigned to device label or package. Note that the Device
              may include multiple udiCarriers as it either may include just the udiCarrier for the jurisdiction
              it is sold, or for multiple jurisdictions it could have been sold.
            type: array
            items:
              $ref: '#/components/schemas/Device_UdiCarrier'
          specialization:
            description: The capabilities supported on a device, the standards to which the device conforms for
              a particular purpose, and used for the communication.
            type: array
            items:
              $ref: '#/components/schemas/Device_Specialization'
          modelNumber:
            pattern: '[ \r\n\t\S]+'
            description: The model number for the device.
            type: string
          partNumber:
            pattern: '[ \r\n\t\S]+'
            description: The part number of the device.
            type: string
          location:
            description: The place where the device can be found.
            $ref: '#/components/schemas/Reference'
          status:
            description: Status of the Device availability.
            type: string
            enum:
            - active
            - inactive
            - entered-in-error
            - unknown
    USCoreImplantableDevice:
      allOf:
      - $ref: '#/components/schemas/Device'
      - type: object
        required:
        - patient
        - type
        properties:
          serialNumber:
            description: https://hl7.org/fhir/conformance-rules.html#mustSupport
            type: string
          udiCarrier:
            description: 'https://hl7.org/fhir/conformance-rules.html#mustSupport


              Elements are under udiCarrier and their Cardinality and Type:

              carrierAIDC0..1 base64Binary

              carrierHRF0..1 string

              deviceIdentifier1..1 string'
            $ref: '#/components/schemas/Device_UdiCarrier'
          patient:
            description: 'Reference USCorePatient http://hl7.org/fhir/us/core/STU3.1/StructureDefinition-us-core-patient.html

              https://hl7.org/fhir/conformance-rules.html#mustSupport'
            $ref: '#/components/schemas/Reference'
          manufactureDate:
            format: date-time
            description: https://hl7.org/fhir/conformance-rules.html#mustSupport
            type: string
          distinctIdentifier:
            description: https://hl7.org/fhir/conformance-rules.html#mustSupport
            type: string
          lotNumber:
            description: https://hl7.org/fhir/conformance-rules.html#mustSupport
            type: string
          type:
            description: 'https://hl7.org/fhir/conformance-rules.html#mustSupport


              Binding: FHIRDeviceTypes (extensible), http://hl7.org/fhir/R4/valueset-device-kind.html'
            $ref: '#/components/schemas/CodeableConcept'
          expirationDate:
            format: date-time
            description: https://hl7.org/fhir/conformance-rules.html#mustSupport
            type: string
      description: "Device\n\n#Summary of the Mandatory Requirements\n 1. A CodeableConcept in Device.type with\
        \ an extensible binding to FHIR Device Types\n 2. A Patient Reference in Device.patient\n\n#Summary of the\
        \ Must Support Requirements\n 1. A Udicarrier in Device.udiCarrier\n- which must have a string value in\
        \ Device.udiCarrier.deviceIdentifier\n- which should have a base64Binary value in Device.udiCarrier.carrierAIDC\n\
        - which should have a string value in Device.udiCarrier.carrierHRF\n 2. A string in Device.distinctIdentifier\n\
        \ 3. A dateTime in Device.manufactureDate\n 4. A dateTime in Device.expirationDate\n 5. A string in Device.lotNumber\n\
        \ 6. A string in Device.serialNumber\n\n#Summary of Constraints\n 1. Implantable medical devices that have\
        \ UDI information SHALL represent this information in either carrierAIDC or carrierHRF.\n 2. For implantable\
        \ medical devices that have UDI information, at least one of the Production Identifiers (UDI-PI) SHALL be\
        \ present."
    Device_UdiCarrier:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          entryType:
            description: A coded entry to indicate how the data was entered.
            type: string
            enum:
            - barcode
            - rfid
            - manual
            - card
            - self-reported
            - unknown
          deviceIdentifier:
            pattern: '[ \r\n\t\S]+'
            description: The device identifier (DI) is a mandatory, fixed portion of a UDI that identifies the labeler
              and the specific version or model of a device.
            type: string
          carrierHRF:
            pattern: '[ \r\n\t\S]+'
            description: The full UDI carrier as the human readable form (HRF) representation of the barcode string
              as printed on the packaging of the device.
            type: string
          jurisdiction:
            pattern: \S*
            description: The identity of the authoritative source for UDI generation within a jurisdiction. All
              UDIs are globally unique within a single namespace with the appropriate repository uri as the system.
              For example, UDIs of devices managed in the U.S. by the FDA, the value is http://hl7.org/fhir/NamingSystem/fda-udi.
            type: string
          issuer:
            pattern: \S*
            description: 'Organization that is charged with issuing UDIs for devices. For example, the US FDA issuers
              include :

              1) GS1:

              http://hl7.org/fhir/NamingSystem/gs1-di,

              2) HIBCC:

              http://hl7.org/fhir/NamingSystem/hibcc-dI,

              3) ICCBBA for blood containers:

              http://hl7.org/fhir/NamingSystem/iccbba-blood-di,

              4) ICCBA for other devices:

              http://hl7.org/fhir/NamingSystem/iccbba-other-di.'
            type: string
          carrierAIDC:
            pattern: (\s*([0-9a-zA-Z\+\=]){4}\s*)+
            description: The full UDI carrier of the Automatic Identification and Data Capture (AIDC) technology
              representation of the barcode string as printed on the packaging of the device - e.g., a barcode or
              RFID.Because of limitations on character sets in XML and the need to round-trip JSON data through
              XML, AIDC Formats *SHALL* be base64 encoded.
            type: string
    Device_DeviceName:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - name
        - type
        properties:
          name:
