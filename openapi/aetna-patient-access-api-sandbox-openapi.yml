          language:
            description: The ISO-639-1 alpha 2 code in lower case for the language, optionally followed by a hyphen
              and the ISO-3166-1 alpha 2 code for the region in upper case; e.g. "en" for English, or "en-US" for
              American English versus "en-EN" for England English.
            $ref: '#/components/schemas/CodeableConcept'
          preferred:
            description: Indicates whether or not the patient prefers this language (over other languages he masters
              up a certain level).
            type: boolean
    Patient_Link:
