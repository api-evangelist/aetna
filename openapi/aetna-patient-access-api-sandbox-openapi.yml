        \ in DiagnosticReport.code with an extensible binding to US Core Diagnostic Report Laboratory Codes\n4.\
        \ A Patient Reference in DiagnosticReport.subject\n5. A dateTime in DiagnosticReport.effective[x]\n6. An\
        \ instant in DiagnosticReport.issued\n\n##Summary of the Must Support Requirements\n1. One or more Performer\
        \ References in DiagnosticReport.performer\n2. One or more Result References in DiagnosticReport.result"
