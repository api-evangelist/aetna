    Goal:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        required:
        - description
        - lifecycleStatus
        - subject
        properties:
          statusDate:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1]))?)?
            description: Identifies when the current status. I.e. When initially created, when achieved, when cancelled,
              etc.
            type: string
          identifier:
            description: Business identifiers assigned to this goal by the performer or other systems which remain
              constant as the resource is updated and propagates from server to server.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          note:
            description: Any comments related to the goal.
            type: array
            items:
              $ref: '#/components/schemas/Annotation'
          addresses:
            description: The identified conditions and other health record elements that are intended to be addressed
              by the goal.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          lifecycleStatus:
            description: The state of the goal throughout its lifecycle.
            type: string
            enum:
            - proposed
            - planned
            - accepted
            - active
            - on-hold
            - completed
            - cancelled
            - entered-in-error
            - rejected
          subject:
            description: Identifies the patient, group or organization for whom the goal is being established.
            $ref: '#/components/schemas/Reference'
          outcomeReference:
            description: Details of what's changed (or not changed).
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          description:
            description: Human-readable and/or coded description of a specific desired objective of care, such as
              "control blood pressure" or "negotiate an obstacle course" or "dance with child at wedding".
            $ref: '#/components/schemas/CodeableConcept'
          outcomeCode:
            description: Identifies the change (or lack of change) at the point when the status of the goal is assessed.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          priority:
            description: Identifies the mutually agreed level of importance associated with reaching/sustaining
              the goal.
            $ref: '#/components/schemas/CodeableConcept'
          target:
            description: Indicates what should be done by when.
            type: array
            items:
              $ref: '#/components/schemas/Goal_Target'
          expressedBy:
            description: Indicates whose goal this is - patient goal, practitioner goal, etc.
            $ref: '#/components/schemas/Reference'
          statusReason:
            pattern: '[ \r\n\t\S]+'
            description: Captures the reason for the current status.
            type: string
          startCodeableConcept:
            description: The date or event after which the goal should begin being pursued.
            $ref: '#/components/schemas/CodeableConcept'
          achievementStatus:
            description: Describes the progression, or lack thereof, towards the goal against the target.
            $ref: '#/components/schemas/CodeableConcept'
          category:
            description: Indicates a category the goal falls within.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          startDate:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1]))?)?
            description: The date or event after which the goal should begin being pursued.
            type: string
    USCoreGoal:
      allOf:
      - $ref: '#/components/schemas/Goal'
      - type: object
        required:
        - description
        - lifecycleStatus
        - subject
        properties:
          lifecycleStatus:
            description: 'https://hl7.org/fhir/conformance-rules.html#mustSupport

              Binding: GoalLifecycleStatus (required) - http://hl7.org/fhir/R4/valueset-goal-status.html'
            type: string
            enum:
            - proposed
            - planned
            - accepted
            - active
            - on-hold
            - completed
            - cancelled
            - entered-in-error
            - rejected
          subject:
            description: 'Reference https://hl7.org/fhir/us/core/STU3.1/StructureDefinition-us-core-patient.html

              https://hl7.org/fhir/conformance-rules.html#mustSupport'
            $ref: '#/components/schemas/Reference'
          description:
            description: https://hl7.org/fhir/conformance-rules.html#mustSupport
            $ref: '#/components/schemas/CodeableConcept'
          target:
            description: 'https://hl7.org/fhir/conformance-rules.html#mustSupport

              .. dueDate S 0..1 date'
            type: array
            items:
              $ref: '#/components/schemas/Goal_Target'
      description: 'Goal


        Summary of the Mandatory Requirements

        A code in Goal.lifecycleStatus with a required binding to GoalLifecycleStatus

        A CodeableConcept in Goal.description with an example binding to SNOMED CT Clinical Findings

        A Patient Reference in Goal.subject

        Summary of the Must Support Requirements

        One or more Targets in Goal.target with the following constraints: Goal.target.measure is required if Goal.target.detail
        is populated

        which should have a date value in Goal.target.dueDate

        Summary of Constraints

        Goal.target.measure is required if Goal.target.detail is populated'
    Goal_Target:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          detailRange:
            description: The target value of the focus to be achieved to signify the fulfillment of the goal, e.g.
              150 pounds, 7.0%. Either the high or low or both values of the range can be specified. When a low
              value is missing, it indicates that the goal is achieved at any focus value at or below the high value.
              Similarly, if the high value is missing, it indicates that the goal is achieved at any focus value
              at or above the low value.
            $ref: '#/components/schemas/Range'
          measure:
            description: The parameter whose value is being tracked, e.g. body weight, blood pressure, or hemoglobin
              A1c level.
            $ref: '#/components/schemas/CodeableConcept'
          detailRatio:
            description: The target value of the focus to be achieved to signify the fulfillment of the goal, e.g.
              150 pounds, 7.0%. Either the high or low or both values of the range can be specified. When a low
              value is missing, it indicates that the goal is achieved at any focus value at or below the high value.
              Similarly, if the high value is missing, it indicates that the goal is achieved at any focus value
              at or above the low value.
            $ref: '#/components/schemas/Ratio'
          detailInteger:
            format: int32
            description: The target value of the focus to be achieved to signify the fulfillment of the goal, e.g.
              150 pounds, 7.0%. Either the high or low or both values of the range can be specified. When a low
              value is missing, it indicates that the goal is achieved at any focus value at or below the high value.
              Similarly, if the high value is missing, it indicates that the goal is achieved at any focus value
              at or above the low value.
            type: integer
          detailQuantity:
            description: The target value of the focus to be achieved to signify the fulfillment of the goal, e.g.
              150 pounds, 7.0%. Either the high or low or both values of the range can be specified. When a low
              value is missing, it indicates that the goal is achieved at any focus value at or below the high value.
              Similarly, if the high value is missing, it indicates that the goal is achieved at any focus value
              at or above the low value.
            $ref: '#/components/schemas/Quantity'
          dueDate:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1]))?)?
            description: Indicates either the date or the duration after start by which the goal should be met.
            type: string
          detailCodeableConcept:
            description: The target value of the focus to be achieved to signify the fulfillment of the goal, e.g.
              150 pounds, 7.0%. Either the high or low or both values of the range can be specified. When a low
              value is missing, it indicates that the goal is achieved at any focus value at or below the high value.
              Similarly, if the high value is missing, it indicates that the goal is achieved at any focus value
              at or above the low value.
            $ref: '#/components/schemas/CodeableConcept'
          detailString:
            pattern: '[ \r\n\t\S]+'
            description: The target value of the focus to be achieved to signify the fulfillment of the goal, e.g.
              150 pounds, 7.0%. Either the high or low or both values of the range can be specified. When a low
              value is missing, it indicates that the goal is achieved at any focus value at or below the high value.
              Similarly, if the high value is missing, it indicates that the goal is achieved at any focus value
              at or above the low value.
            type: string
          detailBoolean:
            description: The target value of the focus to be achieved to signify the fulfillment of the goal, e.g.
              150 pounds, 7.0%. Either the high or low or both values of the range can be specified. When a low
              value is missing, it indicates that the goal is achieved at any focus value at or below the high value.
              Similarly, if the high value is missing, it indicates that the goal is achieved at any focus value
              at or above the low value.
            type: boolean
          dueDuration:
            description: Indicates either the date or the duration after start by which the goal should be met.
            $ref: '#/components/schemas/Duration'
    Immunization:
