            type: number
    AllergyIntolerance:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        required:
        - patient
        properties:
          identifier:
            description: Business identifiers assigned to this AllergyIntolerance by the performer or other systems
              which remain constant as the resource is updated and propagates from server to server.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          note:
            description: Additional narrative about the propensity for the Adverse Reaction, not captured in other
              fields.
            type: array
            items:
              $ref: '#/components/schemas/Annotation'
          recorder:
            description: Individual who recorded the record and takes responsibility for its content.
            $ref: '#/components/schemas/Reference'
          code:
            description: 'Code for an allergy or intolerance statement (either a positive or a negated/excluded
              statement). This may be a code for a substance or pharmaceutical product that is considered to be
              responsible for the adverse reaction risk (e.g., "Latex"), an allergy or intolerance condition (e.g.,
              "Latex allergy"), or a negated/excluded code for a specific substance or class (e.g., "No latex allergy")
              or a general or categorical negated statement (e.g., "No known allergy", "No known drug allergies").
              Note: the substance for a specific reaction may be different from the substance identified as the
              cause of the risk, but it must be consistent with it. For instance, it may be a more specific substance
              (e.g. a brand medication) or a composite product that includes the identified substance. It must be
              clinically safe to only process the ''code'' and ignore the ''reaction.substance''. If a receiving
              system is unable to confirm that AllergyIntolerance.reaction.substance falls within the semantic scope
              of AllergyIntolerance.code, then the receiving system should ignore AllergyIntolerance.reaction.substance.'
            $ref: '#/components/schemas/CodeableConcept'
          onsetPeriod:
            description: Estimated or actual date, date-time, or age when allergy or intolerance was identified.
            $ref: '#/components/schemas/Period'
          reaction:
            description: Details about each adverse reaction event linked to exposure to the identified substance.
            type: array
            items:
              $ref: '#/components/schemas/AllergyIntolerance_Reaction'
          verificationStatus:
            description: Assertion about certainty associated with the propensity, or potential risk, of a reaction
              to the identified substance (including pharmaceutical product).
            $ref: '#/components/schemas/CodeableConcept'
          onsetRange:
            description: Estimated or actual date, date-time, or age when allergy or intolerance was identified.
            $ref: '#/components/schemas/Range'
          recordedDate:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
            description: The recordedDate represents when this particular AllergyIntolerance record was created
              in the system, which is often a system-generated date.
            type: string
          criticality:
            description: Estimate of the potential clinical harm, or seriousness, of the reaction to the identified
              substance.
            type: string
            enum:
            - low
            - high
            - unable-to-assess
          encounter:
            description: The encounter when the allergy or intolerance was asserted.
            $ref: '#/components/schemas/Reference'
          clinicalStatus:
            description: The clinical status of the allergy or intolerance.
            $ref: '#/components/schemas/CodeableConcept'
          type:
            description: Identification of the underlying physiological mechanism for the reaction risk.
            type: string
            enum:
            - allergy
            - intolerance
          onsetDateTime:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
            description: Estimated or actual date, date-time, or age when allergy or intolerance was identified.
            type: string
          onsetString:
            pattern: '[ \r\n\t\S]+'
            description: Estimated or actual date, date-time, or age when allergy or intolerance was identified.
            type: string
          onsetAge:
            description: Estimated or actual date, date-time, or age when allergy or intolerance was identified.
            $ref: '#/components/schemas/Age'
          asserter:
            description: The source of the information about the allergy that is recorded.
            $ref: '#/components/schemas/Reference'
          patient:
            description: The patient who has the allergy or intolerance.
            $ref: '#/components/schemas/Reference'
          lastOccurrence:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
            description: Represents the date and/or time of the last known occurrence of a reaction event.
            type: string
          category:
            description: Category of the identified substance.
            type: array
            items:
              type: string
    Identifier:
      allOf:
