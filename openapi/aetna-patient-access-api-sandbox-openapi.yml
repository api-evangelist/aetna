            description: A representation of the meaning of the code in the system, following the rules of the system.
            type: string
          version:
            pattern: '[ \r\n\t\S]+'
            description: The version of the code system which was used when choosing this code. Note that a well-maintained
              code system does not need the version reported, because the meaning of codes is consistent across
