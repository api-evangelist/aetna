openapi: 3.0.3
info:
  title: Aetna Patient Access API (Sandbox)
  version: 1.0.0
  description: 'The Aetna Patient Access API is an enterprise API that implements the HL7 FHIR standard to meet
    the CMS requirements for Interoperability. The API provides the ability for Aetna members to access their Clinical
    data using Third-party client applications supporting those standards. The Patient Access API supports the FHIR
    AllergyIntolerance resource that conforms to the HL7 FHIR USCore Implementation Guide STU5 Release v5.0.1 and
    supports USCore AllergyIntolerance Profile. The API follows the User token security model.


    The AllergyIntolerance Read API supports the following operations:


    1. Read the current state of the resource using the Logical (unique) ID [FHIR Base]/AllergyIntolerance/{id}'
  contact:
    name: Aetna Interoperability Developer Support
    email: InteroperabilityDeveloperSupport@aetna.com
    url: https://developerportal.aetna.com/
  x-assembled-by: API Evangelist enrichment pipeline
  x-assembly-note: 'Assembled from 39 single-operation Swagger 2.0 documents that Aetna publishes itself at https://developerportal.aetna.com/managedcontent/yaml/<file>,
    listed in the portal''s own API catalog at https://developerportal.aetna.com/assets/Data/Fhir.json. Every path,
    parameter, description, schema, example and security definition below is Aetna''s verbatim content; the union,
    the Swagger 2.0 -> OpenAPI 3.0.3 structural conversion, and the operationIds are ours (Aetna sets every operationId
    to the literal string "GET", which is not unique across a merged document). The unmodified sources are archived
    in openapi/_original/. NOTE ON MERGE FIDELITY: where two source documents define a schema of the same name with
    different content (FHIR profile variants), the first definition encountered wins and that divergence is not
    represented here; the per-operation source of truth is always the archived original named in each operation''s
    x-source-file.'
servers:
- url: https://vteapif1.aetna.com/fhirdemo
paths:
