        properties:
          rateRatio:
            description: Amount of medication per unit of time.
            $ref: '#/components/schemas/Ratio'
          rateRange:
            description: Amount of medication per unit of time.
            $ref: '#/components/schemas/Range'
          doseRange:
            description: Amount of medication per dose.
            $ref: '#/components/schemas/Range'
          doseQuantity:
            description: Amount of medication per dose.
            $ref: '#/components/schemas/SimpleQuantity'
          rateQuantity:
            description: Amount of medication per unit of time.
            $ref: '#/components/schemas/SimpleQuantity'
          type:
            description: The kind of dose or rate specified, for example, ordered or calculated.
            $ref: '#/components/schemas/CodeableConcept'
    MedicationRequest:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        required:
        - intent
        - status
        - subject
        properties:
          insurance:
            description: Insurance plans, coverage extensions, pre-authorizations and/or pre-determinations that
              may be required for delivering the requested service.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          note:
            description: Extra information about the prescription that could not be conveyed by the other attributes.
            type: array
            items:
              $ref: '#/components/schemas/Annotation'
          substitution:
            description: Indicates whether or not substitution can or should be part of the dispense. In some cases,
              substitution must happen, in other cases substitution must not happen. This block explains the prescriber's
              intent. If nothing is specified substitution may be done.
            $ref: '#/components/schemas/MedicationRequest_Substitution'
          subject:
            description: A link to a resource representing the person or set of individuals to whom the medication
              will be given.
            $ref: '#/components/schemas/Reference'
          courseOfTherapyType:
            description: The description of the overall patte3rn of the administration of the medication to the
              patient.
            $ref: '#/components/schemas/CodeableConcept'
          priorPrescription:
            description: A link to a resource representing an earlier order related order or prescription.
            $ref: '#/components/schemas/Reference'
          reasonReference:
            description: Condition or observation that supports why the medication was ordered.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          instantiatesUri:
            description: The URL pointing to an externally maintained protocol, guideline, orderset or other definition
              that is adhered to in whole or in part by this MedicationRequest.
            type: array
            items:
              pattern: \S*
              type: string
          medicationReference:
            description: Identifies the medication being requested. This is a link to a resource that represents
              the medication which may be the details of the medication or simply an attribute carrying a code that
              identifies the medication from a known list of medications.
            $ref: '#/components/schemas/Reference'
          reportedReference:
            description: Indicates if this record was captured as a secondary 'reported' record rather than as an
              original primary source-of-truth record. It may also indicate the source of the report.
            $ref: '#/components/schemas/Reference'
          statusReason:
            description: Captures the reason for the current state of the MedicationRequest.
            $ref: '#/components/schemas/CodeableConcept'
          dispenseRequest:
            description: Indicates the specific details for the dispense or medication supply part of a medication
              request (also known as a Medication Prescription or Medication Order). Note that this information
              is not always sent with the order. There may be in some settings (e.g. hospitals) institutional or
              system support for completing the dispense details in the pharmacy department.
            $ref: '#/components/schemas/MedicationRequest_DispenseRequest'
          reasonCode:
            description: The reason or the indication for ordering or not ordering the medication.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          doNotPerform:
            description: If true indicates that the provider is asking for the medication request not to occur.
            type: boolean
          basedOn:
            description: A plan or request that is fulfilled in whole or in part by this medication request.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          requester:
            description: The individual, organization, or device that initiated the request and has responsibility
              for its activation.
            $ref: '#/components/schemas/Reference'
