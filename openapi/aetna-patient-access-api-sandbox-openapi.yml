    Organization:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        properties:
          identifier:
            description: Identifier for the organization that is used to identify the organization across multiple
              disparate systems.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          partOf:
            description: The organization of which this organization forms a part.
            $ref: '#/components/schemas/Reference'
          endpoint:
            description: Technical endpoints providing access to services operated for the organization.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          address:
            description: An address for the organization.
            type: array
            items:
              $ref: '#/components/schemas/Address'
          contact:
            description: Contact for the organization for a certain purpose.
            type: array
            items:
              $ref: '#/components/schemas/Organization_Contact'
          name:
            pattern: '[ \r\n\t\S]+'
            description: A name associated with the organization.
            type: string
          active:
            description: Whether the organization's record is still in active use.
            type: boolean
          alias:
            description: A list of alternate names that the organization is known as, or was known as in the past.
            type: array
            items:
              pattern: '[ \r\n\t\S]+'
              type: string
          telecom:
            description: A contact detail for the organization.
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
          type:
            description: The kind(s) of organization that this is.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
    C4BBOrganization:
      allOf:
      - $ref: '#/components/schemas/USCoreOrganization'
      - type: object
        required:
        - active
        - meta
        - name
        properties:
          identifier:
            description: 'http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Organization-definitions.html#Organization.identifier


              identifier0..* https://hl7.org/fhir/conformance-rules.html#mustSupport


              =============================

              identifier:NPI0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              identifier.type1..1

              identifier.type.coding1..*

              identifier.type.coding.system 1..1 Fixed Value: "http://hl7.org/fhir/us/carin-bb/CodeSystem/C4BBIdentifierType"

              identifier.type.coding.code1..1 Fixed Value: "npi"

              identifier.type.system1..1 Fixed Value: "http://hl7.org/fhir/sid/us-npi"


              =============================

              identifier:tax0..* https://hl7.org/fhir/conformance-rules.html#mustSupport

              identifier.type1..1

              identifier.type.coding1..*

              identifier.type.coding.system 1..1 Fixed Value: "http://terminology.hl7.org/CodeSystem/v2-0203"

              identifier.type.coding.code1..1 Fixed Value: "TAX"

              identifier.type.system1..1 Fixed Value: "urn:oid:2.16.840.1.113883.4.4"


              =============================

              identifier:payerid0..* https://hl7.org/fhir/conformance-rules.html#mustSupport

              identifier.type1..1

              identifier.type.coding1..*

              identifier.type.coding.system 1..1 Fixed Value: "http://hl7.org/fhir/us/carin-bb/CodeSystem/C4BBIdentifierType"

              identifier.type.coding.code1..1 Fixed Value: "payerid"


              =============================

              identifier:naicode0..* https://hl7.org/fhir/conformance-rules.html#mustSupport

              identifier.type1..1

              identifier.type.coding1..*

              identifier.type.coding.system 1..1 Fixed Value: "http://hl7.org/fhir/us/carin-bb/CodeSystem/C4BBIdentifierType"

              identifier.type.coding.code1..1 Fixed Value: "naiccode"

              identifier.type.coding.system 1..1 Fixed Value: "urn:oid:2.16.840.1.113883.6.300"'
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          address:
            description: 'http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Organization-definitions.html#Organization.address


              address0..* https://hl7.org/fhir/conformance-rules.html#mustSupport


              address.line0..4 https://hl7.org/fhir/conformance-rules.html#mustSupport

              address.city0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              address.state0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              address.postalCode 0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              address.country0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport'
            type: array
            items:
              $ref: '#/components/schemas/Address'
          meta:
            description: https://hl7.org/fhir/conformance-rules.html#mustSupport
            $ref: '#/components/schemas/C4BBMeta'
          name:
            minLength: 1
            description: 'http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Organization-definitions.html#Organization.name


              name 1..1 https://hl7.org/fhir/conformance-rules.html#mustSupport'
            type: string
          active:
            description: 'http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Organization-definitions.html#Organization.active


              active1..1 https://hl7.org/fhir/conformance-rules.html#mustSupport'
            type: boolean
          telecom:
            description: 'http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Organization-definitions.html#Organization.telecom


              telecom0..* https://hl7.org/fhir/conformance-rules.html#mustSupport'
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
      description: http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Organization.html
    USCoreOrganization:
      allOf:
      - $ref: '#/components/schemas/Organization'
      - type: object
        required:
        - active
        - name
        properties:
          identifier:
            description: "http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport\n\nSlice: Unordered,\
              \ Open by pattern:$this\n\nElements under Identifier for USCoreOrganization and their Cardinality\
              \ and Type:\n system 0..1 uri\n valus0..1 string\n\nIf identifier type is NPI, it will be defined\
              \ as USCoreIdentifierNPI"
            type: array
            items:
              $ref: '#/components/schemas/USCoreIdentifier'
          address:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Elements under address and their Cardinality and Type:

              .... city0..1 string

              .... line0..4string

              .... postalCode 0..1 stringUS Zip Codes

              .... state0..1 stringBinding: USPS Two Letter Alphabetic Codes (extensible), https://hl7.org/fhir/us/core/STU3.1/ValueSet-us-core-usps-state.html'
            type: array
            items:
              $ref: '#/components/schemas/Address'
          name:
            description: http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport
            type: string
          active:
            description: http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport
            type: boolean
          telecom:
            description: http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
      description: "Organization 3.1.1\n\n#Summary of the Mandatory Requirements\n 1. A boolean in Organization.active\n\
        \ 2. A string in Organization.name\n#Summary of the Must Support Requirements\n 1. One or more Identifiers\
        \ in Organization.identifier\n 2. A Identifier in Organization.identifier\n-which should have a fixed Organization.identifier.system\
        \ = https://sources.aetna.com/organization/identifier/tin/104.\n-which should have a fixed Organization.identifier.system=\
        \ https://sources.aetna.com/organization/identifier/us-npi/30011\n\n 3. One or more ContactPoints in Organization.telecom\
        \ with the following constraints: The telecom of an organization can never be of use 'home'\n 4. One or\
        \ more Addresses in Organization.address with the following constraints: An address of an organization can\
        \ never be of use 'home'\n- which should have one or more string values in Organization.address.line\n-\
        \ which should have a string value in Organization.address.city\n- which should have a string value in Organization.address.state\
        \ with an extensible binding to USPS Two Letter Alphabetic Codes\n- which should have a string value in\
        \ Organization.address.postalCode\n- which should have a string value in Organization.address.country\n\
        #Summary of Constraints\n 1. The organization SHALL at least have a name or an identifier, and possibly\
        \ more than one\n 2. The telecom of an organization can never be of use 'home'\n 3. An address of an organization\
        \ can never be of use 'home'"
    Organization_Contact:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          address:
            description: Visiting or postal addresses for the contact.
            $ref: '#/components/schemas/Address'
          purpose:
            description: Indicates a purpose for which the contact can be reached.
            $ref: '#/components/schemas/CodeableConcept'
          name:
            description: A name associated with the contact.
            $ref: '#/components/schemas/HumanName'
          telecom:
            description: A contact detail (e.g. a telephone number or an email address) by which the party may be
              contacted.
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
    Patient_Contact:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          period:
            description: The period during which this contact person or organization is valid to be contacted relating
              to this patient.
            $ref: '#/components/schemas/Period'
          address:
            description: Address for the contact person.
            $ref: '#/components/schemas/Address'
          gender:
            description: Administrative Gender - the gender that the contact person is considered to have for administration
              and record keeping purposes.
            type: string
            enum:
            - male
            - female
            - other
            - unknown
          organization:
            description: Organization on behalf of which the contact is acting or for which the contact is working.
            $ref: '#/components/schemas/Reference'
          name:
            description: A name associated with the contact person.
            $ref: '#/components/schemas/HumanName'
          telecom:
            description: A contact detail for the person, e.g. a telephone number or an email address.
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
          relationship:
            description: The nature of the relationship between the patient and the contact person.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
    USCorePatientRaceOMBCategoryExt:
      allOf:
      - $ref: '#/components/schemas/USCorePatientRaceExt'
      - type: object
        required:
