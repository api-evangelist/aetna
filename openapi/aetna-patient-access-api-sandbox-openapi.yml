    Patient:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        properties:
          identifier:
            description: An identifier for this patient.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          address:
            description: An address for the individual.
            type: array
            items:
              $ref: '#/components/schemas/Address'
          gender:
            description: Administrative Gender - the gender that the patient is considered to have for administration
              and record keeping purposes.
            type: string
            enum:
            - male
            - female
            - other
            - unknown
          multipleBirthBoolean:
            description: Indicates whether the patient is part of a multiple (boolean) or indicates the actual birth
              order (integer).
            type: boolean
          link:
            description: Link to another patient resource that concerns the same actual patient.
            type: array
            items:
              $ref: '#/components/schemas/Patient_Link'
          active:
            description: 'Whether this patient record is in active use.

              Many systems use this property to mark as non-current patients, such as those that have not been seen
              for a period of time based on an organization''s business rules.


              It is often used to filter patient lists to exclude inactive patients


              Deceased patients may also be marked as inactive for the same reasons, but may be active for some
              time after death.'
            type: boolean
          photo:
            description: Image of the patient.
            type: array
            items:
              $ref: '#/components/schemas/Attachment'
          birthDate:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1]))?)?
            description: The date of birth for the individual.
            type: string
          deceasedBoolean:
            description: Indicates if the individual is deceased or not.
            type: boolean
          managingOrganization:
            description: Organization that is the custodian of the patient record.
            $ref: '#/components/schemas/Reference'
          multipleBirthInteger:
            format: int32
            description: Indicates whether the patient is part of a multiple (boolean) or indicates the actual birth
              order (integer).
            type: integer
          deceasedDateTime:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
            description: Indicates if the individual is deceased or not.
            type: string
          contact:
            description: A contact party (e.g. guardian, partner, friend) for the patient.
            type: array
            items:
              $ref: '#/components/schemas/Patient_Contact'
          generalPractitioner:
            description: Patient's nominated care provider.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          name:
            description: A name associated with the individual.
            type: array
            items:
              $ref: '#/components/schemas/HumanName'
          telecom:
            description: A contact detail (e.g. a telephone number or an email address) by which the individual
              may be contacted.
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
          communication:
            description: A language which may be used to communicate with the patient about his or her health.
            type: array
            items:
              $ref: '#/components/schemas/Patient_Communication'
          maritalStatus:
            description: This field contains a patient's most recent marital (civil) status.
            $ref: '#/components/schemas/CodeableConcept'
    USCorePatientEthnicityTextExt:
      allOf:
      - $ref: '#/components/schemas/USCorePatientEthnicityExt'
      - type: object
        required:
        - url
