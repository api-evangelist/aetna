          upperLimit:
            description: The upper limit of detection of the measured points. This is needed if any of the data
              points have the value "U" (higher than detection limit).
            type: number
          lowerLimit:
            description: The lower limit of detection of the measured points. This is needed if any of the data
              points have the value "L" (lower than detection limit).
