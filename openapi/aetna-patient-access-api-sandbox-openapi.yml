              identifier.system1..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              identifier.value1..1 https://hl7.org/fhir/conformance-rules.html#mustSupport'
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          deceasedBoolean:
            description: deceasedBoolean0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport
