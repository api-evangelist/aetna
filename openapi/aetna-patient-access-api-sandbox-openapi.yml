          address:
            description: 'http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Patient-definitions.html#Patient.address


              address0..* https://hl7.org/fhir/conformance-rules.html#mustSupport


              address.line0..* https://hl7.org/fhir/conformance-rules.html#mustSupport

              address.city0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              address.district0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              address.state0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              address.postalCode0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              address.country0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              address.period0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport'
            type: array
            items:
              $ref: '#/components/schemas/Address'
          gender:
            minLength: 1
            description: 'http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Patient-definitions.html#Patient.gender


              gender 1..1 https://hl7.org/fhir/conformance-rules.html#mustSupport'
            type: string
            enum:
            - male
            - female
            - other
            - unknown
          meta:
            description: 'CARIN v1.0.0 Extension to base FHIR


              http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Patient.html

              https://hl7.org/fhir/conformance-rules.html#mustSupport'
            $ref: '#/components/schemas/C4BBMeta'
          deceasedDateTime:
            description: deceasedDateTime 0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport
            type: string
          name:
            minItems: 1
            description: 'CARIN v1.0.0 Extension to base FHIR

              http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Patient.html


              name1..* https://hl7.org/fhir/conformance-rules.html#mustSupport


              name.family 0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              name.given 0..* https://hl7.org/fhir/conformance-rules.html#mustSupport'
            type: array
            items:
              $ref: '#/components/schemas/HumanName'
          telecom:
            description: 'http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Patient-definitions.html#Patient.telecom


              telecom0..* https://hl7.org/fhir/conformance-rules.html#mustSupport

              telecom.system1..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              telecom.value1..1 https://hl7.org/fhir/conformance-rules.html#mustSupport

              telecom.use0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport'
            $ref: '#/components/schemas/ContactPoint'
          communication:
            description: 'http://hl7.org/fhir/us/carin-bb/StructureDefinition-C4BB-Patient-definitions.html#Patient.communication


              commnication0..*https://hl7.org/fhir/conformance-rules.html#mustSupport


              communication.language 1..1 https://hl7.org/fhir/conformance-rules.html#mustSupport'
            type: array
            items:
              $ref: '#/components/schemas/Patient_Communication'
          birthDate:
            description: birthDate 0..1 https://hl7.org/fhir/conformance-rules.html#mustSupport
            type: string
      description: CARIN v1.0.0 Extension to USCorePatient 3.1.1
    PractitionerRole_AvailableTime:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          allDay:
            description: Is this always available? (hence times are irrelevant) e.g. 24 hour service.
            type: boolean
          availableEndTime:
            pattern: ([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?
            description: 'The closing time of day. Note: If the AllDay flag is set, then this time is ignored.'
            type: string
          daysOfWeek:
            description: Indicates which days of the week are available between the start and end Times.
            type: array
            items:
              type: string
          availableStartTime:
            pattern: ([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?
            description: 'The opening time of day. Note: If the AllDay flag is set, then this time is ignored.'
            type: string
    USCorePractitionerRole:
      allOf:
      - $ref: '#/components/schemas/PractitionerRole'
      - type: object
        required:
        - organization
        - practitioner
        properties:
          specialty:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=0..* Type=CodeableConceptBinding: US Core Provider Speciality (NUCC) (extensible)'
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          endpoint:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=0..* Type=Reference(Endpoint)'
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          code:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=0..* Type=CodeableConceptBinding: US Core Provider Role (NUCC) (extensible)'
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          practitioner:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=1..1 Type=Reference(US Core Practitioner Profile)'
            $ref: '#/components/schemas/Reference'
          organization:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=1..1 Type=Reference(US Core Organization Profile)'
            $ref: '#/components/schemas/Reference'
          location:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=0..* Type=Reference(Location)'
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          telecom:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              telecom Cardinality=0..* Type=ContactPoint

              |--system Cardinality=1..1 ype=code

              |--value Cardinality=1..1 ype=string'
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
      description: "http://hl7.org/fhir/us/core/StructureDefinition/us-core-practitionerrole\n\n##Summary of the\
        \ Mandatory Requirements\n1. A Practitioner Reference in PractitionerRole.practitioner\n2. A Organization\
        \ Reference in PractitionerRole.organization\n\n##Summary of the Must Support Requirements\n1. One or more\
        \ CodeableConcepts in PractitionerRole.code with an extensible binding to US Core Provider Role (NUCC)\n\
        2. One or more CodeableConcepts in PractitionerRole.specialty with an extensible binding to US Core Provider\
        \ Speciality (NUCC)\n3. One or more Location References in PractitionerRole.location\n4. One or more ContactPoints\
        \ in PractitionerRole.telecom\n - which must have a code value in PractitionerRole.telecom.system with a\
        \ required binding to ContactPointSystem\n - which must have a string value in PractitionerRole.telecom.value"
    PractitionerRole:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        properties:
          identifier:
            description: Business Identifiers that are specific to a role/location.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          period:
            description: The period during which the person is authorized to act as a practitioner in these role(s)
              for the organization.
            $ref: '#/components/schemas/Period'
          specialty:
            description: Specific specialty of the practitioner.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          code:
            description: Roles which this practitioner is authorized to perform for the organization.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          practitioner:
            description: Practitioner that is able to provide the defined services for the organization.
            $ref: '#/components/schemas/Reference'
          active:
            description: Whether this practitioner role record is in active use.
            type: boolean
          notAvailable:
            description: The practitioner is not available or performing this role during this period of time due
              to the provided reason.
            type: array
            items:
              $ref: '#/components/schemas/PractitionerRole_NotAvailable'
          availableTime:
            description: A collection of times the practitioner is available or performing this role at the location
              and/or healthcareservice.
            type: array
            items:
              $ref: '#/components/schemas/PractitionerRole_AvailableTime'
          endpoint:
            description: Technical endpoints providing access to services operated for the practitioner with this
              role.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          healthcareService:
            description: The list of healthcare services that this worker provides for this role's Organization/Location(s).
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          organization:
            description: The organization where the Practitioner performs the roles associated.
            $ref: '#/components/schemas/Reference'
          location:
            description: The location(s) at which this practitioner provides care.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          telecom:
            description: Contact details that are specific to the role/location/service.
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
          availabilityExceptions:
            pattern: '[ \r\n\t\S]+'
            description: A description of site availability exceptions, e.g. public holiday availability. Succinctly
              describing all possible exceptions to normal site availability as details in the available Times and
              not available Times.
            type: string
    PractitionerRole_NotAvailable:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - description
        properties:
          description:
            pattern: '[ \r\n\t\S]+'
            description: The reason that can be presented to the user as to why this time is not available.
            type: string
          during:
            description: Service is not available (seasonally or for a public holiday) from this date.
            $ref: '#/components/schemas/Period'
    USCorePractitioner:
      allOf:
      - $ref: '#/components/schemas/Practitioner'
      - type: object
        required:
        - identifier
        - name
        properties:
          identifier:
            minItems: 1
            description: "http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#must-support\n\nSlice: Unordered,\
              \ Open by pattern:$this\n\nElements under Identifier for USCorePractitioner and their Cardinality\
              \ and Type:\n system 1..1 uri\n value1..1 string\n\nIf identifier type is NPI, it will be defined\
              \ as USCoreIdentifierNPI definition"
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          name:
            minItems: 1
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#must-support


              Elements under name and their Cardinality and Type:

              .... family1..1string'
            type: array
            items:
              $ref: '#/components/schemas/HumanName'
      description: "Practitioner\n\n#Summary of the Mandatory Requirements\n 1. One or more Identifiers in Practitioner.identifier\n\
        - which must have an uri value in Practitioner.identifier.system\n- which must have a string value in Practitioner.identifier.value\n\
        \ 2. One or more HumanNames in Practitioner.name\n- which must have a string value in Practitioner.name.family\n\
        \n#Summary of the Must Support Requirements\n 1. A Identifier in Practitioner.identifier\n- which must have\
        \ a fixed Practitioner.identifier.system = https://sources.aetna.com/practitioner/identifier/pin/94"
    Practitioner:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        required:
        - active
        - communication
        - gender
        - identifier
        - name
        properties:
          identifier:
            description: An identifier that applies to this person in this role.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          gender:
            description: Administrative Gender - the gender that the person is considered to have for administration
              and record keeping purposes.
            type: string
            enum:
            - male
            - female
            - other
            - unknown
          name:
            description: The name(s) associated with the practitioner.
            type: array
            items:
              $ref: '#/components/schemas/HumanName'
          active:
            description: Whether this practitioner's record is in active use.
            type: boolean
          communication:
            description: A language the practitioner can use in patient communication.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
    Procedure_FocalDevice:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - manipulated
        properties:
          action:
            description: The kind of change that happened to the device during the procedure.
            $ref: '#/components/schemas/CodeableConcept'
          manipulated:
            description: The device that was manipulated (changed) during the procedure.
            $ref: '#/components/schemas/Reference'
    Procedure:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        required:
        - status
        - subject
        properties:
          partOf:
            description: A larger event of which this particular procedure is a component or step.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          note:
            description: Any other notes and comments about the procedure.
            type: array
            items:
              $ref: '#/components/schemas/Annotation'
          complication:
            description: Any complications that occurred during the procedure, or in the immediate post-performance
              period. These are generally tracked separately from the notes, which will typically describe the procedure
              itself rather than any 'post procedure' issues.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          code:
            description: The specific procedure that is performed. Use text if the exact nature of the procedure
              cannot be coded (e.g. "Laparoscopic Appendectomy").
            $ref: '#/components/schemas/CodeableConcept'
          subject:
            description: The person, animal or group on which the procedure was performed.
            $ref: '#/components/schemas/Reference'
          reasonReference:
            description: The justification of why the procedure was performed.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          performedRange:
            description: Estimated or actual date, date-time, period, or age when the procedure was performed. Allows
              a period to support complex procedures that span more than one date, and also allows for the length
              of the procedure to be captured.
            $ref: '#/components/schemas/Range'
          performedAge:
            description: Estimated or actual date, date-time, period, or age when the procedure was performed. Allows
              a period to support complex procedures that span more than one date, and also allows for the length
              of the procedure to be captured.
            $ref: '#/components/schemas/Age'
          instantiatesUri:
            description: The URL pointing to an externally maintained protocol, guideline, order set or other definition
              that is adhered to in whole or in part by this Procedure.
            type: array
            items:
              pattern: \S*
              type: string
          performedPeriod:
            description: Estimated or actual date, date-time, period, or age when the procedure was performed. Allows
              a period to support complex procedures that span more than one date, and also allows for the length
              of the procedure to be captured.
            $ref: '#/components/schemas/Period'
          performedString:
            pattern: '[ \r\n\t\S]+'
            description: Estimated or actual date, date-time, period, or age when the procedure was performed. Allows
              a period to support complex procedures that span more than one date, and also allows for the length
              of the procedure to be captured.
            type: string
          followUp:
            description: If the procedure required specific follow up - e.g. removal of sutures. The follow up may
              be represented as a simple note or could potentially be more complex, in which case the CarePlan resource
              can be used.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          statusReason:
            description: Captures the reason for the current state of the procedure.
            $ref: '#/components/schemas/CodeableConcept'
          usedCode:
            description: Identifies coded items that were used as part of the procedure.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          reasonCode:
            description: The coded reason why the procedure was performed. This may be a coded entity of some type,
              or may simply be present as text.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          performedDateTime:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
            description: Estimated or actual date, date-time, period, or age when the procedure was performed. Allows
              a period to support complex procedures that span more than one date, and also allows for the length
              of the procedure to be captured.
            type: string
          basedOn:
            description: A reference to a resource that contains details of the request for this procedure.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          outcome:
            description: The outcome of the procedure - did it resolve the reasons for the procedure being performed?
            $ref: '#/components/schemas/CodeableConcept'
          identifier:
            description: Business identifiers assigned to this procedure by the performer or other systems which
              remain constant as the resource is updated and is propagated from server to server.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          recorder:
            description: Individual who recorded the record and takes responsibility for its content.
            $ref: '#/components/schemas/Reference'
          performer:
            description: Limited to "real" people rather than equipment.
            type: array
            items:
              $ref: '#/components/schemas/Procedure_Performer'
          complicationDetail:
            description: Any complications that occurred during the procedure, or in the immediate post-performance
              period.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          usedReference:
            description: Identifies medications, devices and any other substance used as part of the procedure.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          focalDevice:
            description: A device that is implanted, removed or otherwise manipulated (calibration, battery replacement,
              fitting a prosthesis, attaching a wound-vac, etc.) as a focal portion of the Procedure.
            type: array
            items:
              $ref: '#/components/schemas/Procedure_FocalDevice'
          encounter:
            description: The Encounter during which this Procedure was created or performed or to which the creation
              of this record is tightly associated.
            $ref: '#/components/schemas/Reference'
          instantiatesCanonical:
            description: The URL pointing to a FHIR-defined protocol, guideline, order set or other definition that
              is adhered to in whole or in part by this Procedure.
            type: array
            items:
              pattern: \S*
              type: string
          bodySite:
            description: Detailed and structured anatomical location information. Multiple locations are allowed
              - e.g. multiple punch biopsies of a lesion.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          asserter:
            description: Individual who is making the procedure statement.
            $ref: '#/components/schemas/Reference'
          report:
            description: This could be a histology result, pathology report, surgical report, etc.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          location:
            description: The location where the procedure actually happened. E.g. a newborn at home, a tracheostomy
              at a restaurant.
            $ref: '#/components/schemas/Reference'
          category:
            description: A code that classifies the procedure for searching, sorting and display purposes (e.g.
              "Surgical Procedure").
            $ref: '#/components/schemas/CodeableConcept'
          status:
            description: A code specifying the state of the procedure. Generally, this will be the in-progress or
              completed state.
            type: string
            enum:
            - preparation
            - in-progress
            - not-done
            - on-hold
            - stopped
            - completed
            - entered-in-error
            - unknown
    Procedure_Performer:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - actor
        properties:
          actor:
            description: The practitioner who was involved in the procedure.
            $ref: '#/components/schemas/Reference'
          function:
            description: Distinguishes the type of involvement of the performer in the procedure. For example, surgeon,
              anaesthetist, endoscopist.
            $ref: '#/components/schemas/CodeableConcept'
          onBehalfOf:
            description: The organization the device or practitioner was acting on behalf of.
            $ref: '#/components/schemas/Reference'
    USCoreProcedure:
      allOf:
      - $ref: '#/components/schemas/Procedure'
      - type: object
        required:
        - code
        - status
        - subject
        properties:
          code:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=1..1 Type=CodeableConceptProcedure codes from SNOMED CT, CPT, or HCPCS II Binding: US
              Core Procedure Codes (extensible)'
            $ref: '#/components/schemas/CodeableConcept'
          subject:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=1..1 Type=Reference(US Core Patient Profile)


              Reference USCorePatient http://hl7.org/fhir/us/core/STU3.1/StructureDefinition-us-core-patient.html'
            $ref: '#/components/schemas/Reference'
          performanceDateTime:
            format: date-time
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              performed Cardinality=1..1

              |--performedDateTimeType=dateTime

              |--performedPeriodType=Period'
            type: string
          performancePeriod:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              performed Cardinality=1..1

              |--performedDateTimeType=dateTime

              |--performedPeriodType=Period'
            $ref: '#/components/schemas/Period'
          status:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality= 1..1 Type=code Binding: EventStatus (required)'
            type: string
            enum:
            - preparation
            - in-progress
            - not-done
            - on-hold
            - stopped
            - completed
            - entered-in-error
            - unknown
      description: 'http://hl7.org/fhir/us/core/StructureDefinition/us-core-procedure


        Summary of the Mandatory Requirements

        1. A code in Procedure.status with a required binding to EventStatus

        2. A CodeableConcept in Procedure.code with an extensible binding to US Core Procedure Codes

        3. A Patient Reference in Procedure.subject

        4. A dateTime in Procedure.performed'
