            type: string
          site:
            description: Body site where vaccine was administered.
            $ref: '#/components/schemas/CodeableConcept'
          route:
            description: The path by which the vaccine product is taken into the body.
            $ref: '#/components/schemas/CodeableConcept'
          protocolApplied:
            description: The protocol (set of recommendations) being followed by the provider who administered the
              dose.
            type: array
            items:
              $ref: '#/components/schemas/Immunization_ProtocolApplied'
          reportOrigin:
            description: The source of the data when the report of the immunization event is not based on information
              from the person who administered the vaccine.
            $ref: '#/components/schemas/CodeableConcept'
          occurrenceDateTime:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
            description: Date vaccine administered or was to be administered.
            type: string
          occurrenceString:
            pattern: '[ \r\n\t\S]+'
            description: Date vaccine administered or was to be administered.
            type: string
          location:
            description: The service delivery location where the vaccine administration occurred.
            $ref: '#/components/schemas/Reference'
          fundingSource:
            description: Indicates the source of the vaccine actually administered. This may be different than the
