            description: The date that the attachment was first created.
            type: string
    Count:
      allOf:
      - $ref: '#/components/schemas/Quantity'
      - type: object
    Timing_Repeat:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          boundsRange:
            description: Either a duration for the length of the timing schedule, a range of possible length, or
              outer bounds for start and/or end limits of the timing schedule.
            $ref: '#/components/schemas/Range'
          period:
            description: Indicates the duration of time over which repetitions are to occur; e.g. to express "3
              times per day", 3 would be the frequency and "1 day" would be the period. If periodMax is present,
              this element indicates the lower bound of the allowed range of the period length.
            type: number
          offset:
            format: int32
            description: The number of minutes from the event. If the event code does not indicate whether the minutes
              is before or after the event, then the offset is assumed to be after the event.
            type: integer
          frequencyMax:
            format: int32
            description: If present, indicates that the frequency is a range - so to repeat between [frequency]
              and [frequencyMax] times within the period or period range.
            type: integer
          countMax:
            format: int32
            description: If present, indicates that the count is a range - so to perform the action between [count]
              and [countMax] times.
            type: integer
          periodMax:
            description: If present, indicates that the period is a range from [period] to [periodMax], allowing
              expressing concepts such as "do this once every 3-5 days.
            type: number
          count:
            format: int32
            description: A total count of the desired number of repetitions across the duration of the entire timing
              specification. If countMax is present, this element indicates the lower bound of the allowed range
              of count values.
            type: integer
          periodUnit:
            description: The units of time for the period in UCUM units.
            type: string
            enum:
            - s
            - min
            - h
            - d
            - wk
            - mo
            - a
          when:
            description: An approximate time period during the day, potentially linked to an event of daily living
              that indicates when the action should occur.
            type: array
            items:
              type: string
          frequency:
            format: int32
            description: The number of times to repeat the action within the specified period. If frequencyMax is
              present, this element indicates the lower bound of the allowed range of the frequency.
            type: integer
          boundsDuration:
            description: Either a duration for the length of the timing schedule, a range of possible length, or
              outer bounds for start and/or end limits of the timing schedule.
            $ref: '#/components/schemas/Duration'
          duration:
            description: How long this thing happens for when it happens. If durationMax is present, this element
              indicates the lower bound of the allowed range of the duration.
            type: number
          durationMax:
            description: If present, indicates that the duration is a range - so to perform the action between [duration]
              and [durationMax] time length.
            type: number
          dayOfWeek:
            description: If one or more days of week is provided, then the action happens only on the specified
              day(s).
            type: array
            items:
              type: string
          boundsPeriod:
            description: Either a duration for the length of the timing schedule, a range of possible length, or
              outer bounds for start and/or end limits of the timing schedule.
            $ref: '#/components/schemas/Period'
          durationUnit:
            description: The units of time for the duration, in UCUM units.
            type: string
            enum:
            - s
            - min
            - h
            - d
            - wk
            - mo
            - a
          timeOfDay:
            description: Specified time of day for action to take place.
            type: array
            items:
              pattern: ([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?
              type: string
    ContactPoint:
      allOf:
      - $ref: '#/components/schemas/Element'
      - type: object
        properties:
          period:
            description: Time period when the contact point was/is in use.
            $ref: '#/components/schemas/Period'
          system:
            description: Telecommunications form for contact point - what communications system is required to make
              use of the contact.
            type: string
            enum:
            - phone
            - fax
            - email
            - pager
            - url
            - sms
            - other
          use:
            description: Identifies the purpose for the contact point.
            type: string
            enum:
            - home
            - work
            - temp
            - old
            - mobile
          rank:
            format: int32
            description: Specifies a preferred order in which to use a set of contacts. ContactPoints with lower
              rank values are more preferred than those with higher rank values.
            type: integer
          value:
            pattern: '[ \r\n\t\S]+'
            description: The actual contact point details, in a form that is meaningful to the designated communication
              system (i.e. phone number or email address).
            type: string
    HumanName:
      allOf:
      - $ref: '#/components/schemas/Element'
      - type: object
        properties:
          given:
            description: Given name.
            type: array
            items:
              pattern: '[ \r\n\t\S]+'
              type: string
          period:
            description: Indicates the period of time when this name was valid for the named person.
            $ref: '#/components/schemas/Period'
          use:
            description: Identifies the purpose for this name.
            type: string
            enum:
            - usual
            - official
            - temp
            - nickname
            - anonymous
            - old
            - maiden
          prefix:
            description: Part of the name that is acquired as a title due to academic, legal, employment or nobility
              status, etc. and that appears at the start of the name.
            type: array
            items:
              pattern: '[ \r\n\t\S]+'
              type: string
          text:
            pattern: '[ \r\n\t\S]+'
            description: Specifies the entire name as it should be displayed e.g. on an application UI. This may
              be provided instead of or as well as the specific parts.
            type: string
          family:
            pattern: '[ \r\n\t\S]+'
            description: The part of a name that links to the genealogy. In some cultures (e.g. Eritrea) the family
              name of a son is the first name of his father.
            type: string
          suffix:
            description: Part of the name that is acquired as a title due to academic, legal, employment or nobility
              status, etc. and that appears at the end of the name.
            type: array
            items:
              pattern: '[ \r\n\t\S]+'
              type: string
    Money:
