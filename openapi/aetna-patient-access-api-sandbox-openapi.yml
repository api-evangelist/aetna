            reference ranges are interpreted as an "OR".In other words, to represent two distinct target populations,
            two `referenceRange` elements would be used.
          type: array
          items:
            $ref: '#/components/schemas/Observation_ReferenceRange'
        component:
          description: Some observations have multiple component observations. These component observations are
            expressed as separate code value pairs that share the same attributes. Examples include systolic and
            diastolic component observations for blood pressure measurement and multiple component observations
            for genetics observations.
          type: array
          items:
            $ref: '#/components/schemas/Observation_Component'
        contained:
          description: These resources do not have an independent existence apart from the resource that contains
            them - they cannot be identified independently, and nor can they have their own independent transaction
            scope.
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        valueString:
          pattern: '[ \r\n\t\S]+'
          description: The information determined as a result of making the observation, if the information has
            a simple value.
          type: string
        effectiveDateTime:
          pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
          description: The time or time-period the observed value is asserted as being true. For biological subjects
            - e.g. human patients - this is usually called the "physiologically relevant time". This is usually
            either the time of the procedure or of specimen collection, but very often the source of the date/time
            is not known, only the date/time itself.
          type: string
        interpretation:
          description: A categorical assessment of an observation value. For example, high, low, normal.
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        valueSampledData:
          description: The information determined as a result of making the observation, if the information has
            a simple value.
          $ref: '#/components/schemas/SampledData'
        valuePeriod:
          description: The information determined as a result of making the observation, if the information has
            a simple value.
          $ref: '#/components/schemas/Period'
        meta:
          description: The metadata about the resource. This is content that is maintained by the infrastructure.
            Changes to the content might not always be associated with version changes to the resource.
          $ref: '#/components/schemas/Meta'
        implicitRules:
          pattern: \S*
          description: A reference to a set of rules that were followed when the resource was constructed, and which
            must be understood when processing the content. Often, this is a reference to an implementation guide
            that defines the special rules along with other profiles etc.
          type: string
        category:
          description: A code that classifies the general type of observation being made.
          type: array
          items:
            $ref: '#/components/schemas/CodeableConcept'
        device:
          description: The device used to generate the observation data.
          $ref: '#/components/schemas/Reference'
        effectiveInstant:
          pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))
          description: The time or time-period the observed value is asserted as being true. For biological subjects
