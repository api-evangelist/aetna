          reaction:
            description: Categorical data indicating that an adverse event is associated in time to an immunization.
            type: array
            items:
              $ref: '#/components/schemas/Immunization_Reaction'
          subpotentReason:
            description: Reason why a dose is considered to be subpotent.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          encounter:
            description: The visit or admission or other contact between patient and health care provider the immunization
              was performed as part of.
            $ref: '#/components/schemas/Reference'
          lotNumber:
            pattern: '[ \r\n\t\S]+'
            description: Lot number of the vaccine product.
            type: string
          recorded:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
            description: The date the occurrence of the immunization was first captured in the record - potentially
