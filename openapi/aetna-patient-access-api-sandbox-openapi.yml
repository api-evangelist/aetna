            type: array
            items:
              $ref: '#/components/schemas/Reference'
          context:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Following elements are under context and their multiplicity are:

              encounter 0..1 type = Reference(US Core Encounter Profile)

              period 0..1, type = Period'
            $ref: '#/components/schemas/DocumentReference_Context'
          type:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=1..1 Type=CodeableConcept Binding: US Core DocumentReference Type (required) Min Binding:
              US Core Clinical Note Type'
            $ref: '#/components/schemas/CodeableConcept'
          category:
            minItems: 1
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=1..* Type=CodeableConceptBinding: US Core DocumentReference Category (extensible)'
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          content:
            description: "http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport\n\nFollowing elements\
              \ under content and their multiplicity are:\nattachment 1..1 type = Attachment, us-core-6: DocumentReference.content.attachment.url\
              \ or DocumentReference.content.attachment.data or both SHALL be present.\n |--contentType 1..1 type\
              \ = code\n |--url 0..1 type = url\nformat 0..1, type = Coding, Binding: DocumentReferenceFormatCodeSet\
              \ (extensible)"
            $ref: '#/components/schemas/DocumentReference_Content'
