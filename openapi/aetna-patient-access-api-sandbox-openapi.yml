        - other
        - type
        properties:
          other:
            description: The other patient resource that the link refers to.
            $ref: '#/components/schemas/Reference'
          type:
            description: The type of link between this patient resource and another patient resource.
            type: string
            enum:
            - replaced-by
            - replaces
            - refer
            - seealso
    USCorePatientRaceTextExt:
      allOf:
      - $ref: '#/components/schemas/USCorePatientRaceExt'
      - type: object
        required:
        - url
        - valueString
        properties:
          valueString:
            type: string
          url:
            default: text
            type: string
    USCorePatient:
      allOf:
      - $ref: '#/components/schemas/Patient'
      - type: object
        required:
        - gender
        - identifier
        - name
        properties:
          identifier:
            minItems: 1
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Elements under identifier and their Cardinality and Type:

              .... system0..1string

              .... value0..*string'
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          extension:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Elements under communication and their Cardinality and Type:

              .... language1..1CodeableConcept Binding: Language codes with language and optionally a region modifier
              (extensible), https://hl7.org/fhir/us/core/STU3.1/ValueSet-simple-language.html'
            type: array
            items:
              $ref: '#/components/schemas/USCorePatientExt'
          address:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Elements under address and their Cardinality and Type:

              .... city0..1 string

              .... line0..*string

              .... postalCode 0..1 stringUS Zip Codes

              .... state0..1 stringBinding: USPS Two Letter Alphabetic Codes (extensible), https://hl7.org/fhir/us/core/STU3.1/ValueSet-us-core-usps-state.html

              .... period0..1 Period'
            type: array
            items:
              $ref: '#/components/schemas/Address'
          gender:
            description: 'Binding: AdministrativeGender (required), http://hl7.org/fhir/R4/valueset-administrative-gender.html


              http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport'
            type: string
            enum:
            - male
            - female
            - other
            - unknown
          name:
            minItems: 1
            description: 'us-core-8: Patient.name.given or Patient.name.family or both SHALL be present


              http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Elements under name and their Cardinality and Type:

              .... family0..1string

              .... given0..*string'
            type: array
            items:
              $ref: '#/components/schemas/HumanName'
          telecom:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Elements under telecom and their Cardinality and Type:

              .... system1..1codeBinding: ContactPointSystem (required), http://hl7.org/fhir/R4/valueset-contact-point-system.html

              .... value1..1string

              .... use0..1codeBinding: ContactPointUse (required), http://hl7.org/fhir/R4/valueset-contact-point-use.html'
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
          communication:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Elements under communication and their Cardinality and Type:

              .... language1..1CodeableConcept Binding: Language codes with language and optionally a region modifier
              (extensible), https://hl7.org/fhir/us/core/STU3.1/ValueSet-simple-language.html'
            type: array
            items:
              $ref: '#/components/schemas/Patient_Communication'
          birthDate:
            format: date
            description: http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport
            type: string
      description: "Patient\n\n#Summary of the Mandatory Requirements\n 1. One or more Identifiers in Patient.identifier\n\
        - which must have an uri value in Patient.identifier.system\n- which must have a string value in Patient.identifier.value\n\
        \ 2. One or more HumanNames in Patient.name with the following constraints: Patient.name.given or Patient.name.family\
        \ or both SHALL be present\n- which should have a string value in Patient.name.family\n- which should have\
        \ one or more string values in Patient.name.given\n 3. A code in Patient.gender with a required binding\
        \ to AdministrativeGender\n\n#Summary of the Must Support Requirements\n 1. A Race Extension in Patient.extension\n\
        \ 2. An Ethnicity Extension in Patient.extension\n 3. A Birthsex Extension in Patient.extension with a required\
        \ binding to Birth Sex\n 4. One or more ContactPoints in Patient.telecom\n- which must have a code value\
        \ in Patient.telecom.system with a required binding to ContactPointSystem\n- which must have a string value\
        \ in Patient.telecom.value\n- which should have a code value in Patient.telecom.use with a required binding\
        \ to ContactPointUse\n 5. A date in Patient.birthDate\n 6. One or more Addresses in Patient.address\n- which\
        \ should have one or more string values in Patient.address.line\n- which should have a string value in Patient.address.city\n\
        - which should have a string value in Patient.address.state with an extensible binding to USPS Two Letter\
        \ Alphabetic Codes\n- which should have a string value in Patient.address.postalCode\n- which should have\
        \ a Period value in Patient.address.period\n 7. One or more Communications in Patient.communication\n- which\
        \ must have a CodeableConcept value in Patient.communication.language with an extensible binding to Language\
        \ codes with language and optionally a region modifier\n\n#Summary of Constraints\n 1. Patient.name.given\
        \ or Patient.name.family or both SHALL be present\n\n#### US Core Extension will not be supported, so the\
        \ us-core-race, us-core-ethnicity and us-core-birthsex attributes have not been included in the class (\n\
        us-core-raceA Race Extension in Patient.extension\nus-core-ethnicityAn Ethnicity Extension in Patient.extension\n\
        us-core-birthsexA Birthsex Extension in Patient.extension with a required binding to Birth Sex )"
    USCorePatientEthnicityOMBCategoryExt:
      allOf:
      - $ref: '#/components/schemas/USCorePatientEthnicityExt'
      - type: object
        required:
        - url
        - valueCoding
