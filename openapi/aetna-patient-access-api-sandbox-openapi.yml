            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          partOf:
            description: Another Location of which this Location is physically a part of.
            $ref: '#/components/schemas/Reference'
          address:
            description: Physical location.
            $ref: '#/components/schemas/Address'
          physicalType:
            description: Physical form of the location, e.g. building, room, vehicle, road.
            $ref: '#/components/schemas/CodeableConcept'
          description:
            pattern: '[ \r\n\t\S]+'
            description: Description of the Location, which helps in finding or referencing the place.
            type: string
          hoursOfOperation:
            description: What days/times during a week is this location usually open.
            type: array
            items:
              $ref: '#/components/schemas/Location_HoursOfOperation'
          type:
            description: Indicates the type of function performed at the location.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          mode:
            description: Indicates whether a resource instance represents a specific location or a class of locations.
            type: string
            enum:
            - instance
            - kind
          endpoint:
            description: Technical endpoints providing access to services operated for the location.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          managingOrganization:
            description: The organization responsible for the provisioning and upkeep of the location.
            $ref: '#/components/schemas/Reference'
          name:
            pattern: '[ \r\n\t\S]+'
            description: Name of the location as used by humans. Does not need to be unique.
            type: string
          alias:
            description: A list of alternate names that the location is known as, or was known as, in the past.
            type: array
            items:
              pattern: '[ \r\n\t\S]+'
              type: string
          telecom:
            description: The contact details of communication devices available at the location. This can include
              phone numbers, fax numbers, mobile numbers, email addresses and web sites.
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
          position:
            description: The absolute geographic location of the Location, expressed using the WGS84 datum (This
              is the same co-ordinate system used in KML).
            $ref: '#/components/schemas/Location_Position'
          availabilityExceptions:
            pattern: '[ \r\n\t\S]+'
