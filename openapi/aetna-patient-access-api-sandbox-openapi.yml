              does not include the original order dispense. This means that if an order indicates dispense 30 tablets
              plus "3 repeats", then the order can be dispensed a total of 4 times and the patient can receive a
              total of 120 tablets. A prescriber may explicitly say that zero refills are permitted after the initial
              dispense.'
