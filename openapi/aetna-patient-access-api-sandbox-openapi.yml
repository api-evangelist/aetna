              Binding: DocumentReferenceStatus (required)'
            type: string
            enum:
            - current
            - superseded
            - entered-in-error
      description: "http://hl7.org/fhir/us/core/StructureDefinition/us-core-documentreference\n\n##Summary of the\
        \ Mandatory Requirements\n1. A code in DocumentReference.status with a required binding to DocumentReferenceStatus\n\
        2. A CodeableConcept in DocumentReference.type with a required binding to US Core DocumentReference Type\n\
        3. One or more CodeableConcepts in DocumentReference.category with an extensible binding to US Core DocumentReference\
        \ Category\n4. A Patient Reference in DocumentReference.subject\n5. A Content in DocumentReference.content\n\
        \ - which must have a Attachment value in DocumentReference.content.attachment\n- which must have a code\
        \ value in DocumentReference.content.attachment.contentType with a required binding to MimeType\n- which\
        \ should have a base64Binary value in DocumentReference.content.attachment.data\n- which should have an\
        \ url value in DocumentReference.content.attachment.url\n - which should have a Coding value in DocumentReference.content.format\
        \ with an extensible binding to DocumentReference Format Code Set\n\n##Summary of the Must Support Requirements\n\
        1. One or more Identifiers in DocumentReference.identifier\n2. An instant in DocumentReference.date\n3.\
        \ One or more Author References in DocumentReference.author\n4. A Custodian Reference in DocumentReference.custodian\n\
        5. A Context in DocumentReference.context\n - which should have a Encounter Reference value in DocumentReference.context.encounter\n\
        \ - which should have a Period value in DocumentReference.context.period\n\n##Summary of Constraints\n1.\
        \ DocumentReference.content.attachment.url or DocumentReference.content.attachment.data or both SHALL be\
        \ present."
    DocumentReference:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        required:
        - content
        - status
        properties:
          date:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))
            description: When the document reference was created.
            type: string
          identifier:
            description: Other identifiers associated with the document, including version independent identifiers.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          custodian:
            description: Identifies the organization or group who is responsible for ongoing maintenance of and
              access to the document.
            $ref: '#/components/schemas/Reference'
          subject:
            description: Who or what the document is about. The document can be about a person, (patient or healthcare
              practitioner), a device (e.g. a machine) or even a group of subjects (such as a document about a herd
              of farm animals, or a set of patients that share a common exposure).
            $ref: '#/components/schemas/Reference'
          author:
            description: Identifies who is responsible for adding the information to the document.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          securityLabel:
            description: A set of Security-Tag codes specifying the level of privacy/security of the Document. Note
              that DocumentReference.meta.security contains the security labels of the "reference" to the document,
              while DocumentReference.securityLabel contains a snapshot of the security labels on the document the
              reference refers to.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          description:
            pattern: '[ \r\n\t\S]+'
            description: Human-readable description of the source document.
            type: string
          masterIdentifier:
            description: Document identifier as assigned by the source of the document. This identifier is specific
              to this version of the document. This unique identifier may be used elsewhere to identify this version
              of the document.
            $ref: '#/components/schemas/Identifier'
          type:
            description: Specifies the particular kind of document referenced (e.g. History and Physical, Discharge
              Summary, Progress Note). This usually equates to the purpose of making the document referenced.
            $ref: '#/components/schemas/CodeableConcept'
          content:
            minItems: 1
            description: The document and format referenced. There may be multiple content element repetitions,
              each with a different format.
            type: array
            items:
              $ref: '#/components/schemas/DocumentReference_Content'
          docStatus:
            description: The status of the underlying document.
            type: string
            enum:
            - preliminary
            - final
            - amended
            - entered-in-error
          context:
            description: The clinical context in which the document was prepared.
            $ref: '#/components/schemas/DocumentReference_Context'
          category:
            description: A categorization for the type of document referenced - helps for indexing and searching.
              This may be implied by or derived from the code specified in the DocumentReference.type.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          relatesTo:
            description: Relationships that this document has with other document references that already exist.
            type: array
            items:
              $ref: '#/components/schemas/DocumentReference_RelatesTo'
          authenticator:
            description: Which person or organization authenticates that this document is valid.
            $ref: '#/components/schemas/Reference'
          status:
            description: The status of this document reference.
            type: string
            enum:
            - current
            - superseded
            - entered-in-error
    DocumentReference_RelatesTo:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - code
        - target
        properties:
          code:
            description: The type of relationship that this document has with anther document.
            type: string
            enum:
            - replaces
            - transforms
            - signs
            - appends
          target:
            description: The target document of this relationship.
            $ref: '#/components/schemas/Reference'
    DocumentReference_Context:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          period:
            description: The time period over which the service that is described by the document was provided.
            $ref: '#/components/schemas/Period'
          related:
            description: Related identifiers or resources associated with the DocumentReference.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          facilityType:
            description: The kind of facility where the patient was seen.
            $ref: '#/components/schemas/CodeableConcept'
          practiceSetting:
            description: This property may convey specifics about the practice setting where the content was created,
              often reflecting the clinical specialty.
            $ref: '#/components/schemas/CodeableConcept'
          encounter:
            description: Describes the clinical encounter or type of care that the document content is associated
              with.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          event:
            description: This list of codes represents the main clinical acts, such as a colonoscopy or an appendectomy,
              being documented. In some cases, the event is inherent in the type Code, such as a "History and Physical
              Report" in which the procedure being documented is necessarily a "History and Physical" act.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          sourcePatientInfo:
            description: The Patient Information as known when the document was published. May be a reference to
              a version specific, or contained.
            $ref: '#/components/schemas/Reference'
    DocumentReference_Content:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - attachment
        properties:
          attachment:
            description: The document or URL of the document along with critical metadata to prove content has integrity.
            $ref: '#/components/schemas/Attachment'
          format:
            description: An identifier of the document encoding, structure, and template that the document conforms
              to beyond the base format indicated in the mimeType.
            $ref: '#/components/schemas/Coding'
    Encounter_Location:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - location
        properties:
          period:
            description: Time period during which the patient was present at the location.
            $ref: '#/components/schemas/Period'
          physicalType:
            description: This will be used to specify the required levels (bed/ward/room/etc.) desired to be recorded
              to simplify either messaging or query.
            $ref: '#/components/schemas/CodeableConcept'
          location:
            description: The location where the encounter takes place.
            $ref: '#/components/schemas/Reference'
          status:
            description: The status of the participants' presence at the specified location during the period specified.
              If the participant is no longer at the location, then the period will have an end date/time.
            type: string
            enum:
            - planned
            - active
            - reserved
            - completed
    Encounter:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        required:
        - class
        - status
        properties:
          serviceType:
            description: Broad categorization of the service that is to be provided (e.g. cardiology).
            $ref: '#/components/schemas/CodeableConcept'
          identifier:
            description: Identifier(s) by which this encounter is known.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          partOf:
            description: Another Encounter of which this encounter is a part of (administratively or in time).
            $ref: '#/components/schemas/Reference'
          period:
            description: The time that the episode was in the specified status.
            $ref: '#/components/schemas/Period'
          classHistory:
            description: The class history permits the tracking of the encounters transitions without needing to
              go through the resource history. This would be used for a case where an admission starts of as an
              emergency encounter, then transitions into an inpatient scenario. Doing this and not restarting a
              new encounter ensures that any lab/diagnostic results can more easily follow the patient and not require
              re-processing and not get lost or cancelled during a kind of discharge from emergency to inpatient.
            type: array
            items:
              $ref: '#/components/schemas/Encounter_ClassHistory'
          hospitalization:
            description: Details about the admission to a healthcare service.
            $ref: '#/components/schemas/Encounter_Hospitalization'
          subject:
            description: The patient or group present at the encounter.
            $ref: '#/components/schemas/Reference'
          length:
            description: Quantity of time the encounter lasted. This excludes the time during leaves of absence.
            $ref: '#/components/schemas/Duration'
          reasonReference:
            description: Reason the encounter takes place, expressed as a code. For admissions, this can be used
              for a coded admission diagnosis.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          diagnosis:
            description: The list of diagnosis relevant to this encounter.
            type: array
            items:
              $ref: '#/components/schemas/Encounter_Diagnosis'
          appointment:
            description: The appointment that scheduled this encounter.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          type:
            description: Specific type of encounter (e.g. e-mail consultation, surgical day-care, skilled nursing,
              rehabilitation).
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          priority:
            description: Indicates the urgency of the encounter.
            $ref: '#/components/schemas/CodeableConcept'
          participant:
            description: The list of people responsible for providing the service.
            type: array
            items:
              $ref: '#/components/schemas/Encounter_Participant'
          statusHistory:
            description: The status history permits the encounter resource to contain the status history without
              needing to read through the historical versions of the resource, or even have the server store them.
            type: array
            items:
              $ref: '#/components/schemas/Encounter_StatusHistory'
          serviceProvider:
            description: The organization that is primarily responsible for this Encounter's services. This MAY
              be the same as the organization on the Patient record, however it could be different, such as if the
              actor performing the services was from an external organization (which may be billed seperately) for
              an external consultation. Refer to the example bundle showing an abbreviated set of Encounters for
              a colonoscopy.
            $ref: '#/components/schemas/Reference'
          location:
            description: List of locations where the patient has been during this encounter.
            type: array
            items:
              $ref: '#/components/schemas/Encounter_Location'
          episodeOfCare:
            description: Where a specific encounter should be classified as a part of a specific episode(s) of care
              this field should be used. This association can facilitate grouping of related encounters together
              for a specific purpose, such as government reporting, issue tracking, association via a common problem.
              The association is recorded on the encounter as these are typically created after the episode of care
              and grouped on entry rather than editing the episode of care to append another encounter to it (the
              episode of care could span years).
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          reasonCode:
            description: Reason the encounter takes place, expressed as a code. For admissions, this can be used
              for a coded admission diagnosis.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          class:
            description: Concepts representing classification of patient encounter such as ambulatory (outpatient),
              inpatient, emergency, home health or others due to local variations.
            $ref: '#/components/schemas/Coding'
          basedOn:
            description: The request this encounter satisfies (e.g. incoming referral or procedure request).
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          account:
            description: The set of accounts that may be used for billing for this Encounter.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          status:
            description: planned | arrived | triaged | in-progress | onleave | finished | cancelled +.
            type: string
            enum:
            - planned
            - arrived
            - triaged
            - in-progress
            - onleave
            - finished
            - cancelled
            - entered-in-error
            - unknown
    Encounter_Participant:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          period:
            description: The period of time that the specified participant participated in the encounter. These
              can overlap or be sub-sets of the overall encounter's period.
            $ref: '#/components/schemas/Period'
          individual:
            description: Persons involved in the encounter other than the patient.
            $ref: '#/components/schemas/Reference'
          type:
            description: Role of participant in encounter.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
    USCoreEncounter:
      allOf:
      - $ref: '#/components/schemas/Encounter'
      - type: object
        required:
        - class
        - hospitalization
        - period
        - status
        - subject
        - type
        properties:
          identifier:
            description: 'https://hl7.org/fhir/conformance-rules.html#mustSupport(S)

              ... system S 1..1 urihttp://hl7.org/fhir/R4/datatypes.html#uri

              .... value S 1..1 string http://hl7.org/fhir/R4/datatypes.html#string'
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          period:
            description: https://hl7.org/fhir/conformance-rules.html#mustSupport
            $ref: '#/components/schemas/Period'
          hospitalization:
            description: 'https://hl7.org/fhir/conformance-rules.html#mustSupport(S)

              .. dischargeDisposition S 0..1 CodeableConcept - http://hl7.org/fhir/R4/datatypes.html#CodeableConcept'
            $ref: '#/components/schemas/Encounter_Hospitalization'
          subject:
            description: 'https://hl7.org/fhir/conformance-rules.html#mustSupport

              ...Reference(US Core Patient Profile) - https://www.hl7.org/fhir/us/core/StructureDefinition-us-core-patient.html'
            $ref: '#/components/schemas/Reference'
          location:
            description: 'https://hl7.org/fhir/conformance-rules.html#mustSupport(S)

              .. location S 1..1 Reference(Location)- http://hl7.org/fhir/R4/location.html'
            type: array
            items:
              $ref: '#/components/schemas/Encounter_Location'
          reasonCode:
            description: https://hl7.org/fhir/conformance-rules.html#mustSupport
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          type:
            minItems: 1
            description: 'https://hl7.org/fhir/conformance-rules.html#mustSupport

              ..Binding US Core Encounter Type (extensible) - https://www.hl7.org/fhir/us/core/ValueSet-us-core-encounter-type.html'
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          class:
            description: https://hl7.org/fhir/conformance-rules.html#mustSupport
            $ref: '#/components/schemas/Coding'
          participant:
            description: 'https://hl7.org/fhir/conformance-rules.html#mustSupport(S)

              .... type S 0..*CodeableConcept -http://hl7.org/fhir/R4/datatypes.html#CodeableConcept

              .... period S 0..1 Period - http://hl7.org/fhir/R4/datatypes.html#Period

              .... individual S 0..1 Reference(US Core Practitioner Profile)- https://www.hl7.org/fhir/us/core/StructureDefinition-us-core-practitioner.html'
            type: array
            items:
              $ref: '#/components/schemas/Encounter_Participant'
          status:
            description: https://hl7.org/fhir/conformance-rules.html#mustSupport
            type: string
            enum:
            - planned
            - arrived
            - triaged
            - in-progress
            - onleave
            - finished
            - cancelled
            - entered-in-error
            - unknown
      description: 'Encounter


        Summary of the Mandatory Requirements

        A code in Encounter.status with a required binding to EncounterStatus

        A Coding in Encounter.class with an extensible binding to V3 Value SetActEncounterCode

        One or more CodeableConcepts in Encounter.type with an extensible binding to US Core Encounter Type

        A Patient Reference in Encounter.subject

        Summary of the Must Support Requirements

        One or more Identifiers in Encounter.identifier

        which must have an uri value in Encounter.identifier.system

        which must have a string value in Encounter.identifier.value

        One or more Participants in Encounter.participant

        which should have one or more CodeableConcept values in Encounter.participant.type with an extensible binding
        to Participant type

        which should have a Period value in Encounter.participant.period

        which should have a Individual Reference value in Encounter.participant.individual

        A Period in Encounter.period

        One or more CodeableConcepts in Encounter.reasonCode with a preferred binding to Encounter Reason Codes

        A Hospitalization in Encounter.hospitalization

        which should have a CodeableConcept value in Encounter.hospitalization.dischargeDisposition with an example
        binding to Discharge disposition

        One or more Locations in Encounter.location

        which must have a Location Reference value in Encounter.location.location'
    Encounter_ClassHistory:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - class
        - period
        properties:
          period:
            description: The time that the episode was in the specified class.
            $ref: '#/components/schemas/Period'
          class:
            description: inpatient | outpatient | ambulatory | emergency +.
            $ref: '#/components/schemas/Coding'
    Encounter_Diagnosis:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - condition
        properties:
          condition:
            description: Reason the encounter takes place, as specified using information from another resource.
              For admissions, this is the admission diagnosis. The indication will typically be a Condition (with
              other resources referenced in the evidence.detail), or a Procedure.
            $ref: '#/components/schemas/Reference'
          use:
            description: Role that this diagnosis has within the encounter (e.g. admission, billing, discharge …).
            $ref: '#/components/schemas/CodeableConcept'
          rank:
            format: int32
            description: Ranking of the diagnosis (for each role type).
            type: integer
    Encounter_Hospitalization:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          specialArrangement:
            description: Any special requests that have been made for this hospitalization encounter, such as the
              provision of specific equipment or other things.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          reAdmission:
            description: Whether this hospitalization is a readmission and why if known.
            $ref: '#/components/schemas/CodeableConcept'
          origin:
            description: The location/organization from which the patient came before admission.
            $ref: '#/components/schemas/Reference'
          destination:
            description: Location/organization to which the patient is discharged.
            $ref: '#/components/schemas/Reference'
          dietPreference:
            description: Diet preferences reported by the patient.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          preAdmissionIdentifier:
            description: Pre-admission identifier.
            $ref: '#/components/schemas/Identifier'
          specialCourtesy:
            description: Special courtesies (VIP, board member).
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          dischargeDisposition:
            description: Category or kind of location after discharge.
            $ref: '#/components/schemas/CodeableConcept'
          admitSource:
            description: From where patient was admitted (physician referral, transfer).
            $ref: '#/components/schemas/CodeableConcept'
    Encounter_StatusHistory:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - period
        - status
        properties:
          period:
            description: The time that the episode was in the specified status.
            $ref: '#/components/schemas/Period'
          status:
            description: planned | arrived | triaged | in-progress | onleave | finished | cancelled +.
            type: string
            enum:
            - planned
            - arrived
            - triaged
            - in-progress
            - onleave
            - finished
            - cancelled
            - entered-in-error
            - unknown
    Provenance:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        required:
        - agent
        - recorded
        - target
        properties:
          reason:
            description: The reason that the activity was taking place.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          agent:
            minItems: 1
            description: An actor taking a role in an activity for which it can be assigned some degree of responsibility
              for the activity taking place.
            type: array
            items:
              $ref: '#/components/schemas/Provenance_Agent'
          activity:
            description: An activity is something that occurs over a period of time and acts upon or with entities;
              it may include consuming, processing, transforming, modifying, relocating, using, or generating entities.
            $ref: '#/components/schemas/CodeableConcept'
          signature:
            description: A digital signature on the target Reference(s). The signer should match a Provenance.agent.
              The purpose of the signature is indicated.
            type: array
            items:
              $ref: '#/components/schemas/Signature'
          location:
            description: Where the activity occurred, if relevant.
            $ref: '#/components/schemas/Reference'
          occurredPeriod:
            description: The period during which the activity occurred.
            $ref: '#/components/schemas/Period'
          recorded:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))
            description: The instant of time at which the activity was recorded.
            type: string
          occurredDateTime:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
            description: The period during which the activity occurred.
            type: string
          entity:
            description: An entity used in this activity.
            type: array
            items:
              $ref: '#/components/schemas/Provenance_Entity'
          target:
            minItems: 1
            description: The Reference(s) that were generated or updated by the activity described in this resource.
              A provenance can point to more than one target if multiple resources were created/updated by the same
              activity.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          policy:
            description: Policy or plan the activity was defined by. Typically, a single activity may have multiple
              applicable policy documents, such as patient consent, guarantor funding, etc.
            type: array
            items:
              pattern: \S*
              type: string
    Provenance_Entity:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - role
        - what
        properties:
          agent:
            description: The entity is attributed to an agent to express the agent's responsibility for that entity,
              possibly along with other agents. This description can be understood as shorthand for saying that
              the agent was responsible for the activity which generated the entity.
            type: array
            items:
              $ref: '#/components/schemas/Provenance_Agent'
          role:
            description: How the entity was used during the activity.
            type: string
            enum:
            - derivation
            - revision
            - quotation
            - source
            - removal
          what:
            description: Identity of the Entity used. May be a logical or physical uri and maybe absolute or relative.
            $ref: '#/components/schemas/Reference'
    USCoreProvenance_AgentAuthor:
      allOf:
      - $ref: '#/components/schemas/Provenance_Agent'
      - type: object
    USCoreProvenance_AgentTransmitter:
      allOf:
      - $ref: '#/components/schemas/Provenance_Agent'
      - type: object
    USCoreProvenance:
      allOf:
      - $ref: '#/components/schemas/Provenance'
      - type: object
        required:
        - agent
        - recorded
        - target
        properties:
          agent:
            minItems: 1
            type: array
            items:
              $ref: '#/components/schemas/Provenance_Agent'
          recorded:
            format: date-time
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=1..1 Type=instant Timestamp when the activity was recorded / updated'
            type: string
          target:
            minItems: 1
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Cardinality=1..* Type=Reference(Resource) The Resource this Provenance record supports'
            type: array
            items:
              $ref: '#/components/schemas/Reference'
      description: "http://hl7.org/fhir/us/core/StructureDefinition/us-core-provenance\n\n\n##Summary of the Mandatory\
        \ Requirements\n1. One or more Target References in Provenance.target\n2. An instant in Provenance.recorded\n\
        3. One or more Agents in Provenance.agent\n - which should have a CodeableConcept value in Provenance.agent.type\
        \ with an extensible binding to US Core Provenance Participant Type Codes\n - which must have a Who Reference\
        \ value in Provenance.agent.who\n - which should have an Onbehalfof Reference value in Provenance.agent.onBehalfOf\n\
        \n##Summary of the Must Support Requirements\n1. One or more Agents in Provenance.agent (Use the class USCoreProvenance_AgentAuthor)\n\
        \ - which must have a Provenance.agent.type = {\"coding\": [{\"code\": \"author\", \"system\": \"http://terminology.hl7.org/CodeSystem/provenance-participant-type\"\
        }]}\n2. An Agent in Provenance.agent (Use the class USCoreProvenance_AgentTransmitter)\n - which must have\
        \ a Provenance.agent.type = {\"coding\": [{\"code\": \"transmitter\", \"system\": \"http://hl7.org/fhir/us/core/CodeSystem/us-core-provenance-participant-type\"\
        }]}\n\n\n##Summary of Constraints\n1. onBehalfOf SHALL be present when Provenance.agent.who is a Practitioner\
        \ or Device\n\n### Follow the instructions in the Differential View documentation ###"
    Provenance_Agent:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - who
        properties:
          role:
            description: The function of the agent with respect to the activity. The security role enabling the
              agent with respect to the activity.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          onBehalfOf:
            description: The individual, device, or organization for whom the change was made.
            $ref: '#/components/schemas/Reference'
          type:
            description: The participation the agent had with respect to the activity.
            $ref: '#/components/schemas/CodeableConcept'
          who:
            description: The individual, device or organization that participated in the event.
            $ref: '#/components/schemas/Reference'
    Endpoint:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        required:
        - address
        - connectionType
        - payloadType
        - status
        properties:
          identifier:
            description: Identifier for the organization that is used to identify the endpoint across multiple disparate
              systems.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          period:
            description: The interval during which the endpoint is expected to be operational.
            $ref: '#/components/schemas/Period'
          managingOrganization:
            description: The organization that manages this endpoint (even if technically another organization is
              hosting this in the cloud, it is the organization associated with the data).
            $ref: '#/components/schemas/Reference'
          address:
            pattern: \S*
            description: The uri that describes the actual end-point to connect to.
            type: string
          payloadType:
            minItems: 1
            description: The payload type describes the acceptable content that can be communicated on the endpoint.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          contact:
            description: Contact details for a human to contact about the subscription. The primary use of this
              for system administrator troubleshooting.
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
          name:
            pattern: '[ \r\n\t\S]+'
            description: A friendly name that this endpoint can be referred to with.
            type: string
          header:
            description: Additional headers / information to send as part of the notification.
            type: array
            items:
              pattern: '[ \r\n\t\S]+'
              type: string
          payloadMimeType:
            description: The mime type to send the payload in - e.g. application/fhir+xml, application/fhir+json.
              If the mime type is not specified, then the sender could send any content (including no content depending
              on the connectionType).
            type: array
            items:
              pattern: '[^\s]+(\s[^\s]+)*'
              type: string
          connectionType:
            description: A coded value that represents the technical details of the usage of this endpoint, such
              as what WSDLs should be used in what way. (e.g. XDS.b/DICOM/cds-hook).
            $ref: '#/components/schemas/Coding'
          status:
            description: active | suspended | error | off | test.
            type: string
            enum:
            - active
            - suspended
            - error
            - 'off'
            - entered-in-error
            - test
