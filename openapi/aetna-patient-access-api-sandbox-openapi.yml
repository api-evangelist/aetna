            description: When searching, the server's search ranking score for the entry.
            type: number
    Bundle_Entry_Response:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - status
        properties:
          location:
            pattern: \S*
            description: The location header created by processing this operation, populated if the operation returns
              a location.
            type: string
          etag:
            pattern: '[ \r\n\t\S]+'
            description: The Etag for the resource, if the operation for the entry produced a versioned resource
              (see [Resource Metadata and Versioning](http.html#versioning) and [Managing Resource Contention](http.html#concurrency)).
            type: string
          lastModified:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))
            description: The date/time that the resource was modified on the server.
            type: string
          outcome:
            description: An OperationOutcome containing hints and warnings produced as part of processing this entry
              in a batch or transaction.
            $ref: '#/components/schemas/Resource'
          status:
            pattern: '[ \r\n\t\S]+'
            description: The status code returned by processing this entry. The status SHALL start with a 3 digit
              HTTP code (e.g. 404) and may contain the standard HTTP description associated with the status code.
            type: string
    Bundle_Entry_Request:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - method
        - url
        properties:
          method:
            description: In a transaction or batch, this is the HTTP action to be executed for this entry. In a
              history bundle, this indicates the HTTP action that occurred.
            type: string
            enum:
            - GET
            - HEAD
            - POST
            - PUT
            - DELETE
            - PATCH
          ifModifiedSince:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))
            description: Only perform the operation if the last updated date matches. See the API documentation
              for ["Conditional Read"](http.html#cread).
            type: string
          ifNoneExist:
            pattern: '[ \r\n\t\S]+'
            description: Instruct the server not to perform the create if a specified resource already exists. For
              further information, see the API documentation for ["Conditional Create"](http.html#ccreate). This
              is just the query portion of the URL - what follows the "?" (not including the "?").
            type: string
          url:
            pattern: \S*
            description: The URL for this entry, relative to the root (the address to which the request is posted).
            type: string
          ifNoneMatch:
            pattern: '[ \r\n\t\S]+'
            description: If the ETag values match, return a 304 Not Modified status. See the API documentation for
              ["Conditional Read"](http.html#cread).
            type: string
          ifMatch:
            pattern: '[ \r\n\t\S]+'
            description: Only perform the operation if the Etag value matches. For more information, see the API
              section ["Managing Resource Contention"](http.html#concurrency).
            type: string
    Bundle:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        required:
        - type
        properties:
          identifier:
            description: A persistent identifier for the bundle that won't change as a bundle is copied from server
              to server.
            $ref: '#/components/schemas/Identifier'
          entry:
            description: An entry in a bundle resource - will either contain a resource or information about a resource
              (transactions and history only).
            type: array
            items:
              $ref: '#/components/schemas/Bundle_Entry'
          total:
            format: int32
            description: If a set of search matches, this is the total number of entries of type 'match' across
              all pages in the search. It does not include search.mode = 'include' or 'outcome' entries and it does
              not provide a count of the number of entries in the Bundle.
            type: integer
          signature:
            description: Digital Signature - base64 encoded. XML-DSig or a JWT.
            $ref: '#/components/schemas/Signature'
          link:
            description: A series of links that provide context to this bundle.
            type: array
            items:
              $ref: '#/components/schemas/Bundle_Link'
          type:
            description: Indicates the purpose of this bundle - how it is intended to be used.
            type: string
            enum:
            - document
            - message
            - transaction
            - transaction-response
            - batch
            - batch-response
            - history
            - searchset
            - collection
          timestamp:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))
            description: The date/time that the bundle was assembled - i.e. when the resources were placed in the
              bundle.
            type: string
    Bundle_Entry:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          request:
            description: Additional information about how this entry should be processed as part of a transaction
              or batch. For history, it shows how the entry was processed to create the version contained in the
              entry.
            $ref: '#/components/schemas/Bundle_Entry_Request'
          search:
            description: Information about the search process that lead to the creation of this entry.
            $ref: '#/components/schemas/Bundle_Entry_Search'
          resource:
            description: The Resource for the entry. The purpose/meaning of the resource is determined by the Bundle.type.
            $ref: '#/components/schemas/Resource'
          fullUrl:
            pattern: \S*
            description: 'The Absolute URL for the resource. The fullUrl SHALL NOT disagree with the id in the resource
              - i.e. if the fullUrl is not a urn:uuid, the URL shall be version-independent URL consistent with
              the Resource.id. The fullUrl is a version independent reference to the resource. The fullUrl element
              SHALL have a value except that:

              * fullUrl can be empty on a POST (although it does not need to when specifying a temporary id for
              reference in the bundle)

              * Results from operations might involve resources that are not identified.'
            type: string
          response:
            description: Indicates the results of processing the corresponding 'request' entry in the batch or transaction
              being responded to or what the results of an operation where when returning history.
            $ref: '#/components/schemas/Bundle_Entry_Response'
          link:
            description: A series of links that provide context to this entry.
            type: array
            items:
              $ref: '#/components/schemas/Bundle_Link'
    Binary:
      allOf:
      - $ref: '#/components/schemas/Resource'
      - type: object
        required:
        - code
        properties:
          code:
            pattern: '[^\s]+(\s[^\s]+)*'
            description: MimeType of the binary content
            type: string
          data:
            description: The base 64 of the actual content
            type: string
          securityContext:
            description: Identifies another resource to use as proxy when enforcing access control
            $ref: '#/components/schemas/Resource'
    CarePlan_Activity:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          reference:
            description: The details of the proposed activity represented in a specific resource.
            $ref: '#/components/schemas/Reference'
          outcomeCodeableConcept:
            description: Identifies the outcome at the point when the status of the activity is assessed. For example,
              the outcome of an education activity could be patient understands (or not).
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          outcomeReference:
            description: Details of the outcome or action resulting from the activity. The reference to an "event"
              resource, such as Procedure or Encounter or Observation, is the result/outcome of the activity itself.
              The activity can be conveyed using CarePlan.activity.detail OR using the CarePlan.activity.reference
              (a reference to a “request” resource).
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          progress:
            description: Notes about the adherence/status/progress of the activity.
            type: array
            items:
              $ref: '#/components/schemas/Annotation'
          detail:
            description: A simple summary of a planned activity suitable for a general care plan system (e.g. form
              driven) that doesn't know about specific resources such as procedure etc.
            $ref: '#/components/schemas/CarePlan_Activity_Detail'
    CarePlan:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        required:
        - intent
        - status
        - subject
        properties:
          identifier:
            description: Business identifiers assigned to this care plan by the performer or other systems which
              remain constant as the resource is updated and propagates from server to server.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          partOf:
            description: A larger care plan of which this particular care plan is a component or step.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          note:
            description: General notes about the care plan not covered elsewhere.
            type: array
            items:
              $ref: '#/components/schemas/Annotation'
          period:
            description: Indicates when the plan did (or is intended to) come into effect and end.
            $ref: '#/components/schemas/Period'
          addresses:
            description: Identifies the conditions/problems/concerns/diagnoses/etc. whose management and/or mitigation
              are handled by this plan.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          goal:
            description: Describes the intended objective(s) of carrying out the care plan.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          activity:
            description: Identifies a planned action to occur as part of the plan. For example, a medication to
              be used, lab tests to perform, self-monitoring, education, etc.
            type: array
            items:
              $ref: '#/components/schemas/CarePlan_Activity'
          replaces:
            description: Completed or terminated care plan whose function is taken by this new care plan.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          subject:
            description: Identifies the patient or group whose intended care is described by the plan.
            $ref: '#/components/schemas/Reference'
          created:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
            description: Represents when this particular CarePlan record was created in the system, which is often
              a system-generated date.
            type: string
          author:
            description: When populated, the author is responsible for the care plan. The care plan is attributed
              to the author.
            $ref: '#/components/schemas/Reference'
          description:
            pattern: '[ \r\n\t\S]+'
            description: A description of the scope and nature of the plan.
            type: string
          encounter:
            description: The Encounter during which this CarePlan was created or to which the creation of this record
              is tightly associated.
            $ref: '#/components/schemas/Reference'
          instantiatesCanonical:
            description: The URL pointing to a FHIR-defined protocol, guideline, questionnaire or other definition
              that is adhered to in whole or in part by this CarePlan.
            type: array
            items:
              pattern: \S*
              type: string
          title:
            pattern: '[ \r\n\t\S]+'
            description: Human-friendly name for the care plan.
            type: string
          intent:
            description: Indicates the level of authority/intentionality associated with the care plan and where
              the care plan fits into the workflow chain.
            type: string
            enum:
            - proposal
            - plan
            - order
            - option
          instantiatesUri:
            description: The URL pointing to an externally maintained protocol, guideline, questionnaire or other
              definition that is adhered to in whole or in part by this CarePlan.
            type: array
            items:
              pattern: \S*
              type: string
          contributor:
            description: Identifies the individual(s) or organization who provided the contents of the care plan.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          supportingInfo:
            description: Identifies portions of the patient's record that specifically influenced the formation
              of the plan. These might include comorbidities, recent procedures, limitations, recent assessments,
              etc.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          category:
            description: Identifies what "kind" of plan this is to support differentiation between multiple co-existing
              plans; e.g. "Home health", "psychiatric", "asthma", "disease management", "wellness plan", etc.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          basedOn:
            description: A care plan that is fulfilled in whole or in part by this care plan.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          careTeam:
            description: Identifies all people and organizations who are expected to be involved in the care envisioned
              by this plan.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          status:
            description: Indicates whether the plan is currently being acted upon, represents future intentions
              or is now a historical record.
            type: string
            enum:
            - draft
            - active
            - on-hold
            - revoked
            - completed
            - entered-in-error
            - unknown
    CarePlan_Activity_Detail:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        required:
        - status
        properties:
          code:
            description: Detailed description of the type of planned activity; e.g. what lab test, what procedure,
              what kind of encounter.
            $ref: '#/components/schemas/CodeableConcept'
          goal:
            description: Internal reference that identifies the goals that this activity is intended to contribute
              towards meeting.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          performer:
            description: Identifies who's expected to be involved in the activity.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          quantity:
            description: Identifies the quantity expected to be supplied, administered or consumed by the subject.
            $ref: '#/components/schemas/SimpleQuantity'
          kind:
            description: A description of the kind of resource the in-line definition of a care plan activity is
              representing. The CarePlan.activity.detail is an in-line definition when a resource is not referenced
              using CarePlan.activity.reference. For example, a MedicationRequest, a ServiceRequest, or a CommunicationRequest.
            type: string
            enum:
            - Appointment
            - CommunicationRequest
            - DeviceRequest
            - MedicationRequest
            - NutritionOrder
            - Task
            - ServiceRequest
            - VisionPrescription
          reasonReference:
            description: Indicates another resource, such as the health condition(s), whose existence justifies
              this request and drove the inclusion of this particular activity as part of the plan.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          productReference:
            description: Identifies the food, drug or other product to be consumed or supplied in the activity.
            $ref: '#/components/schemas/Reference'
          description:
            pattern: '[ \r\n\t\S]+'
            description: This provides a textual description of constraints on the intended activity occurrence,
              including relation to other activities. It may also include objectives, pre-conditions and end-conditions.
              Finally, it may convey specifics about the activity such as body site, method, route, etc.
            type: string
          instantiatesCanonical:
            description: The URL pointing to a FHIR-defined protocol, guideline, questionnaire or other definition
              that is adhered to in whole or in part by this CarePlan activity.
            type: array
            items:
              pattern: \S*
              type: string
          instantiatesUri:
            description: The URL pointing to an externally maintained protocol, guideline, questionnaire or other
              definition that is adhered to in whole or in part by this CarePlan activity.
            type: array
            items:
              pattern: \S*
              type: string
          scheduledString:
            pattern: '[ \r\n\t\S]+'
            description: The period, timing or frequency upon which the described activity is to occur.
            type: string
          statusReason:
            description: Provides reason why the activity isn't yet started, is on hold, was cancelled, etc.
            $ref: '#/components/schemas/CodeableConcept'
          scheduledTiming:
            description: The period, timing or frequency upon which the described activity is to occur.
            $ref: '#/components/schemas/Timing'
          scheduledPeriod:
            description: The period, timing or frequency upon which the described activity is to occur.
            $ref: '#/components/schemas/Period'
          location:
            description: Identifies the facility where the activity will occur; e.g. home, hospital, specific clinic,
              etc.
            $ref: '#/components/schemas/Reference'
          dailyAmount:
            description: Identifies the quantity expected to be consumed in a given day.
            $ref: '#/components/schemas/SimpleQuantity'
          reasonCode:
            description: Provides the rationale that drove the inclusion of this particular activity as part of
              the plan or the reason why the activity was prohibited.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          doNotPerform:
            description: If true, indicates that the described activity is one that must NOT be engaged in when
              following the plan. If false, or missing, indicates that the described activity is one that should
              be engaged in when following the plan.
            type: boolean
          status:
            description: Identifies what progress is being made for the specific activity.
            type: string
            enum:
            - not-started
            - scheduled
            - in-progress
            - on-hold
            - completed
            - cancelled
            - stopped
            - unknown
            - entered-in-error
          productCodeableConcept:
            description: Identifies the food, drug or other product to be consumed or supplied in the activity.
            $ref: '#/components/schemas/CodeableConcept'
    USCoreCarePlan:
      allOf:
      - $ref: '#/components/schemas/CarePlan'
      - type: object
        required:
        - category
        - intent
        - status
        - subject
        - text
        properties:
          subject:
            description: 'https://www.hl7.org/fhir/conformance-rules.html#mustSupport

              References US Core Patient Profile'
            $ref: '#/components/schemas/Reference'
          text:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              status 1..1 type = code Binding: US Core Narrative Status (required)'
            $ref: '#/components/schemas/Narrative'
          category:
            minItems: 1
            description: "http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport\nFollowing elements\
              \ under category and their multiplicity are:\ncoding 1..* type = Coding\n |--system 1..1 type = uriIdentity\
              \ of the terminology system Fixed Value: http://hl7.org/fhir/us/core/CodeSystem/careplan-category\n\
              \ |--code 1..1 type = codeFixed Value: assess-plan"
            type: array
            items:
              $ref: '#/components/schemas/USCoreCodeableConceptAssessPlan'
          intent:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Binding: CarePlanIntent (required)'
            type: string
            enum:
            - proposal
            - plan
            - order
            - option
          status:
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport

              Binding: RequestStatus (required)'
            type: string
            enum:
            - draft
            - active
            - on-hold
            - revoked
            - completed
            - entered-in-error
            - unknown
      description: "##Summary of the Mandatory Requirements\n1. A Narrative in CarePlan.text\n - which must have\
        \ a code value in CarePlan.text.status with a required binding to US Core Narrative Status\n2. A code in\
        \ CarePlan.status with a required binding to RequestStatus\n3. A code in CarePlan.intent with a required\
        \ binding to Care Plan Intent\n4. One or more CodeableConcepts in CarePlan.category with an example binding\
        \ to Care Plan Category\n - which must have at least a CodeableConcept value in CarePlan.category with an\
        \ example binding to Care Plan Category\n- which must have a Coding value in CarePlan.category.coding\n\
        - which must have a fixed CarePlan.category.coding.system = http://hl7.org/fhir/us/core/CodeSystem/careplan-category\n\
        - which must have a fixed CarePlan.category.coding.code = assess-plan\n5. A Patient Reference in CarePlan.subject"
    CareTeam:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        properties:
          identifier:
            description: Business identifiers assigned to this care team by the performer or other systems which
              remain constant as the resource is updated and propagates from server to server.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          note:
            description: Comments made about the CareTeam.
            type: array
            items:
              $ref: '#/components/schemas/Annotation'
          period:
            description: Indicates when the team did (or is intended to) come into effect and end.
            $ref: '#/components/schemas/Period'
          subject:
            description: Identifies the patient or group whose intended care is handled by the team.
            $ref: '#/components/schemas/Reference'
          reasonReference:
            description: Condition(s) that this care team addresses.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          encounter:
            description: The Encounter during which this CareTeam was created or to which the creation of this record
              is tightly associated.
            $ref: '#/components/schemas/Reference'
          participant:
            description: Identifies all people and organizations who are expected to be involved in the care team.
            type: array
            items:
              $ref: '#/components/schemas/CareTeam_Participant'
          managingOrganization:
            description: The organization responsible for the care team.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          name:
            pattern: '[ \r\n\t\S]+'
            description: A label for human use intended to distinguish like teams. E.g. the "red" vs. "green" trauma
              teams.
            type: string
          telecom:
            description: A central contact detail for the care team (that applies to all members).
            type: array
            items:
              $ref: '#/components/schemas/ContactPoint'
          reasonCode:
            description: Describes why the care team exists.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          category:
            description: Identifies what kind of team. This is to support differentiation between multiple co-existing
              teams, such as care plan team, episode of care team, longitudinal care team.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          status:
            description: Indicates the current state of the care team.
            type: string
            enum:
            - proposed
            - active
            - suspended
            - inactive
            - entered-in-error
    USCoreCareTeam:
      allOf:
      - $ref: '#/components/schemas/CareTeam'
      - type: object
        required:
        - participant
        - status
        - subject
        properties:
          subject:
            description: 'https://www.hl7.org/fhir/conformance-rules.html#mustSupport


              Reference (US Core Patient Profile)'
            $ref: '#/components/schemas/Reference'
          participant:
            minItems: 1
            description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


              Following elements are under participant and their multiplicity:


              role 1..1, Type=CodeableConcept, Binding: US Core CareTeam Provider Roles (extensible)

              member 1..1, Type=Reference(US Core Patient Profile | US Core Practitioner Profile | US Core Organization
              Profile | RelatedPerson)'
            type: array
            items:
              $ref: '#/components/schemas/BackboneElement'
          status:
            description: http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport
            type: string
            enum:
            - proposed
            - active
            - suspended
            - inactive
            - entered-in-error
      description: "##Summary of the Mandatory Requirements\n1. A Patient Reference in CareTeam.subject\n2. One\
        \ or more Participants in CareTeam.participant with the following constraints: CareTeam.participant.onBehalfOf\
        \ can only be populated when CareTeam.participant.member is a Practitioner\n - which must have a CodeableConcept\
        \ value in CareTeam.participant.role with an extensible binding to US Core CareTeam Provider Roles\n - which\
        \ must have a Member Reference value in CareTeam.participant.member\n\n##Summary of the Must Support Requirements\n\
        1. A code in CareTeam.status with a required binding to CareTeamStatus\n\n##Summary of Constraints\n1. CareTeam.participant.onBehalfOf\
        \ can only be populated when CareTeam.participant.member is a Practitioner"
    CareTeam_Participant:
      allOf:
      - $ref: '#/components/schemas/BackboneElement'
      - type: object
        properties:
          period:
            description: Indicates when the specific member or organization did (or is intended to) come into effect
              and end.
            $ref: '#/components/schemas/Period'
          role:
            description: Indicates specific responsibility of an individual within the care team, such as "Primary
              care physician", "Trained social worker counselor", "Caregiver", etc.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          member:
            description: The specific person or organization who is participating/expected to participate in the
              care team.
            $ref: '#/components/schemas/Reference'
          onBehalfOf:
            description: The organization of the practitioner.
            $ref: '#/components/schemas/Reference'
    CARINBBPatientIdentifierMedicalRecordNumber:
      allOf:
      - $ref: '#/components/schemas/CARINBBPatientIdentifier'
      - type: object
      description: 'http://hl7.org/fhir/us/core/STU3.1/general-guidance.html#mustSupport


        type.coding.code="MR"'
    USDFDrugTierIDExt:
      allOf:
      - $ref: '#/components/schemas/USDFFormularyDrugExt'
      - type: object
        required:
