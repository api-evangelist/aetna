    DiagnosticReport:
      allOf:
      - $ref: '#/components/schemas/DomainResource'
      - type: object
        required:
        - code
        - status
        properties:
          identifier:
            description: Identifiers assigned to this report by the performer or other systems.
            type: array
            items:
              $ref: '#/components/schemas/Identifier'
          code:
            description: A code or name that describes this diagnostic report.
            $ref: '#/components/schemas/CodeableConcept'
          performer:
            description: The diagnostic service that is responsible for issuing the report.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          effectivePeriod:
            description: The time or time-period the observed values are related to. When the subject of the report
              is a patient, this is usually either the time of the procedure or of specimen collection(s), but very
              often the source of the date/time is not known, only the date/time itself.
            $ref: '#/components/schemas/Period'
          resultsInterpreter:
            description: The practitioner or organization that is responsible for the report's conclusions and interpretations.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          subject:
            description: The subject of the report. Usually, but not always, this is a patient. However, diagnostic
              services also perform analyses on specimens collected from a variety of other sources.
            $ref: '#/components/schemas/Reference'
          conclusionCode:
            description: One or more codes that represent the summary conclusion (interpretation/impression) of
              the diagnostic report.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          presentedForm:
            description: Rich text representation of the entire result as issued by the diagnostic service. Multiple
              formats are allowed but they SHALL be semantically equivalent.
            type: array
            items:
              $ref: '#/components/schemas/Attachment'
          encounter:
            description: The healthcare event (e.g. a patient and healthcare provider interaction) which this DiagnosticReport
              is about.
            $ref: '#/components/schemas/Reference'
          media:
            description: A list of key images associated with this report. The images are generally created during
              the diagnostic process, and may be directly of the patient, or of treated specimens (i.e. slides of
              interest).
            type: array
            items:
              $ref: '#/components/schemas/DiagnosticReport_Media'
          result:
            description: '[Observations](observation.html) that are part of this diagnostic report.'
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          conclusion:
            pattern: '[ \r\n\t\S]+'
            description: Concise and clinically contextualized summary conclusion (interpretation/impression) of
              the diagnostic report.
            type: string
          effectiveDateTime:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)(-(0[1-9]|1[0-2])(-(0[1-9]|[1-2][0-9]|3[0-1])(T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00)))?)?)?
            description: The time or time-period the observed values are related to. When the subject of the report
              is a patient, this is usually either the time of the procedure or of specimen collection(s), but very
              often the source of the date/time is not known, only the date/time itself.
            type: string
          specimen:
            description: Details about the specimens on which this diagnostic report is based.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          category:
            description: A code that classifies the clinical discipline, department or diagnostic service that created
              the report (e.g. cardiology, biochemistry, hematology, MRI). This is used for searching, sorting and
              display purposes.
            type: array
            items:
              $ref: '#/components/schemas/CodeableConcept'
          issued:
            pattern: ([0-9]([0-9]([0-9][1-9]|[1-9]0)|[1-9]00)|[1-9]000)-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|(\+|-)((0[0-9]|1[0-3]):[0-5][0-9]|14:00))
            description: The date and time that this version of the report was made available to providers, typically
              after the report was reviewed and verified.
            type: string
          imagingStudy:
            description: One or more links to full details of any imaging performed during the diagnostic investigation.
              Typically, this is imaging performed by DICOM enabled modalities, but this is not required. A fully
              enabled PACS viewer can use this information to provide views of the source images.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          basedOn:
            description: Details concerning a service requested.
            type: array
            items:
              $ref: '#/components/schemas/Reference'
          status:
            description: The status of the diagnostic report.
            type: string
            enum:
            - registered
            - partial
            - preliminary
            - final
            - amended
            - corrected
            - appended
            - cancelled
            - entered-in-error
            - unknown
