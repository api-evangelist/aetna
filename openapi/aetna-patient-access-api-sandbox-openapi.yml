        properties:
          period:
            description: The length of time between sampling times, measured in milliseconds.
            type: number
          data:
            pattern: '[ \r\n\t\S]+'
            description: A series of data points which are decimal values separated by a single space (character
              u20). The special values "E" (error), "L" (below detection limit) and "U" (above detection limit)
