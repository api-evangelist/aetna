  HTML error page, 49,382 bytes, on every path including /llms.txt); apif1.aetna.com and
  vteapif1.aetna.com return a JSON 404 envelope from the IBM API Connect gateway on every host-root
  path. What Aetna DOES serve is the spec-defined SMART App Launch discovery document, one per FHIR
  base path, and those are real JSON objects saved verbatim alongside this index. They are the only
  well-known documents this provider publishes, and they are the reason a WellKnown pointer is emitted.
  developerportal.aetna.com could not be assessed: its Akamai edge returned 403 "Access Denied" to
  every anonymous /.well-known/* request from this run's IP after an earlier burst of spec downloads,
  so no conclusion about that host is recorded here.
